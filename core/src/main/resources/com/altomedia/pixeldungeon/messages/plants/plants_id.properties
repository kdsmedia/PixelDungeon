plants.blandfruitbush.name=Blandfruit
plants.blandfruitbush.desc=Saudara jauh dari Rotberry, buah berbentuk pir dari semak Blandfruit terasa seperti debu kering. Buahnya menjijikkan dan tidak bernutrisi tapi tidak beracun. mungkin bisa dimasak.
plants.blandfruitbush$seed.name=biji blandfruit

plants.blindweed.name=Blindweed
plants.blindweed.desc=Saat disentuh, Blindweed mati dalam kilatan cahaya terang. Kilatan itu cukup kuat untuk mendisorientasi selama beberapa detik.
plants.blindweed$seed.name=biji blindweed

plants.dreamfoil.name=Dreamfoil
plants.dreamfoil.refreshed=Kau merasa segar.
plants.dreamfoil.desc=Bunga berduri Dreamfoil mengandung bahan kimia yang dikenal sebagai agen penetral kuat. Sebagian besar makhluk lemah kewalahan dan pingsan, yang memberi nama tanaman ini.
plants.dreamfoil$seed.name=biji dreamfoil

plants.earthroot.name=Earthroot
plants.earthroot.desc=Saat makhluk menyentuh Earthroot, akarnya menciptakan semacam baju zirah alami yang tidak bergerak di sekitarnya.
plants.earthroot$seed.name=biji earthroot
plants.earthroot$armor.name=Baju zirah herbal
plants.earthroot$armor.desc=Semacam baju zirah alami yang tidak bergerak melindungimu. Baju zirah membentuk plat kulit kayu dan tali, melilit tubuhmu.\n\nBaju zirah herbal ini akan menyerap 50%% dari semua kerusakan fisik yang kau terima, sampai akhirnya kehabisan daya tahan dan runtuh. Baju zirah juga tidak bergerak, jika kau mencoba bergerak ia akan hancur dan hilang.\n\nBaju zirah tersisa: %d.

plants.fadeleaf.name=Fadeleaf
plants.fadeleaf.desc=Menyentuh Fadeleaf akan menelportasi makhluk apa pun ke tempat acak di lantai saat ini.
plants.fadeleaf$seed.name=biji fadeleaf

plants.firebloom.name=Firebloom
plants.firebloom.desc=Saat sesuatu menyentuh Firebloom, ia meledak menjadi api.
plants.firebloom$seed.name=biji firebloom

plants.icecap.name=Icecap
plants.icecap.desc=Saat disentuh, Icecap melepaskan hembusan serbuk sari beku. Efek pembekuan jauh lebih kuat jika lingkungan lembap.
plants.icecap$seed.name=biji icecap

plants.plant$seed.seed_of=biji %s
plants.plant$seed.ac_plant=TANAM
plants.plant$seed.info=Lempar biji ini ke tempat di mana kau ingin menumbuhkan tanaman.\n\n%s

plants.rotberry.name=Rotberry
plants.rotberry.desc=Berry dari semak rotberry muda terasa seperti kematian yang manis.\n\nDalam beberapa hari, semak rotberry ini akan tumbuh menjadi rot heart lain.
plants.rotberry$seed.name=biji rotberry

plants.sorrowmoss.name=Sorrowmoss
plants.sorrowmoss.desc=Sorrowmoss adalah bunga (bukan lumut) dengan kelopak setajam silet, dilapisi racun mematikan.
plants.sorrowmoss$seed.name=biji sorrowmoss

plants.starflower.name=Starflower
plants.starflower.desc=Tanaman yang sangat langka, Starflower dikatakan memberikan kekuatan suci kepada siapa pun yang menyentuhnya.
plants.starflower$seed.name=biji starflower

plants.stormvine.name=Stormvine
plants.stormvine.desc=Gravitasi memengaruhi tanaman Stormvine secara aneh, memungkinkan sulurnya yang biru lembut 'menggantung' di udara. Apa pun yang terjebak dalam sulur terpengaruh hal ini, dan menjadi disorientasi.
plants.stormvine$seed.name=biji stormvine

plants.sungrass.name=Sungrass
plants.sungrass.desc=Sungrass terkenal karena getahnya yang menyembuhkan secara perlahan tapi efektif.
plants.sungrass$seed.name=biji sungrass
plants.sungrass$health.name=Penyembuhan Herbal
plants.sungrass$health.desc=Sungrass memiliki sifat penyembuhan yang sangat baik, meskipun tidak secepat ramuan penyembuhan.\n\nKau saat ini sedang memulihkan kesehatan perlahan dari tanaman sungrass. Mengambil kerusakan saat menyembuhkan akan mengurangi efektivitas penyembuhan, dan bergerak menjauhi tanaman akan menghentikan efek penyembuhan.\n\nPenyembuhan tersisa: %d.
