actors.blobs.highlytoxicgas.desc=Awan gas beracun mematikan berwarna kehijauan berputar di sini.
actors.blobs.highlytoxicgas.rankings_desc=Keracunan
actors.blobs.highlytoxicgas.ondeath=Racun sengit mengkorosi tubuhmu...
