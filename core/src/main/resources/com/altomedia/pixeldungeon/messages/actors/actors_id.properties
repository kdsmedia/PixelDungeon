###blobs
actors.blobs.confusiongas.desc=Awan gas kebingungan berputar-putar di sini.

actors.blobs.fire.desc=Api berkobar di sini.

actors.blobs.sacrificialfire.desc=Api korban sedang menyala di sini. Setiap makhluk yang menyentuh nyala api ditandai sebagai korban bagi dungeon.
actors.blobs.sacrificialfire.worthy=Korban ini layak.
actors.blobs.sacrificialfire.unworthy=Korban ini tidak bernilai.
actors.blobs.sacrificialfire.reward=Korbanmu layak, dan begitu juga dirimu.

actors.blobs.foliage.desc=Sinar cahaya menembus kegelapan taman bawah tanah.

actors.blobs.goowarn.desc=Butir-butir energi gelap berkerumun di sini!

actors.blobs.paralyticgas.desc=Awan gas pelumpuh berputar-putar di sini.

actors.blobs.stenchgas.desc=Awan bau busuk menyengat berputar-putar di sini.

actors.blobs.toxicgas.desc=Awan gas beracun kehijauan berputar-putar di sini.
actors.blobs.toxicgas.rankings_desc=Tersedak
actors.blobs.toxicgas.ondeath=Kau mati karena gas beracun...

actors.blobs.venomgas.desc=Awan bisa asam yang menjijikkan berputar-putar di sini.

actors.blobs.waterofawareness.procced=Saat kau meneguk seteguk, kau merasa pengetahuan mengalir ke dalam pikiranmu. Kini kau tahu segalanya tentang item yang kau pakai. Kau juga merasakan semua item di lantai ini dan mengetahui semua rahasianya.
actors.blobs.waterofawareness.desc=Kekuatan pengetahuan memancar dari air sumur ini. Ambil seteguk darinya untuk mengungkap semua rahasia item yang kau pakai.

actors.blobs.waterofhealth.procced=Saat kau meneguk seteguk, kau merasa lukamu sembuh sepenuhnya.
actors.blobs.waterofhealth.desc=Kekuatan kesehatan memancar dari air sumur ini. Ambil seteguk darinya untuk menyembuhkan lukamu dan mengatasi rasa lapar.

actors.blobs.wateroftransmutation.desc=Kekuatan perubahan memancar dari air sumur ini. Lemparkan sebuah item ke dalam sumur untuk mengubahnya menjadi sesuatu yang lain.

actors.blobs.web.desc=Segalanya tertutup jaring tebal di sini.

actors.blobs.smokeofblindness.desc=Awan asap yang mengganggu berputar-putar di sini.

###buffs
actors.buffs.amok.name=Amok
actors.buffs.amok.desc=Amok menyebabkan kondisi amarah dan kebingungan yang besar pada sasarannya.\n\nSaat sebuah makhluk terkena amok, ia akan menyerang apa pun yang berada di dekatnya, baik teman maupun musuh.\n\nGiliran amok tersisa: %s.

actors.buffs.barkskin.name=Barkskin
actors.buffs.barkskin.desc=Kulitmu mengeras, terasa kasar dan padat seperti kulit kayu.\n\nKulit yang mengeras meningkatkan baju zirah efektifmu, membuatmu lebih mampu bertahan dari serangan fisik. Bonus baju zirah akan berkurang 1 poin setiap giliran hingga habis.\n\nBaju zirahmu saat ini ditingkatkan sebesar: %d.

actors.buffs.berserk.angered=Marah
actors.buffs.berserk.berserk=Berserk
actors.buffs.berserk.exhausted=Kelelahan
actors.buffs.berserk.recovering=Pulih
actors.buffs.berserk.angered_desc=Tingkat keparahan luka sang berserker memperkuat pukulannya. Semakin rendah kesehatan sang berserker, semakin besar bonus kerusakan yang ia berikan. Bonus ini jauh lebih kuat saat sang berserker hampir mati.\n\nSaat sang berserker dibawa ke 0 HP dan mengenakan segelnya, ia akan amuk dan _menolak mati_ selama beberapa saat.\n\nKerusakan saat ini: %.2f%%.
actors.buffs.berserk.berserk_desc=Di ambang kematian, ketakutan dan ketidakpastian menghilang, menyisakan hanya amarah. Dalam kondisi nyaris mati ini sang berserker sangat kuat, _memberikan kerusakan ganda, memperoleh perisai bonus, dan menolak mati._\n\nPerisai bonus ini semakin kuat dengan makin baiknya baju zirah sang berserker, dan akan berangsur-angsur berkurang seiring waktu. Saat perisai ini berkurang hingga 0, sang berserker akan menyerah dan mati.\n\nBentuk penyembuhan apa pun akan mengembalikan sang berserker ke kestabilan, namun ia akan kelelahan. Saat kelelahan, sang berserker akan mengalami pengurangan kerusakan yang besar selama beberapa saat, dan kemudian harus mendapatkan pengalaman sebelum dapat berserk lagi.
actors.buffs.berserk.exhausted_desc=Kekuatan batin memiliki batasnya. Sang berserker kelelahan, melemahkannya dan membuatnya tak dapat marah.\n\nDalam kondisi ini sang berserker memberikan kerusakan yang jauh berkurang, dan akan segera mati pada 0 kesehatan.\n\nGiliran kelelahan tersisa: %d\nKerusakan saat ini: %.2f%%.
actors.buffs.berserk.recovering_desc=Kekuatan batin memiliki batasnya. Sang berserker harus beristirahat sebelum menggunakan amarahnya lagi.\n\nSaat pulih sang berserker masih memberikan bonus kerusakan, namun akan segera mati pada 0 kesehatan.\n\nTingkat hingga pulih: %.2f\nKerusakan saat ini: %.2f%%.
actors.buffs.berserk.rankings_desc=Berserk hingga Mati

actors.buffs.bleeding.name=Pendarahan
actors.buffs.bleeding.ondeath=Kau mati karena pendarahan...
actors.buffs.bleeding.heromsg=Kau sedang berdarah!
actors.buffs.bleeding.rankings_desc=Mati karena Pendarahan
actors.buffs.bleeding.desc=Luka itu mengeluarkan jumlah darah yang memprihatinkan.\n\nPendarahan menyebabkan kerusakan setiap giliran. Setiap giliran kerusakan berkurang dalam jumlah acak, hingga pendarahan akhirnya berhenti.\n\nKerusakan pendarahan saat ini: %d.

actors.buffs.bless.name=Diberkati
actors.buffs.bless.desc=Ledakan fokus yang besar, beberapa mengatakan ini terilhami oleh para dewa.\n\nBerkat secara signifikan meningkatkan akurasi dan penghindaran, membuat yang diberkati jauh lebih efektif dalam pertempuran.\n\nGiliran berkat tersisa: %s.

actors.buffs.blindness.name=Buta
actors.buffs.blindness.heromsg=Kau menjadi buta!
actors.buffs.blindness.desc=Kebutaan mengubah dunia di sekeliling menjadi kabut gelap.\n\nSaat buta, seorang karakter tak dapat melihat lebih dari satu petak di depannya, membuat serangan jarak jauh tidak berguna dan sangat mudah kehilangan jejak musuh yang jauh. Selain itu, pahlawan yang buta tidak dapat membaca gulungan atau buku.\n\nGiliran kebutaan tersisa: %s.

actors.buffs.bloodsuck.name=bloodsuck
actors.buffs.bloodsuck.desc=Kau tak bisa memuaskan hasratmu hanya dengan membunuh. Setiap kali kau membunuh lawan, kau akan mengisap esensi kehidupannya dan meningkatkan kesehatan maksimummu.\n\nGiliran tersisa: %s.
actors.buffs.bloodsuck.nibble=Jilatan Kecil

actors.buffs.burning.name=Terbakar
actors.buffs.burning.heromsg=Kau terbakar!
actors.buffs.burning.burnsup=%s terbakar habis!
actors.buffs.burning.ondeath=Kau terbakar hingga mati...
actors.buffs.burning.rankings_desc=Terbakar Jadi Abu
actors.buffs.burning.desc=Sedikit hal yang lebih menyedihkan daripada dilahap oleh api.\n\nApi akan memberikan kerusakan setiap giliran hingga dipadamkan oleh air atau habis sendirinya. Api dapat dipadamkan dengan melangkah ke air, atau dari percikan ramuan yang pecah.\n\nSelain itu, api dapat membakar medan atau item yang mudah terbakar yang bersentuhan dengannya.\n\nGiliran terbakar tersisa: %s.

actors.buffs.charm.name=Terpesona
actors.buffs.charm.heromsg=Kau terpesona!
actors.buffs.charm.desc=Charm adalah sihir manipulatif yang dapat membuat musuh untuk sementar saling menyukai.\n\nKarakter yang terkena charm tidak dapat menyerang langsung musuh yang mempesonanya. Namun menyerang sasaran lain masih dimungkinkan.\n\nGiliran charm tersisa: %s.

actors.buffs.chill.name=Terdinginkan
actors.buffs.chill.freezes=%s membeku!
actors.buffs.chill.desc=Belum membeku, tapi masih terlalu dingin.\n\nSasaran yang terdinginkan melakukan semua tindakan lebih lambat, tergantung pada berapa banyak giliran yang tersisa pada efek. Pada kondisi terburuknya, ini setara dengan menjadi diperlambat.\n\nGiliran dingin tersisa: %1$s.\nKecepatan berkurang sebesar: %2$s%%

actors.buffs.combo.name=Combo
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=Kau harus menargetkan musuh dalam jangkauan serangan.
actors.buffs.combo.clobber_prompt=Pilih sasaran untuk Clobber\nMembuat bingung dan mundur
actors.buffs.combo.clobber_desc=_Clobber_ saat ini tersedia. Serangan ini _mendorong musuh mundur dan membuat mereka bingung,_ namun memberikan kerusakan yang berkurang. Sangat baik untuk memperoleh sedikit waktu selama pertarungan.
actors.buffs.combo.cleave_prompt=Pilih sasaran untuk Cleave\nJika membunuh, mempertahankan combo
actors.buffs.combo.cleave_desc=_Cleave_ saat ini tersedia. Serangan ini memberikan kerusakan yang lebih besar, dan _jika membunuh musuh, akan mempertahankan combo alih-alih mengresetnya._ Sangat baik untuk membangun combo saat melawan beberapa musuh.
actors.buffs.combo.slam_prompt=Pilih sasaran untuk Slam\nMelindungimu berdasarkan kerusakan
actors.buffs.combo.slam_desc=_Slam_ saat ini tersedia. Serangan ini memberikan kerusakan yang lebih besar, dan _memberimu perisai_ sebanding dengan kerusakan yang kau berikan. Sangat baik untuk mengakhiri pertarungan, membuatmu membawa tenaga ke pertarungan berikutnya.
actors.buffs.combo.crush_prompt=Pilih sasaran untuk Crush\nMemberikan kerusakan besar
actors.buffs.combo.crush_desc=_Crush_ saat ini tersedia. Serangan dahsyat ini _memberikan kerusakan masif secara sangat konsisten._ Sangat baik untuk menjatuhkan lawan yang kuat dari kesehatan tinggi!
actors.buffs.combo.fury_prompt=Lepaskan amarah pada musuh mana?\nMenyerang berkali-kali dengan cepat
actors.buffs.combo.fury_desc=_Fury_ saat ini tersedia. Serangan dahsyat ini _mengenai sebanyak jumlah combo-mu saat ini,_ meski dengan kerusakan yang berkurang. Fury sangat baik jika kau memiliki enchant senjata, karena enchant akan aktif pada setiap serangan!
actors.buffs.combo.desc=Sang gladiator dapat menyerang semakin cepat saat terus-menerus mengenai satu sasaran, namun ini akan hilang jika berganti sasaran. Gladiator membangun momentum saat mendaratkan pukulan yang berhasil, namun terlalu lama menyerang, meleset lebih dari sekali, atau menggunakan item akan mengreset penghitung combo ke 0.\n\nMembangun combo membuka kemampuan penyelesai khusus: serangan kuat yang tak bisa meleset! Penyelesai yang berbeda tersedia pada jumlah combo 5 dan 10.

actors.buffs.corruption.name=Terkorupsi
actors.buffs.corruption.desc=Korupsi meresap ke dalam esensi sebuah makhluk, memutarbalikkannya melawan tabiat aslinya.\n\nMakhluk yang terkorupsi akan menyerang dan memprovokasi sekutunya, serta mengabaikan musuh lamanya. Korupsi juga merusak, dan akan perlahan menyebabkan sasaran menyerah.\n\nKorupsi bersifat permanen, efeknya hanya berakhir dengan kematian.

actors.buffs.dementage.name=Dementage
actors.buffs.dementage.desc=Makhluk ini telah menderita kebingungan parah. Jiwanya telah dikendalikan oleh sang penyeru mantra, sepenuhnya kehilangan kesadaran diri dan turun menjadi mesin pembunuh bagi sang penyeru mantra.\n\nBerbeda dengan korupsi, dementage tidak menghancurkan tubuh korban, dan makhluk yang terkena menjadi pengikut setia sang penyeru mantra.

actors.buffs.cripple.name=Cacat
actors.buffs.cripple.heromsg=Kau menjadi cacat!
actors.buffs.cripple.desc=Kau cukup yakin kaki tidak dimaksudkan untuk membungkuk seperti itu.\n\nCacat membagi dua kecepatan gerak, membuat bergerak satu petak biasanya memakan dua giliran alih-alih satu.\n\nGiliran cacat tersisa: %s.

actors.buffs.disarm.name=kehilangan senjata
actors.buffs.disarm.desc=Kau kehilangan kemampuan untuk bertarung dan tak dapat menyerang siapa pun dalam waktu singkat.\n\nGiliran disarm tersisa: %s.

actors.buffs.drowsy.name=Mengantuk
actors.buffs.drowsy.desc=Kekuatan magis membuatmu sulit untuk tetap terjaga.\n\nPahlawan dapat menolak rasa kantuk dengan menerima kerusakan atau dengan berada pada kesehatan penuh.\n\nSetelah beberapa giliran, sasaran akan jatuh ke dalam tidur magis yang nyenyak.

actors.buffs.earthimbue.name=Diberdayakan Bumi
actors.buffs.earthimbue.desc=Kau diberdayakan dengan kekuatan bumi!\n\nSemua serangan fisik akan memerintahkan akar untuk mengunci musuh di tempat selama efek berlangsung.\n\nGilarian earth imbue tersisa: %s.

actors.buffs.fireimbue.name=Diberdayakan Api
actors.buffs.fireimbue.desc=Kau diberdayakan dengan kekuatan api!\n\nSemua serangan fisik akan memiliki peluang untuk membakar musuh. Selain itu, kau sepenuhnya kebal terhadap efek api.\n\nGiliran fire imbue tersisa: %s.

actors.buffs.frost.name=Membeku
actors.buffs.frost.freezes=%s membeku!
actors.buffs.frost.desc=Jangan dikelirukan dengan pembekuan padat, pembekuan yang lebih jinak ini hanya melapisi sasaran dengan es.\n\nPembekuan bekerja mirip dengan paralisis, membuat sasaran tidak dapat bertindak. Berbeda dengan paralisis, pembekuan segera dibatalkan jika sasaran menerima kerusakan, karena es akan pecah.\n\nGiliran membeku tersisa: %s.

actors.buffs.fury.name=Murka
actors.buffs.fury.heromsg=Kau menjadi murka!
actors.buffs.fury.desc=Kau marah, musuh tak akan menyukaimu saat kau marah.\n\nAmarah besar membakar dalam dirimu, meningkatkan kerusakan yang kau berikan dengan serangan fisik sebesar 50%%.\n\nAmarah ini akan bertahan selama kau terluka di bawah 50%% kesehatan.

actors.buffs.gasesimmunity.name=Kebal terhadap gas
actors.buffs.gasesimmunity.desc=Beberapa kekuatan aneh menyaring udara di sekitarmu, tidak menyebabkan kerusakan apa pun padamu, namun memblokir segalanya kecuali udara sehingga efektif kau bahkan tak dapat mencium apa pun!\n\nKau kebal terhadap efek semua gas selama buff ini berlangsung.\n\nGiliran kekebalan gas tersisa: %s.

actors.buffs.hunger.hungry=Lapar
actors.buffs.hunger.starving=Kelaparan
actors.buffs.hunger.onhungry=Kau lapar.
actors.buffs.hunger.onstarving=Kau kelaparan!
actors.buffs.hunger.ondeath=Kau mati kelaparan...
actors.buffs.hunger.cursedhorn=Tanduk terkutuk mencuri sebagian energi makanan saat kau makan.
actors.buffs.hunger.rankings_desc=Mati Kelaparan
actors.buffs.hunger.desc_intro_hungry=Kau dapat merasakan perutmu meminta makanan, namun belum terlalu mendesak.
actors.buffs.hunger.desc_intro_starving=Kau sangat lapar hingga terasa sakit.
actors.buffs.hunger.desc=\n\nKelaparan perlahan meningkat saat kau menghabiskan waktu di dungeon, akhirnya kau akan mulai kelaparan. Saat kelaparan kau akan perlahan kehilangan kesehatan alih-alih memulihkannya.\n\nMembagi jatah itu penting! Jika kau memiliki kesehatan yang tersisa, kelaparan bukanlah ide buruk jika itu berarti akan ada lebih banyak makanan nanti. Pembagian jatah yang efektif dapat membuat makanan bertahan jauh lebih lama!

actors.buffs.invisibility.name=Tak Terlihat
actors.buffs.invisibility.desc=Kau sepenuhnya menyatu dengan medan di sekeliling, membuatmu mustahil terlihat.\n\nSaat kau tak terlihat musuh tak dapat menyerang atau mengikutimu. Serangan fisik dan efek magis (seperti gulungan dan tongkat sihir) akan segera membatalkan ketidakkelihatan.\n\nGiliran ketidakkelihatan tersisa: %s.

actors.buffs.levitation.name=Melayang
actors.buffs.levitation.desc=Kekuatan magis membuatmu melayang di atas tanah, membuatmu merasa tanpa bobot.\n\nSaat melayang kau mengabaikan semua efek berbasis tanah. Perangkap tak akan terpicu, air tak akan memadamkan api, tanaman tak akan terinjak, akar tak akan mengenaimu, dan kau akan melayang tepat di atas lubang. Hati-hati, karena semua hal ini dapat berlaku seketika levitation berakhir!\n\nGiliran levitation tersisa: %s.

actors.buffs.light.name=Diterangi
actors.buffs.light.desc=Bahkan di Darkest Dungeon, cahaya yang stabil di sisimu selalu menenangkan.\n\nCahaya membantu menjauhkan kegelapan, memungkinkanmu melihat pada jarak yang wajar meski di lingkungan ini.\n\nGiliran penerangan tersisa: %s.

actors.buffs.lockedfloor.name=Lantai Terkunci
actors.buffs.lockedfloor.desc=Lantai saat ini terkunci, dan kau tak dapat meninggalkannya!\n\nSaat sebuah lantai terkunci, kau tak akan merasa lapar atau menerima kerusakan dari kelaparan. Selain itu, jika kau tidak berupaya mengalahkan bos lantai ini, efek regenerasi pasif juga akan berhenti.\n\nSelain itu, jika kau dibangkitkan oleh ankh yang tidak diberkati saat lantai terkunci, maka lantai akan direset.\n\nBunuh bos lantai ini untuk membuka kunci.

actors.buffs.magicalsleep.name=Tidur Magis
actors.buffs.magicalsleep.toohealthy=Kau terlalu sehat, dan menolak dorongan untuk tidur.
actors.buffs.magicalsleep.fallasleep=Kau jatuh ke dalam tidur magis yang nyenyak.
actors.buffs.magicalsleep.wakeup=Kau bangun merasa segar dan sehat.
actors.buffs.magicalsleep.desc=Karakter ini telah jatuh ke dalam tidur magis yang nyenyak yang tak akan ia bangunkan secara alami.\n\nTidur magis mirip dengan tidur biasa, kecuali bahwa hanya kerusakan yang akan membuat sasaran terbangun.\n\nBagi pahlawan, tidur magis memiliki sifat restoratif, memungkinkannya sembuh dengan cepat saat beristirahat.

actors.buffs.mindvision.name=Penglihatan batin
actors.buffs.mindvision.desc=Dengan entah bagaimana kau dapat melihat semua makhluk di lantai ini melalui pikiranmu. Rasanya aneh.\n\nSemua karakter di lantai ini terlihat olehmu selama kau memiliki penglihatan batin. Melihat makhluk melalui penglihatan batin dianggap sebagai terlihat atau berada di dekat untuk tujuan banyak efek magis.\n\nGiliran penglihatan batin tersisa: %s.

actors.buffs.moonnight.name=moonnight
actors.buffs.moonnight.desc=Membekukan sekitar di malam hari.

actors.buffs.ooze.name=Lendir kaustik
actors.buffs.ooze.heromsg=Lendir kaustik memakan dagingmu. Basuhlah!
actors.buffs.ooze.ondeath=Kau meleleh...
actors.buffs.ooze.rankings_desc=Larut
actors.buffs.ooze.desc=Asam lengket ini menempel pada daging, perlahan melelehkannya.\n\nLendir akan memberikan kerusakan konsisten hingga dibasuh dengan air.\n\nLendir tidak habis sendiri dan harus dibuang dengan air.

actors.buffs.paralysis.name=Terlumpuh
actors.buffs.paralysis.heromsg=Kau terlumpuh!
actors.buffs.paralysis.desc=Sering kali hal terburuk yang dapat dilakukan adalah tidak berbuat apa-apa.\n\nParalisis menghentikan semua tindakan sepenuhnya, memaksa sasaran menunggu hingga efek berlalu. Rasa sakit dari menerima kerusakan juga dapat membuat karakter lepas dari paralisis.\n\nGiliran paralisis tersisa: %s.

actors.buffs.poison.name=Tersakit racun
actors.buffs.poison.heromsg=Kau terkena racun!
actors.buffs.poison.ondeath=Kau mati karena racun...
actors.buffs.poison.rankings_desc=Menyerah pada Racun
actors.buffs.poison.desc= Racun menyebar melalui tubuh, perlahan merusak fungsi internalnya.\n\nRacun memberikan kerusakan setiap giliran sebanding dengan berapa lama hingga habis.\n\nGiliran racun tersisa: %s.

actors.buffs.rage.name=Marah
actors.buffs.rage.heromsg=Kau mendidih oleh amarah!
actors.buffs.rage.desc=Makhluk yang marah dapat menyerang jauh lebih cepat.\n\nGiliran tersisa: %s

actors.buffs.recharging.name=Mengisi daya
actors.buffs.recharging.desc=Energi mengalir melalui dirimu, meningkatkan laju pengisian tongkat sihir dan tongkat stafmu.\n\nSetiap giliran buff ini akan meningkatkan pengisian saat ini sebesar seperempat, di samping pengisian reguler.\n\nGiliran recharging tersisa: %s.

actors.buffs.roots.name=Terpaut akar
actors.buffs.roots.heromsg=Kau tak dapat bergerak!
actors.buffs.roots.desc=Akar (magis atau alami) menangkap kaki, memaksa mereka ke tanah.\n\nAkar mengunci sasaran di tempat, membuatnya mustahil bergerak, namun tindakan lain tidak terpengaruh.\n\nGiliran akar tersisa: %s.

actors.buffs.senile.name=senile
actors.buffs.senile.desc=Makhluk malang ini kehilangan sebagian kesehatan maksimum (%d%%) karena telah menderita keruntuhan mental.\n\nGiliran senile tersisa: %s.

actors.buffs.shadows.name=Menyatu Bayangan
actors.buffs.shadows.desc=Kau menyatu dengan bayangan di sekelilingmu, memberimu ketidakkelihatan dan memperlambat metabolismemu.\n\nSaat kau tak terlihat musuh tak dapat menyerang atau mengikutimu. Sebagian besar serangan fisik dan efek magis (seperti gulungan dan tongkat sihir) akan segera membatalkan ketidakkelihatan. Selain itu, saat menyatu bayangan, laju laparmu diperlambat.\n\nKau akan tetap menyatu bayangan hingga kau meninggalkan bayangan atau musuh bersentuhan denganmu.

actors.buffs.slow.name=Diperlambat
actors.buffs.slow.desc=Sihir perlambatan memengaruhi laju waktu sasaran, baginya segalanya bergerak sangat cepat.\n\nKarakter yang diperlambat melakukan semua tindakan dalam dua kali lipat waktu yang biasanya mereka butuhkan.\n\nGiliran perlambatan tersisa: %s.

actors.buffs.snipersmark.name=Tanda Penembak Jitu
actors.buffs.snipersmark.desc=Sang penembak jitu memfokuskan pada sasaran di dekatnya, memperoleh peningkatan kecepatan serangan dan penetrasi baju zirah saat menyerangnya.\n\nSang penembak jitu akan tetap fokus hingga ia berganti sasaran, berhenti menyerang, atau sasaran mati.

actors.buffs.soulmark.name=Tandai Jiwa
actors.buffs.soulmark.desc=Sang warlock telah mengetuk jiwa makhluk ini. Ia akan sembuh dan memuaskan laparnya saat makhluk itu menerima kerusakan fisik darinya.\n\nTingkat soul mark: %d. Giliran soul mark tersisa: %s.

actors.buffs.staminaoverload.name=Kelebihan stamina
actors.buffs.staminaoverload.desc=Kelebihan stamina meningkatkan HP maksimummu, namun efek ini memudar seiring waktu.\n\nPeningkatan kesehatan saat ini: %s

actors.buffs.terror.name=Teror
actors.buffs.terror.desc=Teror adalah sihir manipulatif yang memaksa sasaran ke dalam kepanikan tak terkendali.\n\nKarakter yang teror dipaksa melarikan diri dari lawannya, berusaha menaruh sebanyak mungkin pintu dan dinding di antara mereka. Namun guncangan rasa sakit cukup untuk mengakhiri efek ini.\n\nGiliran teror tersisa: %s.

actors.buffs.toxicimbue.name=Diberdayakan Toksisitas
actors.buffs.toxicimbue.desc=Kau diberdayakan dengan energi beracun!\n\nSaat kau bergerak gas beracun akan terus keluar darimu, merusak musuhmu. Kau kebal terhadap gas beracun dan racun selama efek berlangsung.\n\nGiliran toxic imbue tersisa: %s.

actors.buffs.unbalance.name=Unbalance
actors.buffs.unbalance.desc=Gerakan kacau dalam pertarungan lebih mematikan daripada napas tak teratur. Kau kehilangan kemampuan untuk menghindar dalam %s giliran berikutnya.

actors.buffs.venom.name=Terbisa
actors.buffs.venom.desc=Bisa adalah racun asam yang sangat kaustik dan berbahaya.\n\nBerbeda dengan racun yang kerusakannya menurun seiring waktu, bisa memberikan kerusakan yang meningkat semakin lama menetap pada sasaran.\n\nGiliran bisa tersisa: %1$s.\nKerusakan bisa saat ini: %2$d.

actors.buffs.vertigo.name=Vertigo
actors.buffs.vertigo.desc=Berjalan lurus bisa sulit saat seluruh dunia berputar.\n\nSaat berada di bawah efek vertigo, karakter yang mencoba bergerak akan pergi ke arah acak, alih-alih arah yang mereka tuju.\n\nGiliran vertigo tersisa: %s.

actors.buffs.weakness.name=Dilemahkan
actors.buffs.weakness.heromsg=Kau merasa dilemahkan!
actors.buffs.weakness.desc=Perlengkapanmu tiba-tiba terasa jauh lebih berat.\n\nSihir pelemahan memengaraimu, mengurangi kekuatan efektifmu sebesar 2 poin.\n\nGiliran pelemahan tersisa: %s.

#hero
actors.hero.hero.name=kau
actors.hero.hero.leave=Seseorang tidak begitu saja meninggalkan Pixel Dungeon.
actors.hero.hero.level_up=Naik level!
actors.hero.hero.new_level=Selamat datang di level %d! Kini kau lebih sehat dan lebih mahir dalam bertarung.
actors.hero.hero.level_cap=Kau tak dapat menjadi lebih kuat, namun pengalamanmu memberimu lonjakan kekuatan!
actors.hero.hero.you_now_have=Kau kini memiliki %s.
actors.hero.hero.something_else=Ada sesuatu lagi di sini.
actors.hero.hero.locked_chest=Peti ini terkunci dan kau tak punya kunci yang cocok.
actors.hero.hero.locked_door=Kau tak punya kunci yang cocok.
actors.hero.hero.noticed_smth=Kau memperhatikan sesuatu.
actors.hero.hero.wait=...
actors.hero.hero.search=cari
actors.hero.hero.search_distracted=Kau tak dapat berkonsentrasi, mencari butuh waktu sejenak.
actors.hero.hero.pain_resist=Rasa sakit membantumu menolak dorongan untuk tidur.
actors.hero.hero.revive=Ankh meledak dengan energi pemberi kehidupan!
actors.hero.hero.mental_resist=menolak
actors.hero.hero.clock-day=Siang tiba.
actors.hero.hero.clock-night=Malam turun.
actors.hero.hero.clock-midnight=Tengah malam tiba.
actors.hero.hero.cant-do-this=Kau tak dapat melakukan seperti ini.

actors.hero.heroclass.warrior=pejuang
actors.hero.heroclass.warrior-desc=Pejuang memiliki konstitusi yang lebih kuat dan memulai dengan segel pecah yang dapat ditempelkan pada baju zirah.
actors.hero.heroclass.warrior_perk1=Pejuang memulai dengan segel pecah yang dapat ia tempelkan pada baju zirah. Ia akan perlahan menghasilkan perisai saat mengenakan baju zirah dengan segel yang ditempel.
actors.hero.heroclass.warrior_perk2=Segel dapat dipindahkan antar baju zirah, membawa satu peningkatan bersamanya.
actors.hero.heroclass.warrior_perk3=Pejuang memiliki keunggulan fisik dibanding pahlawan lain namun ia kurang tahan terhadap kelaparan. Sebarang potongan makanan memulihkan sebagian kesehatan saat dimakan.
actors.hero.heroclass.warrior_perk4=Ramuan Penyembuhan teridentifikasi sejak awal.
actors.hero.heroclass.warrior_perk5=Pejuang suka minum dan membawa sebotol grog di awal. Ia tak akan pernah mabuk, dan mengurangi lebih banyak tekanan setelah minum.

actors.hero.heroclass.mage=penyihir
actors.hero.heroclass.mage_perk1=Penyihir memulai dengan Tongkat Staf unik, yang dapat diberdayakan dengan sifat-sifat sebuah tongkat sihir.
actors.hero.heroclass.mage_perk2=Tongkat staf Penyihir dapat digunakan sebagai senjata jarak dekat atau tongkat sihir yang lebih kuat.
actors.hero.heroclass.mage_perk3=Mage mengidentifikasi tongkat sebagian setelah menggunakannya.
actors.hero.heroclass.mage_perk4=Ketika dimakan, setiap potongan makanan memulihkan 1 charge untuk semua tongkat di inventaris.
actors.hero.heroclass.mage_perk5=Gulungan Peningkatan telah teridentifikasi sejak awal.

actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_perk1=Rogue memulai dengan Jubah Bayangan yang unik.
actors.hero.heroclass.rogue_perk2=Rogue mengidentifikasi jenis cincin saat memasangnya.
actors.hero.heroclass.rogue_perk3=Rogue memiliki peluang awal yang lebih tinggi dan peluang yang meningkat lebih tinggi untuk memberikan pukulan kritis.
actors.hero.heroclass.rogue_perk4=Rogue mahir dengan baju zirah ringan, menghindar lebih baik dengan kekuatan berlebih.
actors.hero.heroclass.rogue_perk5=Rogue dapat bertahan lebih lama tanpa makanan dan lebih mahir mendeteksi pintu tersembunyi dan jebakan.
actors.hero.heroclass.rogue_perk6=Gulungan Pemetaan Magis telah teridentifikasi sejak awal.

actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_perk1=Huntress memulai dengan bumerang yang dapat ditingkatkan dan unik.
actors.hero.heroclass.huntress_perk2=Huntress mahir dengan senjata peluru, mendapatkan bonus kerusakan dari kekuatan berlebih.
actors.hero.heroclass.huntress_perk3=Huntress menguasai senjata lempar yang dapat menghindari menjadi sepenuhnya tidak seimbang saat menggunakan senjata lempar pada jarak jarak dekat.
actors.hero.heroclass.huntress_perk4=Huntress mempertahankan penglihatan lebih baik dalam gelap, dia juga dapat menangkap keberadaan monster di sekitarnya meskipun tersembunyi di balik rintangan.
actors.hero.heroclass.huntress_perk5=Ramuan Penglihatan Pikiran telah teridentifikasi sejak awal.

actors.hero.heroclass.sorceress=sorceress
actors.hero.heroclass.sorceress_perk1=Tubuh menggoda Sorceress dapat membantunya mendapatkan diskon saat berbelanja.
actors.hero.heroclass.sorceress_perk2=Sorceress tidak mahir menghindari serangan dan memiliki kesehatan lebih rendah, tetapi tingkat regenerasi yang lebih cepat dan resistensi elemen _terutama racun_ yang lebih tinggi sebagai kompensasi.
actors.hero.heroclass.sorceress_perk3=Sorceress dapat menggunakan bahan alkimia untuk meracik ramuan secara efektif. Dia memiliki labu ekstraksi sejak awal. Jika kekuatannya lebih tinggi dari senjata yang dipegangnya, pemurnian yang berhasil dapat memengaruhi senjata tersebut.
actors.hero.heroclass.sorceress_perk4=Sorceress lebih peka terhadap kegelapan dan ketakutan. Dia memiliki peluang tertentu untuk mengabaikan kerusakan mental.
actors.hero.heroclass.sorceress_perk5=Senjata Sorceress di awal adalah tongkat yang terenchant. Dia membawa ramuan gas beracun yang sudah teridentifikasi.

actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_desc=_Gladiator_ menguasai _Battle Trance_ yang memungkinkan _Gladiator_ memulai kombo setelah pukulan jarak dekat yang berhasil. Membangun kombo memungkinkannya menggunakan gerakan penyelesai yang unik.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=_Berserker_ memberikan bonus kerusakan yang meningkat seiring tingkat keparahan lukanya. Saat kesehatannya berkurang hingga 0, dia akan _menolak mati_ untuk waktu singkat, dengan biaya kelelahan.
actors.hero.herosubclass.warlock=warlock
# actors.hero.herosubclass.warlock_desc=每当用法杖击中敌人，_术士_都有几率标记敌人的灵魂。被标记的敌人受近战攻击时都会治愈他的伤口并回复饥饿。
actors.hero.herosubclass.warlock_desc=Setiap kali musuh dibunuh, _Warlock_ akan memenjarakan jiwanya, jiwa-jiwa malang ini akan dikorbankan untuk mantranya.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_desc=Saat bertarung dengan tongkatnya, _Battlemage_ memunculkan efek bonus tergantung pada tongkat yang ditanamkan pada tongkatnya. Tongkatnya juga akan mendapatkan charge melalui pertarungan.
actors.hero.herosubclass.assassin=assassin
actors.hero.herosubclass.assassin_desc=Saat melakukan serangan kejutan, _Assassin_ memberikan kerusakan tambahan pada sasarannya.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_desc=_Freerunner_ bergerak lebih cepat saat tidak terbebani dan tidak kelaparan, jika dia tidak terlihat, peningkatan kecepatan ini meningkat.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_desc=_Sniper_ mampu mendeteksi titik lemah pada baju zirah musuh, secara efektif mengabaikannya saat menggunakan senjata peluru.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_desc=Memiliki hubungan kuat dengan kekuatan alam memungkinkan _Warden_ mendapatkan kesehatan tambahan dari embun, baju zirah dari menginjak rumput, serta benih dan embun dari tanaman.
actors.hero.herosubclass.stargazer=stargazer
actors.hero.herosubclass.stargazer_desc=_Stargazer_ menggunakan mistisisme untuk memperkuat pertarungannya dengan bantuan kekuatan supranatural. Ingat, setiap koin memiliki dua sisi. Toleransi stres _Stargazer_ lebih ditingkatkan lagi.
actors.hero.herosubclass.witch=witch
actors.hero.herosubclass.witch_desc=_Witch_ telah menguasai esensi produksi obat melalui penelitian, yang dapat membantunya _memperkuat_ beberapa ramuan dengan benih.

### perks
actors.hero.perks.drunkard.desc=Anggur menjadi lebih efektif dalam mengurangi stres. Selain itu, itu tidak akan membuatmu mabuk.
actors.hero.perks.goodappetite.desc=Kau dipenuhi kebahagiaan untuk merasa puas dari makanan dan merasa lebih nyaman setelah makan.
actors.hero.perks.strongconstitution.desc=Kau mendapatkan kesehatan maksimum lebih banyak saat naik level.
actors.hero.perks.wandperception.desc_1=Kau dapat mengidentifikasi tongkat sebagian saat menggunakannya.
actors.hero.perks.wandperception.desc_2=Kau dapat mengetahui semua rahasia tongkat saat menggunakannya.
actors.hero.perks.keen.desc=Kau mendapatkan persepsi tajam yang dapat membantumu mendeteksi pintu dan ruangan tersembunyi.
actors.hero.perks.nightvision.desc=Jarak pandangmu meningkat 1 tile selama malam.
actors.hero.perks.telepath.desc=Kau dapat mendeteksi musuh di dekatmu meskipun mereka berada di balik tembok.
actors.hero.perks.optimistic.desc="Kegelapan yang disebut-sebut tidak ada untuk ditakuti", kau memiliki peluang untuk menghindari kerusakan mental.
actors.hero.perks.discount.desc=Selalu mendapatkan diskon di toko untuk alasan apa pun.
actors.hero.perks.fearless.desc=Kau tak takut akan luka saat HP rendah.
actors.hero.perks.assassin.desc=Memberikan kerusakan tambahan saat melakukan serangan kejutan.
actors.hero.perks.intendedtransportation.desc=Kau dapat memilih tujuan saat membaca gulungan teleportasi.
actors.hero.perks.perk$companion$luckfromauthor.desc=Selamat menjelajahi dungeon! -_Lix_
actors.hero.perks.vampiriccrit.desc=Pukulan kritismu bersifat vampirik.
actors.hero.perks.purecrit.desc=Pukulan kritismu memberikan kerusakan murni.
actors.hero.perks.extracritprobability.desc=Peluang tambahan untuk pukulan kritis.
actors.hero.perks.hardcrit.desc=Bonus kerusakan yang lebih tinggi untuk pukulan kritis.
actors.hero.perks.lowhealthdexterous.desc=Kau menjadi lebih gesit di bawah 30% HP.
actors.hero.perks.lowhealthregeneration.desc=Kau mendapatkan penyembuhan tambahan saat HP rendah.
actors.hero.perks.extradexterous.desc=Kau mendapatkan penghindaran tambahan.
actors.hero.perks.extraperkchoice.desc=Kau memiliki 5 pilihan saat memilih perk baru.
actors.hero.perks.brewenhancedpotion.desc=Kau mungkin mendapatkan ramuan yang diperkuat saat meracik ramuan.
actors.hero.perks.knowledgeable.desc=Peluang untuk mengidentifikasi properti suatu peralatan saat mengambilnya.
actors.hero.perks.knowledgeable.identity=Kau telah mengidentifikasi semua properti peralatan ini.
actors.hero.perks.knowledgeable.know-curse=Kau telah mengidentifikasi sebagian properti peralatan ini.
actors.hero.perks.efficientsearch.desc=Kau dapat mencari rahasia dungeon lebih efisien.
actors.hero.perks.extrastrengthpower.desc=Bonus kerusakan kekuatan berlebih tambahan pada senjata jarak dekat.
actors.hero.perks.fastregeneration.desc=Regenerasi kesehatan lebih cepat.
actors.hero.perks.efficientpotionofhealing.desc=Meningkatkan secara signifikan jumlah penyembuhan total dari ramuan penyembuhan.
actors.hero.perks.extradexterousgrowth.desc=Kau mendapatkan lebih banyak penghindaran saat naik level.
actors.hero.perks.pressureispower.desc="Tekanan adalah kekuatan", kau dapat memberikan kerusakan tambahan berdasarkan tekananmu.
actors.hero.perks.pressurerelieve.desc=Kau merasa lebih sedikit sakit saat berkonsentrasi dan mendapatkan pertahanan tambahan untuk kerusakan normal.
actors.hero.perks.wandcharger.desc=Tongkatmu mengisi ulang lebih cepat.
actors.hero.perks.wandarcane.desc=Tongkatmu memberikan lebih banyak kerusakan.
actors.hero.perks.quickzap.desc=Kau dapat merapal mantra jauh lebih cepat.
actors.hero.perks.explodebrokenshot.desc=Senjata peluru akan meledak dan memberikan kerusakan besar saat rusak.
actors.hero.perks.extrastrength.desc=Secara permanen meningkatkan %d kekuatan.
actors.hero.perks.extraruneregularly.desc=Memanggil rune acak setiap setengah hari.
actors.hero.perks.extraruneregularly.generated=Sebuah %s telah muncul di labu embunmu.
actors.hero.perks.angrybared.desc=Kau kecanduan menjadi telanjang. Kau akan mendapatkan bonus signifikan pada kecepatan serangan dan kerusakan tanpa baju zirah.
actors.hero.perks.quicklearner.desc=Mendapatkan %02d%% pengalaman tambahan.
actors.hero.perks.levelperception.desc=Kau selalu menyadari ruangan tersembunyi saat turun ke lantai baru.

actors.hero.perks.ravenousappetite.desc=Memiliki nafsu makan rakus tidak selalu baik karena ini dapat menyebabkan kelaparan lebih cepat.

###npcs
actors.mobs.npcs.blacksmith.name=tukang pandai besi troll
actors.mobs.npcs.blacksmith.gold_1=Hei manusia! Ingin jadi berguna, ya? Ambil beliung ini dan tambang _bijih emas gelap, 12 potong_ untukku, seharusnya cukup. Apa maksudmu, bagaimana aku akan membayar? Kau serakah...\nOk, ok, aku tidak punya uang untuk membayar, tapi aku bisa melakukan sedikit pekerjaan pandai besi untukmu. Anggap saja kau beruntung, aku satu-satunya tukang pandai besi di sini.
actors.mobs.npcs.blacksmith.blood_1=Hei manusia! Ingin jadi berguna, ya? Ambil beliung ini dan _bunuh seekor kelelawar_ dengannya, aku butuh darahnya di kepalanya. Apa maksudmu, bagaimana aku akan membayar? Kau serakah...\nOk, ok, aku tidak punya uang untuk membayar, tapi aku bisa melakukan sedikit pekerjaan pandai besi untukmu. Anggap saja kau beruntung, aku satu-satunya tukang pandai besi di sini.
actors.mobs.npcs.blacksmith.lost_pick=Kau bercanda? Di mana beliungku?!
actors.mobs.npcs.blacksmith.gold_2=Bijih emas gelap. 12 potong. Sungguh, apakah itu sulit?
actors.mobs.npcs.blacksmith.blood_2=Aku bilang aku butuh darah kelelawar di beliung. Cepat lakukan!
actors.mobs.npcs.blacksmith.completed=Oh, kau sudah kembali... Lebih baik terlambat dari pada tidak sama sekali.
actors.mobs.npcs.blacksmith.get_lost=Aku sibuk. Pergi sana!
actors.mobs.npcs.blacksmith.same_item=Pilih 2 item berbeda, bukan item yang sama dua kali!
actors.mobs.npcs.blacksmith.diff_type=Pilih 2 item dari jenis yang sama!
actors.mobs.npcs.blacksmith.un_ided=Aku perlu tahu dengan apa yang aku kerjakan, identifikasi dulu!
actors.mobs.npcs.blacksmith.cursed=Aku tidak bekerja dengan item terkutuk!
actors.mobs.npcs.blacksmith.degraded=Itu sampah, kualitasnya terlalu buruk!
actors.mobs.npcs.blacksmith.cant_reforge=Aku tidak bisa menempa ulang item ini!
actors.mobs.npcs.blacksmith.desc=Tukang pandai besi troll ini terlihat seperti semua troll: tinggi dan kurus, dan kulitnya menyerupai batu baik dalam warna maupun tekstur. Tukang pandai besi troll sedang bermain-main dengan alat yang ukurannya tidak proporsional kecil.

actors.mobs.npcs.catroberry.name=Dark Rawberry
actors.mobs.npcs.catroberry.desc=Kucing hitam lain...? Terlihat aneh, syal merah yang dikenakannya membuatmu merasa seperti bisa berbicara, tapi kau tidak menganggapnya mudah didekati.
actors.mobs.npcs.catroberry.keke=Batuk batuk!
actors.mobs.npcs.catroberry.blinked=Kucing hitam itu tiba-tiba menghilang di depanmu saat kau mencoba menyentuhnya dengan tanganmu.
actors.mobs.npcs.catroberry.give-meat=Kau memberi %s kepada kucing hitam itu.
actors.mobs.npcs.catroberry.get-mystery-meat=Jadi kau, manusia, mencoba menyenangkanku?
actors.mobs.npcs.catroberry.get-chargrilled-meat=Sepertinya kau salah satu dari mereka yang pernah ke dungeon. Sebagai penghubung dungeon di seluruh dunia, aku bisa memberikan sedikit rasa hormat untuk saat ini.
actors.mobs.npcs.catroberry.get-stewed-meat=Tidak buruk. Aku telah mengumpulkan persembahanmu, manusia.
actors.mobs.npcs.catroberry.get-frozen-carpaccio=Bahkan dengan sikap seperti itu, kalian manusia akan terus membawa makanan untukku. Hmph, pernahkah kalian memuji orang yang membantu kalian sejak awal? Ayolah, aku tidak peduli padanya, sama sekali tidak.

actors.mobs.npcs.ghost.name=hantu sedih
actors.mobs.npcs.ghost.rat_1=Halo %s... Dulu aku seperti kau - kuat dan percaya diri... Tapi aku dibunuh oleh binatang busuk... Aku tidak bisa meninggalkan tempat ini... Sampai aku mendapat balas dendam... Bunuh _tikus busuk,_ yang telah mengambil nyawaku...\n\nIa berkeliaran di lantai ini... Menyebarkan kotoran di mana-mana... _Hati-hati dengan awan bau busuknya dan gigitan korosifnya, asamnya larut dalam air..._
actors.mobs.npcs.ghost.rat_2=Tolong... Bantu aku... Bunuh monster ini...\n\n_Lawan dekat air... Hindari bau busuknya..._
actors.mobs.npcs.ghost.gnoll_1=Halo %s... Dulu aku seperti kau - kuat dan percaya diri... Tapi aku dibunuh oleh musuh licik... Aku tidak bisa meninggalkan tempat ini... Sampai aku mendapat balas dendam... Bunuh _gnoll penipu,_ yang telah mengambil nyawaku...\n\nDia tidak seperti gnoll lainnya... Ia bersembunyi dan menggunakan senjata lempar... _Hati-hati dengan dart beracun dan pembakarnya, jangan menyerang dari jauh..._
actors.mobs.npcs.ghost.gnoll_2=Tolong... Bantu aku... Bunuh penipu itu...\n\n_Jangan biarkan ia mengenaimu... Mendekatlah padanya..._
actors.mobs.npcs.ghost.crab_1=Halo %s... Dulu aku seperti kau - kuat dan percaya diri... Tapi aku dibunuh oleh makhluk kuno... Aku tidak bisa meninggalkan tempat ini... Sampai aku mendapat balas dendam... Bunuh _kepiting raksasa,_ yang telah mengambil nyawaku...\n\nIa teramat tua... Dengan cakar tunggal besar dan cangkang tebal... _Hati-hati dengan cakarnya, kau harus mengejutkan kepiting atau ia akan memblokir dengannya..._
actors.mobs.npcs.ghost.crab_2=Tolong... Bantu aku... Bunuh Krustasea itu...\n\n_Ia akan selalu memblokir... Saat melihatmu datang..._
actors.mobs.npcs.ghost.def_verb=dihindari
actors.mobs.npcs.ghost.find_me=Terima kasih... carilah aku...
actors.mobs.npcs.ghost.desc=Hantu itu nyaris tak terlihat. Ia terlihat seperti bercak cahaya redup tanpa bentuk dengan wajah sedih.

actors.mobs.npcs.ghosthero.name=hantu sedih
actors.mobs.npcs.ghosthero.def_verb=dihindari
actors.mobs.npcs.ghosthero.hello=Halo lagi, %s.
actors.mobs.npcs.ghosthero.introduce=Jiwaku terikat pada mawar ini, sangat berharga bagiku, hadiah dari kekasihku yang kutinggalkan di permukaan.\n\nAku tidak bisa kembali padanya, tapi berkat kau aku punya kesempatan kedua untuk menyelesaikan perjalananku. Saat aku mampu aku akan merespons panggilanmu dan bertarung bersamamu.\n\nSemoga kau berhasil di mana aku gagal...
actors.mobs.npcs.ghosthero.desc=Sosok bugar yang rapuh berbentuk manusia. Kekuatannya tampak terikat pada mawar yang kau miliki.\n\nHantu ini mungkin tidak banyak, tapi tampaknya ia satu-satunya teman sejatimu di sini bawah.
# ghoest's voice
actors.mobs.npcs.ghosthero.voice_ambient_0_0=Selokan ini dulunya aman, beberapa bahkan tinggal di sini saat musim dingin...
actors.mobs.npcs.ghosthero.voice_ambient_0_1=Aku bertanya-tanya apa yang terjadi pada patroli penjaga, apakah mereka menyerah?...
actors.mobs.npcs.ghosthero.voice_ambient_0_2=Aku punya keluarga di permukaan, aku harap mereka aman...
actors.mobs.npcs.ghosthero.voice_ambient_1_0=Aku pernah mendengar cerita tentang tempat ini, tidak ada yang baik...
actors.mobs.npcs.ghosthero.voice_ambient_1_1=Tempat ini selalu lebih merupakan dungeon daripada penjara...
actors.mobs.npcs.ghosthero.voice_ambient_1_2=Aku tidak bisa membayangkan apa yang terjadi saat tempat ini ditinggalkan...
actors.mobs.npcs.ghosthero.voice_ambient_2_0=Tidak ada manusia atau kurcaci yang pernah ke sini selama sangat lama...
actors.mobs.npcs.ghosthero.voice_ambient_2_1=Sesuatu pasti sangat salah, sampai-sampai para kurcaci meninggalkan tambang emas...
actors.mobs.npcs.ghosthero.voice_ambient_2_2=Aku merasa kejahatan besar mengintai di bawah...
actors.mobs.npcs.ghosthero.voice_ambient_3_0=Para kurcaci sangat rajin, tapi serakah...
actors.mobs.npcs.ghosthero.voice_ambient_3_1=Aku harap permukaan tidak pernah berakhir seperti tempat ini...
actors.mobs.npcs.ghosthero.voice_ambient_3_2=Jadi metropolis kurcaci benar-benar telah jatuh...
actors.mobs.npcs.ghosthero.voice_ambient_4_0=Tempat apakah ini?...
actors.mobs.npcs.ghosthero.voice_ambient_4_1=Jadi ceritanya benar, kita harus melawan dewa iblis...
actors.mobs.npcs.ghosthero.voice_ambient_4_2=Aku merasa kejahatan besar di tempat ini...
actors.mobs.npcs.ghosthero.voice_ambient_5_0=... Aku tidak suka tempat ini... Kita harus pergi secepat mungkin...

actors.mobs.npcs.ghosthero.voice_enemies_0_0=Mari buat selokan ini aman lagi...
actors.mobs.npcs.ghosthero.voice_enemies_0_1=Jika penjaga tidak bisa mengalahkan mereka, mungkin kita bisa...
actors.mobs.npcs.ghosthero.voice_enemies_0_2=Kepiting ini sangat menjengkelkan...
actors.mobs.npcs.ghosthero.voice_bosses_0_0=Hati-hati dengan Goo!...
actors.mobs.npcs.ghosthero.voice_bosses_0_1=Banyak temanku mati karena hal ini, saatnya balas dendam...
actors.mobs.npcs.ghosthero.voice_bosses_0_2=Monster seperti itu tidak boleh dibiarkan hidup...
actors.mobs.npcs.ghosthero.voice_enemies_1_0=Sihir gelap apa yang terjadi di sini?...
actors.mobs.npcs.ghosthero.voice_enemies_1_1=Membayangkan bahwa para tahanan tempat ini kini menjadi penjaganya...
actors.mobs.npcs.ghosthero.voice_enemies_1_2=Mereka dulu penjahat, sekarang mereka monster...
actors.mobs.npcs.ghosthero.voice_bosses_1_0=Andai saja dia mau melihat alasan, dia tampaknya tidak gila...
actors.mobs.npcs.ghosthero.voice_bosses_1_1=Dia menganggap kita bermusuhan, andai saja dia berhenti untuk berbicara...
actors.mobs.npcs.ghosthero.voice_bosses_1_2=Satu-satunya tahanan yang masih waras adalah pembunuh mematikan. Tentu saja...
actors.mobs.npcs.ghosthero.voice_enemies_2_0=Makhluk di sini terpelintiran, sama seperti selokan...
actors.mobs.npcs.ghosthero.voice_enemies_2_1=lebih banyak gnoll, aku benci gnoll...
actors.mobs.npcs.ghosthero.voice_enemies_2_2=Bahkan kelelawar di sini haus darah...
actors.mobs.npcs.ghosthero.voice_bosses_2_0=Hanya kurcaci yang akan membuat mesin tambang yang membunuh perampok...
actors.mobs.npcs.ghosthero.voice_bosses_2_1=Benda itu besar...
actors.mobs.npcs.ghosthero.voice_bosses_2_2=Bagaimana bisa bertahan di sini selama ini?...
actors.mobs.npcs.ghosthero.voice_enemies_3_0=Kurcaci seharusnya tidak terlihat sepucat itu...
actors.mobs.npcs.ghosthero.voice_enemies_3_1=Aku tidak tahu mana yang lebih buruk, para kurcaci, atau ciptaan mereka...
actors.mobs.npcs.ghosthero.voice_enemies_3_2=Mereka semua menaati tuannya tanpa pertanyaan, bahkan sekarang...
actors.mobs.npcs.ghosthero.voice_bosses_3_0=Ketika orang mengatakan kekuasaan merusak, inilah yang mereka maksud...
actors.mobs.npcs.ghosthero.voice_bosses_3_1=Dia lebih Lich daripada Raja sekarang...
actors.mobs.npcs.ghosthero.voice_bosses_3_2=Tampaknya dia lebih iblis daripada kurcaci sekarang...
actors.mobs.npcs.ghosthero.voice_enemies_4_0=Apakah benda itu?...
actors.mobs.npcs.ghosthero.voice_enemies_4_1=Tempat ini mengerikan...
actors.mobs.npcs.ghosthero.voice_enemies_4_2=Apa yang dipikirkan para kurcaci, main-main dengan kekuatan seperti ini?...
actors.mobs.npcs.ghosthero.voice_bosses_4_0=Oh.... ini tidak terlihat baik...
actors.mobs.npcs.ghosthero.voice_bosses_4_1=Jadi begitulah rupa dewa?...
actors.mobs.npcs.ghosthero.voice_bosses_4_2=Ini akan terasa sakit...
actors.mobs.npcs.ghosthero.voice_enemies_5_0=Aku tidak suka tempat ini... kita harus pergi secepat yang kita bisa...
actors.mobs.npcs.ghosthero.voice_bosses_5_0=Halo penonton kode sumber, aku menulis ini di sini karena baris ini seharusnya tidak pernah terpicu. Semoga harimu menyenangkan!

actors.mobs.npcs.ghosthero.voice_bossbeaten_0_0=Ya!
actors.mobs.npcs.ghosthero.voice_bossbeaten_0_1=Kemenangan!
actors.mobs.npcs.ghosthero.voice_bossbeaten_1_0=Selesai... kita menang...
actors.mobs.npcs.ghosthero.voice_bossbeaten_1_1=Aku tidak percaya... Kita baru saja membunuh dewa...

actors.mobs.npcs.ghosthero.voice_defeated_0_0=Semoga beruntung...
actors.mobs.npcs.ghosthero.voice_defeated_0_1=Aku akan kembali...
actors.mobs.npcs.ghosthero.voice_defeated_0_2=Lelah... untuk saat ini...
actors.mobs.npcs.ghosthero.voice_defeated_1_0=Tidak... aku tidak bisa......
actors.mobs.npcs.ghosthero.voice_defeated_1_1=Maafkan aku.. semoga beruntung..
actors.mobs.npcs.ghosthero.voice_defeated_1_2=Selesaikan... tanpa aku...

actors.mobs.npcs.ghosthero.voice_herokilled_0=tidaaak...
actors.mobs.npcs.ghosthero.voice_herokilled_1=tidak...
actors.mobs.npcs.ghosthero.voice_herokilled_2=Aku tidak bisa menolong mereka...

actors.mobs.npcs.ghosthero.voice_blessedankh_0=Luar biasa!...
actors.mobs.npcs.ghosthero.voice_blessedankh_1=Andai saja aku punya salah satunya...
actors.mobs.npcs.ghosthero.voice_blessedankh_2=Bagaimana kau bisa selamat dari itu?...

actors.mobs.npcs.ghosthero.voice_timeout_0=Sekarang.. saatnya.. kau..
actors.mobs.npcs.ghosthero.voice_timeout_1=Aku butuh.. istirahat....
actors.mobs.npcs.ghosthero.voice_timeout_2=Aku sudah kehabisan... Bertahanlah...

actors.mobs.npcs.ghosthero.voice_cured_0=Aku bisa menyembuhkan ini...
actors.mobs.npcs.ghosthero.voice_cured_1=Apakah kau baik-baik saja?...
actors.mobs.npcs.ghosthero.voice_cured_2=Aku menyembuhkan lukamu, tolong bertahanlah...

actors.mobs.npcs.imp.name=imp ambisius
actors.mobs.npcs.imp.golems_1=Apakah kau petualang? Aku suka petualang! Kau selalu bisa mengandalkan mereka jika ada sesuatu yang perlu dibunuh. Benar kan? Dengan bayaran tentu saja ;)\nDalam kasusku ini _golem_ yang perlu dibunuh. Kau lihat, aku akan memulai bisnis kecil di sini, tapi golem bodoh ini merugikan bisnis! Sangat sulit bernegosiasi dengan gumpalan granit yang berkeliaran, sialan! Jadi tolong, bunuh... katakanlah _6 dari mereka_ dan hadiah untukmu.
actors.mobs.npcs.imp.monks_1=Apakah kau petualang? Aku suka petualang! Kau selalu bisa mengandalkan mereka jika ada sesuatu yang perlu dibunuh. Benar kan? Dengan bayaran tentu saja ;)\nDalam kasusku ini _para biksu_ yang perlu dibunuh. Kau lihat, aku akan memulai bisnis kecil di sini, tapi para orang gila ini tidak membeli apa pun sendiri dan akan menakuti pelanggan lain. Jadi tolong, bunuh... katakanlah _6 dari mereka_ dan hadiah untukmu.
actors.mobs.npcs.imp.golems_2=Bagaimana perjalanan berburu golem-mu?
actors.mobs.npcs.imp.monks_2=Oh, kau masih hidup! Aku tahu kung-fu-mu lebih kuat ;) Jangan lupa ambil token para biksu itu.
actors.mobs.npcs.imp.cya=Sampai jumpa, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.def_verb=dihindari
actors.mobs.npcs.imp.desc=Imp adalah iblis rendahan. Mereka tidak menonjol baik dari kekuatan maupun bakat sihir, tapi mereka cukup pintar dan mudah bergaul. Banyak imp lebih memilih untuk tinggal di antara non-iblis.

actors.mobs.npcs.impshopkeeper.name=imp ambisius
actors.mobs.npcs.impshopkeeper.greetings=Halo, %s!
actors.mobs.npcs.impshopkeeper.thief=Aku pikir aku bisa mempercayaimu!
actors.mobs.npcs.impshopkeeper.desc=Imp adalah iblis rendahan. Mereka tidak menonjol baik dari kekuatan maupun bakat sihir. Tapi mereka cukup pintar dan mudah bergaul, dan banyak imp lebih memilih untuk tinggal dan berbisnis di antara non-iblis.

actors.mobs.npcs.mirrorimage.name=citra cermin
actors.mobs.npcs.mirrorimage.desc=Ilusi ini sangat mirip denganmu, tapi lebih pucat dan berkedut sedikit.

actors.mobs.npcs.ratking.name=raja tikus
actors.mobs.npcs.ratking.not_sleeping=Aku tidak sedang tidur!
actors.mobs.npcs.ratking.what_is_it=Apa ini? Aku tidak punya waktu untuk omong kosong ini. Kerajaanku tidak akan memerintah sendiri!
actors.mobs.npcs.ratking.desc_festive=Tikus ini sedikit lebih besar dari tikus berkantung biasa. Ia mengenakan topi perayaan kecil alih-alih mahkota biasanya. Selamat Berlibur!
actors.mobs.npcs.ratking.desc=Tikus ini sedikit lebih besar dari tikus berkantung biasa dan mengenakan mahkota kecil di kepalanya.

actors.mobs.npcs.robotren.name=REN-B2
actors.mobs.npcs.robotren.desc=Sebelum iblis dan makhluk elemental digunakan oleh kurcaci, kebijaksanaan pengrajin kurcaci sebagian besar terkonsentrasi pada keselarasan sempurna antara kristalisasi sihir dan mesin, tapi robot seri REN tidak pernah muncul dalam teks sejarah kurcaci.\nTampaknya REN-B2 tidak memiliki sistem dialog yang baik.
actors.mobs.npcs.robotren.greetings=Aduh! Sel...mat... Hei, hei, hei, apakah perahu burung tidak ada? Tidak, tidak, tidak, kau salah. Uh...Malam! Malam! Kwek.
actors.mobs.npcs.robotren.ac_yourself=Siapa yang memproduksimu
actors.mobs.npcs.robotren.ac_wherefrom=Dari mana asalmu
actors.mobs.npcs.robotren.introduction=Oh, roar... Ren, Sai... Gao! Apa? Siapa Ze Zhilianhua? Uh... \n......\n......\nGoo, belum mencari ingatan relevan-ah, mungkin domba, embik... Embik... Perilaku ruminansia, gagal...
actors.mobs.npcs.robotren.wherefrom=Tidak, tidak, tidak, REN adalah yang paling indah, guk, chou...

actors.mobs.npcs.sheep.name=domba
actors.mobs.npcs.sheep.baa!=Embik!
actors.mobs.npcs.sheep.baa?=Embik?
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.desc=Ini adalah domba ajaib. Apa yang ajaib darinya? Kamu tidak bisa membunuhnya. Dia akan berdiri di sana sampai secara ajaib menghilang, sambil terus mengunyah rumput dengan tatapan kosong.

actors.mobs.npcs.shopkeeper.name=penjaga toko
actors.mobs.npcs.shopkeeper.thief=Pencuri, Pencuri!
actors.mobs.npcs.shopkeeper.sell=Pilih sebuah barang untuk dijual
actors.mobs.npcs.shopkeeper.desc=Orang kekar ini lebih cocok berada di distrik perdagangan di sebuah kota besar daripada di dungeon. Harganya menjelaskan mengapa dia lebih memilih berdagang di sini.

actors.mobs.npcs.wandmaker.name=pembuat tongkat tua
actors.mobs.npcs.wandmaker.intro_warrior=Wah, betapa kejutan menyenangkan bertemu seorang pahlawan di tempat yang menyedihkan ini! Kalau kamu mau membantu orang tua ini, aku mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_rogue=Yah Tuhan, kamu mengejutkanku! Aku belum pernah bertemu bandit dari tempat ini yang masih waras, jadi kamu pasti dari permukaan! Kalau kamu mau membantu seorang asing, aku mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_mage=Oh, halo %s! Aku dengar ada kehebohan tentang kamu dan institut para penyihir? Ah tidak apa-apa, aku tidak pernah menyukai orang-orang kolot itu. Kalau kamu mau, aku mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, halo nona! Wajah yang ramah adalah kejutan menyenangkan di sini bawah, bukan? Bahkan, aku yakin pernah melihat wajahmu, tapi aku tidak ingat di mana... Ah tidak apa-apa, kalau kamu datang untuk petualangan, aku mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_sorceress=Ah, Halo gadis! Sungguh kejutan melihat gadis secantik ini di bawah tanah, bukan? Meskipun aku merasa sedikit dingin lagi... Ohohoh, lupakan saja. Kalau kamu mau menjelajahi tempat ini, ada tugas yang bisa kamu bantu.
actors.mobs.npcs.wandmaker.intro_1=\n\nAku datang ke sini untuk mencari bahan langka untuk sebuah tongkat, tapi aku tersesat, dan perisai sihirku melemah. Aku harus segera pergi, tapi tidak tega pergi sebelum mendapatkan apa yang kucari.
actors.mobs.npcs.wandmaker.intro_dust=Aku mencari _debu tulang._ Itu adalah jenis tepung tulang terkutuk khusus yang biasanya muncul di tempat seperti ini. Harus ada ruangan yang dibentengi di sekitar sini, aku yakin beberapa debu akan muncul di sana. Tapi berhati-hatilah, kutukan yang dibawa debu itu sangat kuat, _kembalilah padaku secepat mungkin_ dan aku akan menyucikannya untukmu.
actors.mobs.npcs.wandmaker.intro_ember=Aku mencari _bara segar_ dari elemental api yang baru lahir. Elemental biasanya muncul saat ritual pemanggilan tidak terkendali, jadi carilah beberapa lilin dan lokasi ritual dan aku yakin kamu bisa membuat satu muncul. Kamu mungkin ingin _menyimpan semacam bahan pembeku_ karena elemental sangat kuat, tapi es akan merobohkan mereka dengan mudah.
actors.mobs.npcs.wandmaker.intro_berry=Warden tua penjara ini memelihara _tanaman rotberry,_ dan aku menginginkan salah satu bijinya. Tanamannya mungkin sudah liar sekarang, jadi membuatnya memberikan biji mungkin sulit. Kebunnya harus berada di suatu tempat di sekitar sini. Usahakan _menjauh dari cambuk sulurnya_ kalau kamu ingin tetap utuh. Menggunakan api memang menggoda tapi tolong jangan, kamu akan membunuh tanaman dan menghancurkan bijinya.
actors.mobs.npcs.wandmaker.intro_2=\n\nKalau kamu bisa mendapatkannya untukku, aku dengan senang hati akan membayarmu dengan salah satu tongkat buatanku yang bagus! Aku membawa dua, jadi kamu boleh ambil mana saja yang kamu suka.
actors.mobs.npcs.wandmaker.reminder_dust=Apa ada keberuntungan dengan debu tulang, %s? Cari beberapa benteng.
actors.mobs.npcs.wandmaker.reminder_ember=Apa ada keberuntungan dengan bara itu, %s? Kamu perlu menemukan empat lilin dan lokasi ritual.
actors.mobs.npcs.wandmaker.reminder_berry=Apa ada keberuntungan dengan biji Rotberry, %s? Cari ruangan yang penuh dengan tumbuhan.
actors.mobs.npcs.wandmaker.def_verb=diserap
actors.mobs.npcs.wandmaker.desc=Tuan tua namun bugar ini mengenakan ekspresi yang sedikit bingung. Dia dilindungi oleh perisai sihir.

actors.mobs.npcs.yvette.name=Yvette
actors.mobs.npcs.yvette.desc=Pakaian wanita itu membuatnya terlihat seperti petualang. Lebih spesifik, dia berdiri dengan busurnya. Mungkin dia seorang penjaga hutan, pemanah atau semacamnya.
actors.mobs.npcs.yvette.hey=Hei, %s! maafkan saya!
actors.mobs.npcs.yvette.task=Ah, apakah kamu juga petualang? Tolong, tolong aku, seperti yang kamu lihat kakiku... Aku terjebak di sini. Aku menyerah dan hanya ingin pergi dari neraka ini! Bisakah kamu membantuku? Aku butuh _gulungan teleportasi_......\n\nDan... kalau kamu bisa berbagi sedikit makanan aku... Aku sudah di sini selama tiga hari...
actors.mobs.npcs.yvette.opt-onit=Jangan khawatir aku akan membantu
actors.mobs.npcs.yvette.opt-betray=(Mungkin aku harus memanfaatkan dia)
actors.mobs.npcs.yvette.reminder=Aku akan pergi dari sini jika ada gulungan teleportasi.
actors.mobs.npcs.yvette.opt-ok=Jangan khawatir, serahkan saja padaku.
actors.mobs.npcs.yvette.scroll-identified=%s telah mengajarkanmu cara membedakan gulungan teleportasi dan sekarang gulungan ini teridentifikasi.
actors.mobs.npcs.yvette.give-item=Pilih satu barang untuk diberikan
actors.mobs.npcs.yvette.full=Oh, terima kasih. Aku tidak lapar sekarang. Aku berterima kasih atas bantuanmu, tapi bagaimanapun kamu masih punya perjalanan panjang. Aku tidak bisa menerima lebih.
actors.mobs.npcs.yvette.thanks-for-food=Terima... terima kasih! Aku... aku akan mengambilnya dulu.
actors.mobs.npcs.yvette.thanks-for-scroll=Ah, terima kasih banyak! Kamu penyelamatku!\nAku akan pergi meskipun aku gagal. Bagaimanapun, terima kasih lagi atas bantuanmu. Mungkin apa yang kubawa akan berguna. Semoga kita bisa bertemu lagi!
actors.mobs.npcs.yvette.teach-teleportation=Oh, dan ada rahasia untukmu, dan aku harap ini akan berguna. :)
actors.mobs.npcs.yvette.taught=%s mengajarkanmu rahasia _teleportasi terkendali_. Kamu sekarang bisa teleport ke titik yang dipilih dengan gulungan teleportasi.
actors.mobs.npcs.yvette.disappear=Kamu melihat %s menghilang di hadapanmu.
actors.mobs.npcs.yvette.not-teleportation=Oh, bukan, bukan gulungan ini. Tolong simpan baik-baik karena bermanfaat untuk petualanganmu.
actors.mobs.npcs.yvette.you-bastard=Terkutuk......KAMU...bejat......
actors.mobs.npcs.yvette.killed=Kamu menghabisinya di saat %s penuh harapan dan sama sekali tidak berdaya, tapi bagaimanapun kamu merasa sedikit tidak nyaman.
actors.mobs.npcs.yvette.see-again=Wah kamu berhasil! Selamat!\n\nJangan khawatir tentangku. Aku sudah disembuhkan oleh alkemis tua itu, dan aku ingin istirahat sebentar di sini.\n\nKamu berhasil! Aku mengagumi keberanianmu!

actors.mobs.npcs.yvette$bow.name=Busur panjang Yvette
actors.mobs.npcs.yvette$bow.desc=Mustahil mahir menggunakan busur ini tanpa latihan formal, tapi ini bernilai banyak karena tampilannya yang indah.

###mobs
actors.mobs.acidic.name=skorpio asam

actors.mobs.albino.name=tikus albino
actors.mobs.albino.desc=Ini adalah jenis langka tikus marsupial, dengan bulu putih murni dan gigi bergerigi.

actors.mobs.ashesskull.name=Tengkorak Berabu
actors.mobs.ashesskull.desc=Tengkorak melayang yang mengerikan dengan kejahatan murni. Sepertinya lebih lemah daripada pejuang kerangka, tapi sejujurnya menjijikkan untuk melawan makhluk jahat ini.

actors.mobs.ballista.name=Ballista
actors.mobs.ballista.desc=Para Kurcaci mencoba menggabungkan pengetahuan mesin mereka dengan kekuatan elemental yang baru ditemukan. Sebagai elemen roh yang paling mudah dikendalikan yang dikenal semua, roh tanah digunakan sebagai "jiwa" mesin. Namun, kesalahan sekecil apa pun dalam upacara bisa menyebabkan ledakan serius.
actors.mobs.ballista.loaded=Memuat ulang...

actors.mobs.bandit.name=bandit gila

actors.mobs.bat.name=kelelawar vampir
actors.mobs.bat.def_verb=dihindari
actors.mobs.bat.desc=Penghuni kubah gua yang gesit dan ulet ini dapat mengalahkan lawan yang jauh lebih besar dengan memulihkan kesehatan mereka pada setiap serangan yang berhasil.

actors.mobs.bee.name=lebah emas
actors.mobs.bee.desc=Meskipun ukurannya kecil, lebah emas cenderung melindungi rumah mereka dengan gagah berani. Lebah ini sangat marah, sebaiknya jaga jarakmu.

actors.mobs.brute.name=brute gnoll
actors.mobs.brute.enraged=marah
actors.mobs.brute.enraged_text=Brute menjadi marah!
actors.mobs.brute.desc=Brute adalah gnoll terbesar, terkuat dan terkebal dari semua gnoll. Saat terluka parah, mereka menjadi amuk, memberikan kerusakan yang lebih besar lagi pada musuh mereka.

actors.mobs.crab.name=kepiting saluran air
actors.mobs.crab.def_verb=ditangkis
actors.mobs.crab.desc=Kepiting raksasa ini berada di puncak rantai makanan di saluran air. Mereka sangat cepat dan karapas tebal mereka bisa menahan pukulan berat.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=Personel tidak berwenang terdeteksi.
actors.mobs.dm300.defeated=Misi gagal. Mematikan.
actors.mobs.dm300.repair=DM-300 memperbaiki dirinya sendiri!
actors.mobs.dm300.overload=Overload!
actors.mobs.dm300.overload_warning=DM300 sedang overload!
actors.mobs.dm300.rankings_desc=Hancur oleh DM-300
actors.mobs.dm300.desc=Mesin ini diciptakan oleh para Kurcaci beberapa abad lalu. Kemudian, para Kurcaci mulai mengganti mesin dengan golem, elemental dan bahkan iblis. Pada akhirnya hal itu membawa peradaban mereka menuju kemunduran. DM-300 dan mesin serupa biasanya digunakan untuk konstruksi dan pertambangan, dan dalam beberapa kasus, untuk pertahanan kota.
actors.mobs.dm300.overloaded_desc=DM-300 sedang overload! Kecepatan serangannya dan kekuatan serangannya telah meningkat, tapi tidak lagi memiliki ketahanan fisik tambahan.

actors.mobs.elemental.name=elemental api
actors.mobs.elemental.desc=Elemental api yang berkeliaran adalah produk sampingan dari pemanggilan entitas yang lebih besar. Mereka terlalu kacau dalam sifatnya untuk dikendalikan bahkan oleh ahli iblis terkuat sekalipun.

actors.mobs.eye.name=mata jahat
actors.mobs.eye.deathgaze_kill=Deathgaze membunuhmu...
actors.mobs.eye.desc=Mata Jahat adalah bola melayang dari energi iblis yang tertahan. Meskipun mereka mampu bertempur jarak dekat, kekuatan sejati mereka berasal dari sihir mereka.\n\nSetelah mengumpulkan energi sebentar, Mata Jahat akan melepaskan balok energi yang dahsyat yang disebut _deathgaze._ Apa pun dalam pandangan Mata Jahat akan mengalami kerusakan luar biasa, petualang bijak akan berlari mencari perlindungan.

actors.mobs.fetidrat.name=tikus busuk
actors.mobs.fetidrat.desc=Sesuatu jelas tidak beres dengan tikus ini. Bulunya yang hitam berminyak dan kulitnya yang membusul sangat berbeda dari tikus sehat yang sebelumnya kamu lihat. Matanya yang hijau pucat membuatnya terlihat terutama mengancam.\n\nTikus ini membawa awan bau busuk yang mengerikan, terlalu menyengat jika didekati.\n\nLendir hitam menetes dari mulut tikus, menembus lantai tapi tampaknya larut dalam air.

actors.mobs.glowworm.name=Cacing bercahaya
actors.mobs.glowworm.desc=Cacing bercahaya adalah organisme karnivora yang sangat beracun. Mereka biasanya hanya muncul pada malam hari dan memancarkan cahaya dalam gelap untuk menarik mangsa mereka.
actors.mobs.glowworm.light=Kamu ternoda fosfor!

actors.mobs.gnoll.name=pengintai gnoll
actors.mobs.gnoll.desc=Gnoll adalah humanoid mirip hyena. Mereka tinggal di saluran air dan dungeon, sesekali naik untuk menyerang permukaan. Pengintai gnoll adalah anggota reguler dari kelompok mereka, mereka tidak sekuat brute dan tidak sepintar shaman.

actors.mobs.gnolltrickster.name=penipu gnoll
actors.mobs.gnolltrickster.desc=Makhluk aneh, bahkan menurut standar gnoll. Ia membungkuk ke depan dengan senyuman jahat, hampir memeluk kantong yang tergantung di bahunya. Matanya melebar dengan campuran aneh antara ketakutan dan kegembiraan.\n\nAda koleksi besar dart yang dibuat dengan buruk di kantongnya, semuanya tampaknya berujung berbagai zat berbahaya.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=diblokir
actors.mobs.golem.desc=Para Kurcaci mencoba menggabungkan pengetahuan mekanisme mereka dengan kekuatan baru mengikat elemental. Mereka menggunakan roh tanah sebagai "jiwa" untuk tubuh mekanis golem, yang diyakini paling dapat dikendalikan dari semua. Meski demikian, kesalahan terkecil dalam ritual bisa menyebabkan letupan.

actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Goo sedang memompa dirinya!
actors.mobs.goo.enraged=marah
actors.mobs.goo.enraged_text=Goo Menjadi Marah!!
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Diserap oleh Goo
actors.mobs.goo.desc=Sedikit yang diketahui tentang Goo. Sangat mungkin ini bahkan bukan makhluk, melainkan konglomerasi zat-zat jahat dari saluran air yang entah bagaimana mendapat kecerdasan dasar. Bagaimanapun, sihir gelap pastilah yang memungkinkan Goo ada.\n\nSifatnya yang gelatin telah memungkinkannya menyerap banyak energi gelap, kamu merasa dingin hanya dari berada di dekatnya. Jika goo mampu menyerang dengan energi ini kamu tidak akan hidup lama.

actors.mobs.greatcrab.name=kepiting raksasa
actors.mobs.greatcrab.noticed=Kepiting memperhatikan serangan dan memblokir dengan capit masifnya.
actors.mobs.greatcrab.blocked=diblokir
actors.mobs.greatcrab.desc=Kepiting ini sangat besar, bahkan dibandingkan dengan kepiting saluran air lainnya. Cangkang birunya ditutupi retakan dan teritip, menunjukkan usia yang sangat tua. Ia berjalan perlahan, nyaris menjaga keseimbangan dengan capit masifnya.\n\nMeskipun kepiting hanya punya satu capit, ukurannya dengan mudah mengkompensasi. Kepiting mengangkat capit di depannya setiap kali melihat ancaman, melindungi diri di balik dinding karapas yang tidak tembus.

actors.mobs.guard.name=penjaga penjara
actors.mobs.guard.scorpion=kesini!
actors.mobs.guard.def_verb=diblokir
actors.mobs.guard.desc=Dulu penjaga penjara, para penjaga ini telah lama menjadi tidak berbeda dari para tahanan. Mereka berjalan seperti zombie, tanpa otak berkeliaran di lorong mencari sesuatu yang tidak pada tempatnya, sepertimu!\n\nMereka membawa rantai di pinggangnya, mungkin digunakan untuk menarik musuh ke jarak dekat.

actors.mobs.king.name=Raja Kurcaci
actors.mobs.king.notice=Beraninya kamu!
actors.mobs.king.defeated=Kamu tidak bisa membunuhku, %s... Aku... abadi...
actors.mobs.king.def_verb=ditangkis
actors.mobs.king.greeting=Kurang ajar!
actors.mobs.king.arise=Bangkitlah, para budak!
actors.mobs.king.rankings_desc=Gugur Di Hadapan Raja Kurcaci
actors.mobs.king.desc=Raja kurcaci terakhir dikenal karena pemahamannya yang mendalam tentang proses kehidupan dan kematian. Ia telah membujuk anggota istananya untuk berpartisipasi dalam ritual, yang seharusnya memberi mereka keperawanan abadi. Pada akhirnya ia adalah satu-satunya yang mendapatkannya - dan tentara undead sebagai bonus.
actors.mobs.king$undead.name=kurcaci undead
actors.mobs.king$undead.def_verb=diblokir
actors.mobs.king$undead.rankings_desc=Gugur Di Hadapan Raja Kurcaci
actors.mobs.king$undead.desc=Kurcaci undead ini, dibangkitkan oleh kehendak Raja Kurcaci, adalah anggota istananya. Mereka muncul sebagai kerangka dengan jumlah rambut wajah yang menakjubkan.
actors.mobs.king$undead.awaken=Roz, Roz...

actors.mobs.mimic.name=mimic
actors.mobs.mimic.desc=Mimic adalah makhluk sihir yang bisa mengambil bentuk apa pun yang mereka inginkan. Di dungeon mereka hampir selalu memilih bentuk peti harta, karena mereka tahu cara memikat seorang petualang.

actors.mobs.mob.died=Kamu mendengar sesuatu mati di kejauhan.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.exp=%+dEXP
actors.mobs.mob.rankings_desc=Dibunuh oleh: %s
actors.mobs.mob$sleeping.status=%s ini sedang tidur.
actors.mobs.mob$wandering.status=%s ini sedang berkeliaran.
actors.mobs.mob$hunting.status=%s ini sedang berburu.
actors.mobs.mob$fleeing.status=%s ini sedang melarikan diri.
actors.mobs.mob$passive.status=%s ini pasif.

actors.mobs.monk.name=pendeta kurcaci
actors.mobs.monk.disarm=Pedeta menjatuhkan %s dari tanganmu!
actors.mobs.monk.def_verb=ditangkis
actors.mobs.monk.desc=Pendeta ini adalah fanatik, yang mengabdikan diri untuk melindungi rahasia kota mereka dari semua orang asing. Mereka tidak menggunakan baju zirah atau senjata apa pun, hanya mengandalkan seni pertarungan tangan kosong.

actors.mobs.newbornelemental.name=elemental api baru lahir
actors.mobs.newbornelemental.desc=Elemental api adalah produk sampingan dari pemanggilan entitas yang lebih besar. Mereka terlalu kacau dalam sifatnya untuk dikendalikan bahkan oleh ahli iblis terkuat sekalipun.\n\nElemental api ini baru dipanggil, dan melemah sebagai akibatnya. Dalam keadaan ini sangat rentan terhadap dingin. Kemampuan menyerangnya masih hebat, kewaspadaan dianjurkan.

actors.mobs.piranha.name=piranha raksasa
actors.mobs.piranha.desc=Ikan karnivora ini bukan penghuni alami kolam bawah tanah. Mereka dibiakkan khusus untuk melindungi brankas harta yang terendam.

actors.mobs.rat.name=tikus marsupial
actors.mobs.rat.desc=Tikus marsupial adalah penghuni saluran air yang agresif namun agak lemah. Mereka memiliki gigitan busuk, tapi hanya mengancam nyawa dalam jumlah besar.

actors.mobs.rotheart.name=jantung busuk
actors.mobs.rotheart.desc=Buah Rotberry sangat unik. Alih-alih membusul dan memberi nutrisi, buah itu tumbuh, mengeras, dan melingkupi biji. Ini memberikan perlindungan untuk organ dalam yang tumbuh di dalam buah. Bola raksasa ini disebut sebagai jantung tanaman rotberry dewasa.

actors.mobs.rotlasher.name=cambuk busuk
actors.mobs.rotlasher.desc=Cambuk busuk adalah bagian dari struktur akar tanaman rotberry dewasa, dan juga sarana pertahanan utama mereka. Cambuk tertanam di tanah, tapi akan menyerang dengan ganas apa pun yang mendekati mereka. Saat tidak ada mangsa di dekatnya, mereka berdiri diam, berusaha menyamarkan diri dengan vegetasi sekitar.
actors.mobs.rotlasher$waiting.status=%s ini menganggur.

actors.mobs.scorpio.name=skorpio
actors.mobs.scorpio.desc=Makhluk iblis mirip laba-laba raksasa ini menghindari pertarungan jarak dekat dengan segala cara, menembakkan duri bergerigi yang melumpuhkan dari jarak jauh.

actors.mobs.senior.name=pendeta senior

actors.mobs.shaman.name=shaman gnoll
actors.mobs.shaman.zap_kill=Kilat itu membunuhmu...
actors.mobs.shaman.desc=Gnoll paling pintar bisa menguasai sihir shamanistik. Shaman gnoll lebih menyukai mantra tempur untuk mengkompensasi kekurangan kekuatan, tidak ragu menggunakannya pada mereka yang mempertanyakan status mereka di suku.
actors.mobs.shaman.buffed=Shaman gnoll memberi %s amukan!

actors.mobs.shielded.name=brute berperisai
actors.mobs.shielded.def_verb=diblokir

actors.mobs.skeleton.name=kerangka
actors.mobs.skeleton.explo_kill=Kamu terbunuh oleh ledakan tulang...
actors.mobs.skeleton.def_verb=diblokir
actors.mobs.skeleton.desc=Kerangka terdiri dari tulang mayat dari petualang sial dan penghuni dungeon, diberi animasi oleh emanasi sihir jahat dari kedalaman di bawah. Setelah mereka rusak cukup, mereka hancur dalam ledakan tulang.

actors.mobs.spinner.name=laba-laba gua
actors.mobs.spinner.desc=Laba-laba gua berbulu kehijauan ini mencoba menghindari pertempuran langsung, lebih suka menunggu di kejauhan sementara korbannya, terjerat dalam jaring laba-laba yang dikeluarkan spinner, perlahan mati karena gigitan beracun mereka.

actors.mobs.statue.name=patung beranimasi
actors.mobs.statue.desc=Kamu pikir itu hanya salah satu patung jelek dungeon ini, tapi matanya yang bersinar merah membongkarnya.\n\nMeskipun patung itu terbuat dari batu, _%s,_ yang dipegangnya, terlihat nyata.

actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubus adalah iblis yang terlihat seperti gadis yang menggoda (dalam nuansa agak gotik). Menggunakan sihirnya, succubus bisa mempesona pahlawan, yang akan menjadi tidak mampu menyerang apa pun sampai pesona berlalu.

actors.mobs.swarm.name=gerombolan lalat
actors.mobs.swarm.def_verb=dihindari
actors.mobs.swarm.desc=Gerombolan lalat mematikan itu berdengung dengan marah. Setiap serangan non-magis akan membelahnya menjadi dua gerombolan yang lebih kecil namun sama berbahayanya.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_mine=Kamu milikku, %s!
actors.mobs.tengu.notice_face=Hadapi aku, %s!
actors.mobs.tengu.interesting=Mari kita buat ini menarik...
actors.mobs.tengu.defeated=Akhirnya bebas...
actors.mobs.tengu.rankings_desc=Dibunuh secara diam-diam oleh Tengu
actors.mobs.tengu.desc=Pembunuh bayaran terkenal dan misterius, dinamai dari topeng yang dicangkokkan ke wajahnya.\n\nTengu ditahan dengan penjepit besar di pergelangan tangan dan lututnya, meskipun sepertinya ia telah melepaskan rantainya sejak lama.\n\nIa akan mencoba menggunakan jebakan, sihir menipu, dan serangan presisi untuk menghabisi satu-satunya hal yang menghalangi pelariannya: kamu.

actors.mobs.dpdtengu.name=Tengu
actors.mobs.dpdtengu.notice_mine=Kamu milikku sekarang, %s!
actors.mobs.dpdtengu.notice_face=Hadapi aku secara langsung, %s!
actors.mobs.dpdtengu.interesting=Mari kita buat ini menarik...
actors.mobs.dpdtengu.defeated=Akhirnya bebas...
actors.mobs.dpdtengu.rankings_desc=Dibunuh secara diam-diam oleh Tengu
actors.mobs.dpdtengu.desc=Pembunuh bayaran terkenal dan misterius, dinamai dari topeng yang dicangkokkan ke wajahnya.\n\nTengu ditahan dengan penjepit besar di pergelangan tangan dan lututnya, meskipun sepertinya ia telah melepaskan rantainya sejak lama.\n\nIa akan mencoba menggunakan jebakan, sihir menipu, dan serangan presisi untuk menghabisi satu-satunya hal yang menghalangi pelariannya: kamu.

actors.mobs.thief.name=pencuri gila
actors.mobs.thief.stole=Pencuri mencuri %s darimu!
actors.mobs.thief.carries=\n\nPencuri membawa _%s._ Jelas curian.
actors.mobs.thief.escapes=Pencuri lolos bersama %s-mu!
actors.mobs.thief.desc=Meskipun para tahanan ini berkeliaran bebas dari sel mereka, tempat ini masih menjadi penjara mereka. Seiring waktu, tempat ini telah mengambil pikiran mereka dan juga kebebasan mereka. Sudah lama, para pencuri dan bandit gila ini telah lupa siapa mereka dan mengapa mereka mencuri.\n\nMusuh ini lebih cenderung mencuri dan lari daripada bertarung. Pastikan menjaga mereka tetap terlihat, atau kamu mungkin tidak pernah melihat barang curianmu lagi.

actors.mobs.wandguard.name=wandguard
actors.mobs.wandguard.desc=Wandguard adalah senjata pertahanan titik tetap yang umum dalam peperangan posisi. Yang tidak konsisten dengan namanya adalah bahwa ini bukan tongkat, melainkan jebakan atau sekadar menara pertahanan. \n\nPrototipenya adalah _%s_.

actors.mobs.warlock.name=warlock kurcaci
actors.mobs.warlock.bolt_kill=Bolt bayangan membunuhmu...
actors.mobs.warlock.desc=Ketika minat para kurcaci bergeser dari rekayasa ke seni gaib, para warlock berkuasa di kota. Mereka mulai dengan sihir elemental, tapi segera beralih ke demonologi dan nekromansi.

actors.mobs.wraith.name=wraith
actors.mobs.wraith.def_verb=dihindari
actors.mobs.wraith.desc=Wraith adalah roh pendendam seorang pendosa, yang kuburannya atau makamnya diganggu. Sebagai entitas etereal, sangat sulit untuk dipukul dengan senjata biasa.

actors.mobs.yog.name=Yog-Dzewa
actors.mobs.yog.notice=Harapan adalah ilusi...
actors.mobs.yog.defeated=...
actors.mobs.yog.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yog.desc=Yog-Dzewa adalah Dewa Tua, entitas kuat dari alam kekacauan. Satu abad lalu, para kurcaci kuno nyaris memenangkan perang melawan pasukan iblisnya, tapi tidak bisa membunuh dewa itu sendiri. Sebagai gantinya, mereka kemudian memenjarakannya di aula di bawah kota mereka, percaya bahwa ia terlalu lemah untuk bangkit lagi selamanya.
actors.mobs.yog$rottingfist.name=kebusukan tinju
actors.mobs.yog$rottingfist.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yog$rottingfist.desc=Yog-Dzewa adalah Dewa Tua, entitas kuat dari alam kekacauan. Satu abad lalu, para kurcaci kuno nyaris memenangkan perang melawan pasukan iblisnya, tapi tidak bisa membunuh dewa itu sendiri. Sebagai gantinya, mereka kemudian memenjarakannya di aula di bawah kota mereka, percaya bahwa ia terlalu lemah untuk bangkit lagi selamanya.
actors.mobs.yog$burningfist.name=tinju terbakar
actors.mobs.yog$burningfist.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yog$burningfist.desc=Yog-Dzewa adalah Dewa Tua, entitas kuat dari alam kekacauan. Satu abad lalu, para kurcaci kuno nyaris memenangkan perang melawan pasukan iblisnya, tapi tidak bisa membunuh dewa itu sendiri. Sebagai gantinya, mereka kemudian memenjarakannya di aula di bawah kota mereka, percaya bahwa ia terlalu lemah untuk bangkit lagi selamanya.
actors.mobs.yog$larva.name=larva dewa
actors.mobs.yog$larva.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yog$larva.desc=Yog-Dzewa adalah Dewa Tua, entitas kuat dari alam kekacauan. Satu abad lalu, para kurcaci kuno nyaris memenangkan perang melawan pasukan iblisnya, tapi tidak bisa membunuh dewa itu sendiri. Sebagai gantinya, mereka kemudian memenjarakannya di aula di bawah kota mereka, percaya bahwa ia terlalu lemah untuk bangkit lagi selamanya.

actors.char.kill=%s membunuhmu...
actors.char.defeat=Kamu mengalahkan %s.
actors.char.out_of_paralysis=Rasa sakit menyadarkan %s dari kelumpuhan.
actors.char.def_verb=menghindar

### dpd
actors.damage$type.normal=biasa
actors.damage$type.magical=magis
actors.damage$type.mental=mental

actors.mobs.npcs.categoal.name=Lix si kucing
actors.mobs.npcs.categoal.desc=Bagaimana bisa ada kucing di tempat seperti ini?
actors.mobs.npcs.categoal.greetings=Meow. Halo, petualang. Selamat datang di dunia ini. _Dungeon berada di Utara._\nPasti kau pernah dengar tentangku jika kau membaca halaman "ABOUT". Meow, ini pertanyaannya:\n_Lix_ adalah pihak yang baik, kan?
actors.mobs.npcs.categoal.agree=Tanpa ragu!
actors.mobs.npcs.categoal.disagree=Aku tidak begitu pikir.
actors.mobs.npcs.categoal.ans_happy=Jawabanmu membuat Meow sangat senang, meow~ Ambil ini, semoga beruntung, %s!
actors.mobs.npcs.categoal.ans_normal=Meow, jadi kau jujur? Apapun juga, ini untukmu, dan akan segera membantumu.
actors.mobs.npcs.categoal.happy=Meow, senang bertemu denganmu lagi!
actors.mobs.npcs.categoal.normal=Meow, semoga beruntung, %s yang jujur.
actors.mobs.npcs.categoal.from_egoal=Berasal dari Lix
actors.mobs.npcs.categoal.you-moved=Kau... kau baru saja bergerak?
actors.mobs.npcs.categoal.didi=Meow? Apa? Meow...\n\nAku tidak tahu apa yang terjadi, tapi Lix akan membantumu.
actors.mobs.npcs.categoal$wandering.status=Kucing ini... sedang berkeliaran?

actors.mobs.npcs.categoal$companion$gift.ac_open=buka
actors.mobs.npcs.categoal$companion$gift.name=hadiah kucing
actors.mobs.npcs.categoal$companion$gift.desc=Hadiah dari kucing yang bisa berbicara. _Kali ini lebih terang_, tampak bagus.
actors.mobs.npcs.categoal$companion$gift.opened=Kau membuka kotak itu dan mengambil semua isinya.

# villagers
actors.mobs.npcs.alchemist.name=alchemist tua
actors.mobs.npcs.alchemist.desc=Meskipun usianya cukup tua, ia masih terlihat sangat antusias dengan alkimia.
actors.mobs.npcs.alchemist.hello=Batuk batuk, apakah kau petualang lain yang akan pergi ke dungeon, anak muda? Aku sangat iri, batuk batuk, dengan kemampuanmu untuk pergi ke dungeon. Ada banyak sekali bahan alkimia langka di dungeon! Batuk batuk, betapa cepatnya waktu berlalu...\n\nTolong ambil ini, dan bantu aku mendapatkan beberapa _ embun _, aku perlu meracik obat untuk menyembuhkan batukku. Bagaimanapun, aku harap kau mau membantuku.
actors.mobs.npcs.alchemist.farewell=Ayo petualang, semoga beruntung! Aku menantikan apa yang kau temukan!
actors.mobs.npcs.alchemist.drink=Alchemist menghabiskan semua bahan.
actors.mobs.npcs.alchemist.reward_given=Terima kasih atas kebaikanmu dan aku harap _kertas uji_ ini dapat membantumu dalam petualanganmu.
actors.mobs.npcs.alchemist$wndalchemist.back=Batuk batuk, kau sudah kembali secepat ini. Bagaimana dengan bahan yang kau kumpulkan?
actors.mobs.npcs.alchemist$wndalchemist.no=Aku belum siap
actors.mobs.npcs.alchemist$wndalchemist.wait=Baiklah, aku harap kau tidak hanya mengambil botolku, anak muda.
actors.mobs.npcs.alchemist$wndalchemist.yes=Ya, ini untukmu
actors.mobs.npcs.alchemist$wndalchemist.bottle_miss=Kau, kau, batuk batuk, batuk... Di mana botolku! Apa yang KAU lakukan!
actors.mobs.npcs.alchemist$wndalchemist.empty=Kenapa kau kembali dengan botol kosong anak muda? Kau tidak harus membantuku jika kau tidak mau, batuk batuk.
actors.mobs.npcs.alchemist$wndalchemist.little=Baiklah batuk batuk, mungkin ini bisa berhasil meskipun agak kurang.
actors.mobs.npcs.alchemist$wndalchemist.enough=Oke, ini pasti cukup, terima kasih.
actors.mobs.npcs.alchemist$wndalchemist.full=Wah, sempurna! Kau melakukan dengan sangat baik!

actors.mobs.npcs.scholar.name=Scholar Misterius
actors.mobs.npcs.scholar.desc=Kami tidak bisa melihat wajah di balik jubah itu. Mungkin ia seorang pendeta atau biksu... Untuk sementara kami menganggapnya seorang scholar.
actors.mobs.npcs.scholar.hello=...
# 嘘……我在等一个人。

actors.mobs.npcs.jessica.name=Jessica
actors.mobs.npcs.jessica.desc=Kau bisa jelas merasakan kecemasan dan kegelisahan batinnya dari ekspresinya.
actors.mobs.npcs.jessica.desc_2=Ia menyedihkan karena tampak kebingungan dan terpuruk.
actors.mobs.npcs.jessica.please=Oh, petualang... Petualang? Apakah kau akan masuk ke dungeon? Kumohon, jika kau kebetulan bertemu _Cally_, tolong ingatkanlah dia, tolong, tolong biarkan dia kembali dengan selamat... Bagaimanapun aku salah, aku hanya berharap dia kembali dengan selamat...\n\nTerima kasih, terima...
actors.mobs.npcs.jessica.return_book=Kau mengembalikan diary milik Cally.
actors.mobs.npcs.jessica.thank_you=Oh...... Jadi, begitulah. Tidaaaak...... Semua itu salahku......\n\nOh, terima, terima kasih, mungkin aku sudah memprediksi akhir ini...... Bagaimanapun, terima kasih, petualang yang berani.
actors.mobs.npcs.jessica.farewell=Selamat tinggal, dan jangan khawatir tentang aku. Semoga Tuhan memberkahimu.

actors.mobs.npcs.kingstatuary.name=Patung Raja Kurcaci
actors.mobs.npcs.kingstatuary.desc=Patung ini berbeda dari patung-patung yang telah kau lihat sejauh ini. Sang kurcaci menunduk dengan palu raksasa di tangannya, dengan kemegahan yang menakutkan dan tekanan luar biasa. Pasti ia seorang raksasa,
actors.mobs.npcs.kingstatuary.desc_unwear=tapi kepalanya menunjukkan bahwa seharusnya ada satu mahkota yang sesuai dengan patung ini.
actors.mobs.npcs.kingstatuary.desc_wear=dan mahkota adalah simbol kebangsawanan.
actors.mobs.npcs.kingstatuary.wear=Pasangkan mahkota untuknya
actors.mobs.npcs.kingstatuary.unworthy=Itu tidak sepadan
actors.mobs.npcs.kingstatuary.no_crown=Tampaknya kau tidak memiliki mahkota yang sesuai.
actors.mobs.npcs.kingstatuary.on_wear=Kau memasangkan mahkota pada patung itu, dan setelah beberapa goncangan, sebuah barang antik muncul di samping kakimu.

actors.mobs.npcs.disheartenedbuddy.name=Sodan
actors.mobs.npcs.disheartenedbuddy.desc=Wajahnya penuh kekecewaan, dan ia meringkuk dalam baju zirah tebal, siapa tahu pukulan apa yang telah ia terima?
actors.mobs.npcs.disheartenedbuddy.discourage0=Aku Sodan, sama sepertimu... Aku datang ke sini demi kekayaan dan ketenaran. Apakah kau tertarik oleh rumor tentang Amulet of Yendor di kedalaman dungeon ini? Itu hanya menipu.\nAku telah kehilangan segalanya... Kau akan seperti ini jika kau bersikeras dengan idemu...
actors.mobs.npcs.disheartenedbuddy.discourage1=Ada kutukan tak berujung di bawah tanah... Kegelapan dan keputusasaan akan merobek tubuhmu dan menghancurkan pikiranmu......\nSatu-satunya cara untuk melarikan diri dari nasib malangmu hanyalah menyerah sepertiku, hahahaha...
actors.mobs.npcs.disheartenedbuddy.discourage2=Tidak, tidak, tidak mungkin. TIDAK ADA SIAPAPUN yang bisa mendapatkan Amulet of Yendor, tidak ada yang bisa melakukannya. Lebih baik kau ikuti nasihatku...\nAduh, petualang lain... hantu lain...
actors.mobs.npcs.disheartenedbuddy.discourage3=Ah kau masih hidup... Tapi apa bedanya? Peralatanmu tidak akan bertahan lama, tidak bisa.\nTidak, tidak, itu tidak mungkin... Harapan hanyalah ilusi...
actors.mobs.npcs.disheartenedbuddy.amazed=A...apa?! Ini... ini TIDAK MUNGKIN benar! Pasti bukan Amlunt of Yendor!\n\nLagipula, karena tidak ada yang pernah mendapatkan amulet tersebut, aku TIDAK PERCAYA padamu! Semua ini hanyalah ilusi...

actors.mobs.npcs.minstrel.name=Minstrel Teller
actors.mobs.npcs.minstrel.desc=Ia tampak seperti minstrel yang berkeliaran ke seluruh dunia, menyebarkan epik kepahlawanan dan legenda negeri melalui pembacaan puisi, namun minstrel ini memiliki warna kulit yang tidak biasa dan terlihat sedikit gugup.
actors.mobs.npcs.minstrel.hello=Ha!seorang petualang? Panggil aku teller, "T-E-L-L-E-R", bukan "T-Y-L-O-R". Kau tahu, orang lain selalu bingung, tapi tidak apa-apa. Nama hanyalah nama sandi, bukan begitu?
actors.mobs.npcs.minstrel.ac_sing=Bolehkah aku pesan sebuah lagu?
actors.mobs.npcs.minstrel.select_poetry=Dengan senang hati. Yang mana, sahabatku?
actors.mobs.npcs.minstrel.poetry_away=Darah mengalir deras di dadamu, aku tahu kau lebih perkasa dari seribu orang;\nHarapan berbisik di telingamu, aku mengerti ambisimu yang luhur;\nMari pergi, mari pergi, dengan penuh semangat, jangan biarkan cita-citamu layu di sini;\nAh, mari pergi, genggam pedangmu, mendaki gunung tertinggi di sana;\nAku melihat mereka melambaikan tangan kepadamu dari kejauhan;\nMari pergi. Mari pergi. Saatnya memulai. Semoga masa depanmu secerah dewiku;\nAh, mari pergi, bawa tongkat kerajaanmu dan berlayar ke lautan pengetahuan tanpa akhir;\nAku akan menyanyikan perbuatan heroikmu di mana-mana.
actors.mobs.npcs.minstrel.ac_yourself=Beritahu aku tentang dirimu
actors.mobs.npcs.minstrel.introduction=Oh? Karena warna kulitku yang aneh? Tidak apa-apa, haha! Aku berasal dari utara, berkeliaran di luar, apa yang kulihat dan kudengar selama perjalananku, dan semua pengalamanku membuatku merasa bebas, dan hal itu memang hal yang paling penting dalam hidupku.\nHanya satu hal, aku sering merindukan daging kaleng di kampung halamanku. Ya, benar. Daging kaleng.
actors.mobs.npcs.minstrel.ac_leave=Selamat tinggal
actors.mobs.npcs.minstrel.farewell=Semoga beruntung, sahabat!

actors.mobs.npcs.spdbattlemage.name=Frost Battlemage
actors.mobs.npcs.spdbattlemage.desc=Sang battlemage mengenakan sebuah amulet yang retak namun tak berbingkai di pinggangnya, dan tongkat di tangannya dihiasi dengan kristal es biru yang berkilau. Ada aura sihir yang luar biasa kuat di sekitarnya, hingga menusuk tulang.
actors.mobs.npcs.spdbattlemage.greetings=Halo, pengembara, dulu aku seorang petualang, sampai aku...\nAh, tidak apa-apa. Aku tidak yakin apakah kau pernah melihat peti harta berwarna hijau dengan rusuk emas. Dulu aku adalah battlemage terkuat di masa itu ketika ekspedisi kami pergi menjelajah bersama...
actors.mobs.npcs.spdbattlemage.ac_yourself=Apakah kau keberatan memperkenalkan diri?
actors.mobs.npcs.spdbattlemage.ac_suggest=Bagaimana kalau beberapa nasihat untukku?
actors.mobs.npcs.spdbattlemage.introduction=Dahulu kala aku masuk ke dungeon untuk mengejar harta, tapi kemudian aku sadar bahwa harta itu tidak ada artinya. Harta memang berharga, tapi cinta tak ternilai.\nSetelah aku mendapatkan amulet itu, aku berharap mendapatkan kekuatan untuk melindungi kekasihku. Tapi amulet itu hancur berkeping-keping dan akhirnya aku mengerti bahwa pengalaman di dungeonlah yang telah membuatku cukup kuat untuk menjaga kekasihku. Itulah makna sebenarnya.\nPergilah untuk apa yang benar-benar kau butuhkan, semoga beruntung!
actors.mobs.npcs.spdbattlemage.suggestion_no=Ha, pencapaianmu begitu luar biasa sehingga kau tidak lagi membutuhkan nasihatku!
actors.mobs.npcs.spdbattlemage.suggestion_0=Oh, ada macam-macam peninggalan di dungeon yang dahulu disebut artefak. Peralatan jenis ini akan perlahan menjadi lebih kuat saat kau menggunakannya, terkadang sangat membantu selama petualanganmu. Perhatikan artefak, tapi jangan selalu mengandalkannya pada saat yang sama.
actors.mobs.npcs.spdbattlemage.suggestion_1=Di dungeon ini ada berbagai... ruangan? Hah, yang ingin kukatakan adalah kau harus tetap tenang dan semuanya akan jelas setelah kau menjelajahi seluruh lantai. Terkadang ada ruangan terkunci yang membutuhkan kunci yang sesuai, terkadang ada ruangan khusus yang membutuhkan properti tertentu. Dan ada juga kasus langka: sebuah ruangan terhubung dengan sumur, dan kau bisa masuk dari lantai atas.
actors.mobs.npcs.spdbattlemage.suggestion_2=Aku pernah dengar bahwa dungeon ini berbeda dengan tempat yang aku jelajahi dalam banyak hal dan kau hanya bisa mengandalkan dirimu sendiri saat itu. Bagaimanapun aku berharap pengalamanku berguna bagimu.
actors.mobs.npcs.spdbattlemage.suggestion_3=Petualangan ini berlangsung lama dan persediaan yang kita bawa terbatas. Jadi kita harus berusaha mendapatkan persediaan. Terkadang bahkan daging monster adalah persediaan makanan yang berharga, tapi ingat bahwa sebaiknya kita memasaknya terlebih dahulu. Lagipula, tidak ada yang ingin ini mengganggu petualangan selanjutnya, kan?

# other npcs
actors.mobs.npcs.statuary.name_angel=patung dewi
actors.mobs.npcs.statuary.desc_angel=Gambaran perempuan yang digambarkan dalam patung ini memberimu perasaan suci. Menatap patung ini, rasa hormat muncul dengan sendirinya.
actors.mobs.npcs.statuary.agree_angel=BERDOA
actors.mobs.npcs.statuary.disagree_angel=PUAKI
actors.mobs.npcs.statuary.unholy=Saat kau fokus pada doa, tiba-tiba energi aneh menyerbu otakmu, membuatmu merasa sakit kepala. Tampaknya tidak semua patung suci.
actors.mobs.npcs.statuary.holy=Kau merasa jauh lebih baik, tapi kau tidak yakin apakah karena konsentrasi atau karena semacam energi yang terkandung dalam patung itu.
actors.mobs.npcs.statuary.infuse=Kau samar-samar merasakan beberapa bisikan, dan saat kau sadar kembali, kau menyadari ada beberapa perubahan pada senjatamu.
#
actors.mobs.npcs.statuary.name_monster=patung monster
actors.mobs.npcs.statuary.desc_monster=Patung ini tidak terlihat seperti dewi atau iblis biasa, menciptakan suasana yang aneh. Citra bukan manusia dan bukan iblis ini tampak memiliki pesona unik.
actors.mobs.npcs.statuary.agree_monster=PERSEMBAHAN
actors.mobs.npcs.statuary.disagree_monster=MELECEHKAN
actors.mobs.npcs.statuary.supply=Kau dengan hati-hati mempersembahkan %d emas.
actors.mobs.npcs.statuary.greedy="Manusia, jangan takut karena keserakahan adalah kodratmu." Tiba-tiba kau merasa begitu asing dengan sekitarmu.
#
actors.mobs.npcs.statuary.name_devil=patung iblis
actors.mobs.npcs.statuary.desc_devil=Patung yang buas ini membuat gemetar turun ke punggungmu. Meskipun iblis yang mengerikan itu membuatmu merasa takut, ada kemegahan dan rasa takut yang aneh bersamanya.
actors.mobs.npcs.statuary.agree_devil=KORBAN
actors.mobs.npcs.statuary.disagree_devil=PENCELAAN
actors.mobs.npcs.statuary.lowhp=Kau merasa terlalu lemah untuk berkorban.
actors.mobs.npcs.statuary.sacrifice=Kau melukai dirimu sendiri dan meneteskan darah di atas pedestal.
actors.mobs.npcs.statuary.more_blood=Tiba-tiba kau mulai berdarah seolah-olah darah "mengalir" ke patung ini. Iblis ini meminta lebih banyak darah!
actors.mobs.npcs.statuary.more_sanity=Hanya sekejap, kau seolah merasa patung ini telah menjadi makhluk hidup dan kau merasa takut.
actors.mobs.npcs.statuary.upht=Yang tak masuk akal adalah kau merasa lebih sehat setelah pengorbanan.
actors.mobs.npcs.statuary.upexp=Setelah pikiran yang kacau, kau merasa bahwa pengetahuanmu jauh lebih kaya. Pemerolehan ini adalah pertukaran setara antara kehendak dan pengalaman.
#
actors.mobs.npcs.statuary.blasphemy=Kau menyatakan kepenghinaanmu terhadap patung itu.
actors.mobs.npcs.statuary.nothing=Tidak ada yang terjadi.

actors.mobs.npcs.dpdshopkeeper.name=Penjaga Toko
actors.mobs.npcs.dpdshopkeeper.desc=Orang gemuk ini tampak lebih cocok berdagang di beberapa kota besar daripada di dungeon seperti ini. Harga barang-barang ini menjelaskan mengapa ia suka berdagang di sini.
actors.mobs.npcs.dpdshopkeeper.sell=Jual
actors.mobs.npcs.dpdshopkeeper.buy=Beli
actors.mobs.npcs.dpdshopkeeper.steal=Curi dengan tingkat keberhasilan %d%%
actors.mobs.npcs.dpdshopkeeper.select_to_sell=Pilih barang untuk dijual
actors.mobs.npcs.dpdshopkeeper.select_to_buy=Pilih barang untuk dibeli
# lines can be modified
actors.mobs.npcs.dpdshopkeeper.thief=Pencuri! Pencuri!
actors.mobs.npcs.dpdshopkeeper.greeting=Jangan sekadar lewat, petualang!
actors.mobs.npcs.dpdshopkeeper.no_enough_gold=Penjaga Toko: "tidak ada uang, tidak ada transaksi."
actors.mobs.npcs.dpdshopkeeper.nothing_more=Penjaga Toko: "Tidak ada yang menarik di sini!"

actors.mobs.npcs.dpdimpshopkeeper.name=imp yang ambisius
actors.mobs.npcs.dpdimpshopkeeper.desc=Imp adalah iblis tingkat rendah. Mereka tidak dikenal karena kekuatan maupun bakat sihir mereka, tapi mereka cukup pintar dan mudah bergaul. Banyak imp lebih suka hidup di antara non-iblis.
actors.mobs.npcs.dpdimpshopkeeper.thief=Aku pikir aku bisa mempercayaimu!
actors.mobs.npcs.dpdimpshopkeeper.greeting=Halo, senang bertemu denganmu lagi! Jalan di depan suram, harap berhati-hati.
actors.mobs.npcs.dpdimpshopkeeper.no_enough_gold=Imp: "Oh, uangmu tidak cukup."
actors.mobs.npcs.dpdimpshopkeeper.nothing_more=Imp: "Semua stokku sudah habis terjual."

actors.mobs.npcs.plaguedoctor.name=Dokter Pes
actors.mobs.npcs.plaguedoctor.desc=Kau tidak bisa mengetahui usianya maupun mengidentifikasi jenis kelaminnya.
actors.mobs.npcs.plaguedoctor.thief=Diam!
actors.mobs.npcs.plaguedoctor.greeting=Huh, apa yang kau inginkan?
actors.mobs.npcs.plaguedoctor.no_enough_gold=Usahaku bukan untuk amal.
actors.mobs.npcs.plaguedoctor.nothing_more=Apa yang kau cari?

actors.mobs.npcs.potionseller.name=alchemist
actors.mobs.npcs.potionseller.desc=Meskipun ia khusus menjual ramuan, kau tidak bisa mengharapkan diskon darinya.
actors.mobs.npcs.potionseller.thief=Dasar brengsek!
actors.mobs.npcs.potionseller.greeting=Datanglah untuk membeli ramuanku!
actors.mobs.npcs.potionseller.no_enough_gold=Alchemist:"Uangmu tidak cukup ya."
actors.mobs.npcs.potionseller.nothing_more=Alchemist:"Ramuanku sudah habis terjual."

actors.mobs.npcs.scrollseller.name=Arcanist
actors.mobs.npcs.scrollseller.desc=Siapa tahu mengapa seorang arcanist acuh tak acuh yang menganggap dirinya peneliti akan mengambil bisnis yang mengejar keuntungan seperti ini?
actors.mobs.npcs.scrollseller.thief=...
actors.mobs.npcs.scrollseller.greeting=Huh.
actors.mobs.npcs.scrollseller.no_enough_gold=Arcanist:"Tidak mungkin."
actors.mobs.npcs.scrollseller.nothing_more=Arcanist:"Tidak ada komentar."
actors.mobs.npcs.scrollseller.select_to_clean=Bersihkan sebuah barang
actors.mobs.npcs.scrollseller.clean=Bersihkan ( biaya %d emas )
actors.mobs.npcs.scrollseller.cleansed=Begitulah.
actors.mobs.npcs.scrollseller.not_cleansed=Upaya yang sia-sia.

actors.mobs.npcs.questioner.name=Penanya
actors.mobs.npcs.questioner.desc=Ia terlihat seperti dinding dengan wajah Tidak ada yang tahu apakah ia makhluk hidup atau bukan.
actors.mobs.npcs.questioner.pain=Apakah, rasa, sakit, terbesar, dalam, hidup?
actors.mobs.npcs.questioner.pain_0=Mencari dengan sia-sia
actors.mobs.npcs.questioner.pain_1=Mendapat tapi tersesat
actors.mobs.npcs.questioner.pain_pass=He, he, he...
actors.mobs.npcs.questioner.goal=Apakah, yang, kau, kejar, setelah, perjalanan, panjangmu, ke, sini?
actors.mobs.npcs.questioner.goal_0=Rasa ingin tahu pada hal yang tak diketahui mendorongku
actors.mobs.npcs.questioner.goal_1=Demi kekuatan di atas ribuan
actors.mobs.npcs.questioner.goal_pass=Men, arik...
actors.mobs.npcs.questioner.honour=Beritahu, aku, kemuliaanmu..
actors.mobs.npcs.questioner.honour_0=Si pemenang, si penulis
actors.mobs.npcs.questioner.honour_1=Keberanian untuk menghadapi ketakutan
actors.mobs.npcs.questioner.honour_pass=Hanya, manusia fana...
actors.mobs.npcs.questioner.fear=Apakah, pedang, yang, tergantung, di, atas, alismu?
actors.mobs.npcs.questioner.fear_0=Semua yang telah kuberikan
actors.mobs.npcs.questioner.fear_1=Aku telah bersiap
actors.mobs.npcs.questioner.fear_pass=Mem, bosankan.
actors.mobs.npcs.questioner.attack=(Hancurkan itu)
actors.mobs.npcs.questioner.tough=Sungguh menyakitkan bagimu untuk membahas hal-hal seperti itu dengan sebuah "dinding" di bawah dungeon yang gelap ini.
actors.mobs.npcs.questioner.silly=Bodoh.

actors.mobs.npcs.abysshero.name=Abysshero
actors.mobs.npcs.abysshero.desc=Seorang prajurit perkasa yang dipanggil dari pedang yang patah. Kau tidak bisa melihat wajahnya, yang memancarkan suasana membuat orang merinding. Kau bisa merasakan rasa penindasan yang jelas di sekitarnya.
actors.mobs.npcs.abysshero.defeat-me=Kalahkan aku!
actors.mobs.npcs.abysshero.spawned=Siapa yang memanggilku...

# mobs
actors.mobs.skeletonknight.name=Ksatria Kerangka
actors.mobs.skeletonknight.def_verb=Tangkis
actors.mobs.skeletonknight.desc=Prajurit tanpa kepala yang mengerikan itu masih mengenakan baju zirah pertempuran, meskipun sudah lapuk.
actors.mobs.skeletonknight.combo=Combo
actors.mobs.skeletonknight.counter=Lawan

actors.mobs.madman.name=Orang Gila
actors.mobs.madman.def_verb=Hindar
actors.mobs.madman.desc=Para petualang di dungeon yang putus asa, runtuh dan sepenuhnya kehilangan kesadaran diri, yang kini hanya bisa disebut "makhluk humanoid" berpakaian compang-camping. Sulit membayangkan bagaimana ia bisa bertahan hidup di sini.\nMeskipun tidak memiliki kekuatan tempur, identitasnya sebagai petualang yang situasinya dan kata-kata keputusasaannya tak terhindarkan membuat orang mengkhawatirkan nasib mereka sendiri dan meningkatkan tekanan.
actors.mobs.madman.shout_kill=Kau benar-benar hancur oleh teriakan orang-orang gila...

actors.mobs.devilghost.name=devilghost
actors.mobs.devilghost.def_verb=voidmelded
actors.mobs.devilghost.desc=Tidak ada yang tahu apa yang tersembunyi di balik jubah iblis berkepala domba ini, dan tidak ada yang ingin melihat "makhluk" mengerikan ini lagi.

# buff
actors.buffs.soulburning.name=Soul Burn
actors.buffs.soulburning.heromsg=Jiwamu terkorosi!
actors.buffs.soulburning.ondeath=Jiwamu sepenuhnya hancur...
actors.buffs.soulburning.rankings_desc=Jiwa dihancurkan
actors.buffs.soulburning.desc=Mantra jahat dan kuat ini membakar jiwa dan menyerang target langsung dari dalam pikiran. Satu-satunya cara adalah menunggu api jiwa mereda.\n\nApi jiwa akan membakar %s giliran.

actors.buffs.viewmark.name=Viewmark
actors.buffs.viewmark.desc=Makhluk ini terbuka pada pandangan pihak lain dan tidak bisa lolos dari tatapan. "im-watching-you..."

# pressure
actors.buffs.pressure.confident=Percaya Diri
actors.buffs.pressure.normal=Biasa
actors.buffs.pressure.nervous=Gugup
actors.buffs.pressure.collapse=Akan Runtuh
actors.buffs.pressure.reach_confident=Kau mendapatkan kembali kepercayaan diri.
actors.buffs.pressure.reach_normal=...
actors.buffs.pressure.reach_nervous=Kau mulai merasa tidak tenang.
actors.buffs.pressure.reach_collapse=Kau tidak bisa menahan tekanan dalam hatimu dan kau akan segera runtuh!
actors.buffs.pressure.desc_intro_confident=Kau percaya diri dengan petualanganmu, dan keadaan ini membuatmu bertarung lebih efektif.
actors.buffs.pressure.desc_intro_normal=Biasa.
actors.buffs.pressure.desc_intro_nervous=Kau merasa tidak tenang. Ketegangan memiliki dampak negatif pada petualangan dan pertempuranmu.
actors.buffs.pressure.desc_intro_collapse=Kau tidak bisa menjaga pikiran tetap fokus dan mungkin runtuh kapan saja.
actors.buffs.pressure.desc=\n\nEkspedisi akan memengaruhi psikologimu, dan stres akan perlahan menumpuk dalam petualanganmu sampai kau tidak tahan. Ketika stres psikologismu di luar kendali, ketakutan akan mengambil alih pikiranmu dan mengakhiri petualangan secara langsung.
actors.buffs.pressure.onhurt=Kau menderita karena kondisi mentalmu yang mengerikan.
actors.buffs.pressure.ondeath=Kau akhirnya runtuh...
actors.buffs.pressure.rankings_desc=Runtuh

actors.buffs.mustdodge.name=Lincah
actors.buffs.mustdodge.desc=Kau pasti menghindari kerusakan berikutnya dari jenis tertentu ( %d ). Giliran tersisa: %s.

actors.buffs.lifelink.name=Lifelink
actors.buffs.lifelink.desc=Makhluk ini terhubung dengan makhluk lain. Semua kerusakan yang diterimanya akan sebaliknya diterima oleh korban. Giliran efek tersisa: %s.
actors.buffs.lifelink.transform=transformasi

actors.buffs.vulnerable.name=Kerentanan
actors.buffs.vulnerable.desc_0=Kau rentan terhadap _kerusakan %s_ dan menerima lebih banyak kerusakan (rasio: %.2f). Giliran tersisa: %s.
actors.buffs.vulnerable.desc_1=Kau lebih tahan terhadap _kerusakan %s_ dan menerima lebih sedikit kerusakan (rasio: %.2f). Giliran tersisa: %s.

actors.buffs.resistany.name=Terlindungi
actors.buffs.resistany.desc=Perisai melindungimu dari %d kerusakan berikutnya.
actors.buffs.resistany.resist=tahan

actors.buffs.mending.name=Penyembuhan
actors.buffs.mending.desc=Sisa jumlah penyembuhan: %d.
actors.buffs.mending.start_mending=Luka-lukamu mulai menutup.

actors.buffs.ignorant.name=Tidak Tahu
actors.buffs.ignorant.desc=Kau tidak bisa melihat nilai-nilai yang berkaitan dengan pertempuran.

actors.buffs.shock.name=Terguncang
actors.buffs.shock.desc=Makhluk yang terguncang tidak bisa mengkoordinasikan pikiran dan tindakannya serta mustahil memberikan kerusakan apa pun. Giliran guncangan tersisa: %s.

actors.buffs.sharpvision.name=Penglihatan Tajam
actors.buffs.sharpvision.desc=Jarak pandangmu maksimal di bawah efek penglihatan tajam. Giliran tersisa: %s.

actors.buffs.drunk.name=Mabuk
actors.buffs.drunk.desc=Penglihatanmu kabur dan kau merasa seluruh dunia berputar.\n\nSaat kau mabuk, pukulanmu akan lebih kuat tapi lebih canggung dan kau tidak akan bisa membaca gulungan.\n\nGiliran mabuk tersisa: %s.

# ...
actors.hero.hero.leave_village=Apa yang kau lakukan di sini?!
actors.hero.hero.nervous_to_read=Ketegangan meresap ke hatimu dan kau hampir tidak bisa tetap berkonsentrasi, apalagi menelaah rune di gulungan.
actors.hero.hero.drunk_to_read=Kau tidak bisa membaca gulungan saat mabuk!

