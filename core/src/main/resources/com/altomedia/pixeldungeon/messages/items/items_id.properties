items.armor.sorceressarmor.desc=Dalam kostum ini, Penyihir dapat melemparkan cahaya sihir, racun, dan menakuti semua yang melihatnya.

items.artifacts.urnofshadow.name=Urn Bayangan
items.artifacts.urnofshadow.desc=Urn jahat ini tempat jiwa ditahan menjembatani komunikasi antara para master warlock dan iblis.
items.artifacts.urnofshadow.desc_hint=_Saat dipakai, urn bayangan dapat secara otomatis menyerap jiwa orang mati di sekitarnya._
items.artifacts.urnofshadow.collected=Urn bayangan menyerap dan menangkap jiwa %s.
items.artifacts.urnofshadow.full=Terlalu banyak jiwa di urnmu.
items.artifacts.urnofshadow.ac_consume=RAPALKAN
items.artifacts.urnofshadow.levelup=Urn bayanganmu bertambah kuat!
items.artifacts.urnofshadow.soul_siphon=Penyerapan jiwa
items.artifacts.urnofshadow.soul_siphon_desc=Menyerap jiwa target untuk melemahkan kemampuan bertarungnya. Kamu dapat memulihkan kesehatan jika korban itu telah menderita Dementage.
items.artifacts.urnofshadow.soul_burn=Pembakaran jiwa
items.artifacts.urnofshadow.soul_burn_desc=Mantra jahat yang menyerang di dalam jiwa. Tidak ada cara dari luar untuk memadamkan api jiwa. "jiwa-mu-akan-menderita!"
items.artifacts.urnofshadow.soul_mark=Tanda jiwa
items.artifacts.urnofshadow.soul_mark_desc=Memberi tanda jiwa berdasarkan level urn. Musuh dengan tanda jiwa dianggap sebagai persembahan iblis. Setelah mengambil nyawa korban, sebagai perantara warlock dapat memulihkan kesehatan dan kelaparannya sebagai imbalan dari para iblis.
items.artifacts.urnofshadow.spirit_siphon=Penyerapan jiwa
items.artifacts.urnofshadow.dementage=Dementage
items.artifacts.urnofshadow.dementage_desc=Ini adalah necromancy paling kejam rasanya... warlock dapat langsung mengambil kendali atas jiwa target! Dengan pengorbanan mantra ini, semua jiwa dalam urn dipersembahkan. Selain itu, korban akan diberi buff jika level urnmu cukup tinggi.
items.artifacts.urnofshadow.cost=( mengonsumsi %d muatan )
