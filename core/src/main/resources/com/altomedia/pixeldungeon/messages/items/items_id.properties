items.books.textbook.page0=Tidak ada yang menarik di sini.

items.books.textbook.callysdiary.bookname=Harian Cally
items.books.textbook.callysdiary.bookdesc=Ini adalah pengakuan terakhir petualang Cally. Sangat disayangkan.\n\nSemoga harian ini menjadi penjelasan yang masuk akal bagi Jessica.
items.books.textbook.callysdiary.pagesize=3
items.books.textbook.callysdiary.page0=Bulan Api unggun, tahun xx\nJessica bersikeras aku akan gagal... Tidak, mustahil! Aku akan membuktikan diriku, dia hanya bodoh dan berpandangan sempit... Tunggu saja, Jessica, aku akan kembali dengan harta dan mengubah nasib kita!\n\nBulan Embun beku, tahun xx\nHumph... Dungeon ini tidak seberapa bahaya seperti yang dibayangkan meskipun terlihat sulit pada pandangan pertama. Orang itu, Sodan, seorang pengecut, bagaimana bisa ia meremehkanku? Pengecut sepenuhnya!
items.books.textbook.callysdiary.page1=Bulan Embun beku, tahun xx\nKegelapan dan dingin menjemputku saat aku masuk lebih dalam ke dungeon ini dan aku merasa agak kedinginan... Tidak, Cally! Jangan lupakan niat awalmu! Ayo, teruslah maju, kamu bisa melakukannya, kamu bisa melakukannya.\n\nBulan Embun beku, tahun xx\nTidak... aku akan runtuh... Ada banyak mayat hidup yang tak terhitung. Makananku menipis, kekuatanku menurun. Oh tidak, Jessica sayang, betapa aku berharap bisa kembali... Tuhan, ampuni kecerobohanku, aku mohon Engkau memberkatiku agar bisa kembali kepadanya lagi......
items.books.textbook.callysdiary.page2=Bulan Embun beku, tahun xx\nAku tidak bisa keluar dari sini... Semua sumber dayaku habis, dan aku kelelahan... Aku sangat menyesal Jessica, aku... aku seharusnya tidak seperti ini... Kesalahanku menghancurkan diriku, menghancurkan hidup kita...... Betapa aku berharap, bisa memakai cincin ini untukmu, atau... tidak pernah mempertaruhkan nyawaku, di tempat putus asa seperti ini... Datanglah, kegelapan dan kutukan... Semoga Tuhan memberkatinya... memberkatinya......

items.books.textbook.yvettesdiary.bookname=Tulisan anumerta Yvette
items.books.textbook.yvettesdiary.bookdesc=Harian petualangan yang ditulis ranger Yvette di akhir hidupnya.
items.books.textbook.yvettesdiary.pagesize=3
items.books.textbook.yvettesdiary.page0=Ini akhirnya kupikir, akhirnya.\nTidak jelas dengan perasaan ini... Aku terjebak... selama sekitar tiga hari. Aku kelaparan dan jarang berpikir.\n\nTiba-tiba aku berharap tidak memblokir pintu itu... setidaknya aku bisa berakhir dalam pertarungan daripada berakhir secara pengecut seperti ini.\nSeperti apa aku nanti setelah akhirku? Ah, mungkin sama dengan sisa-sisa itu. Dan kemudian petualang lain mungkin penasaran apa yang tersembunyi di sini, seperti aku menggeledah sisa-sisa lain untuk harta... Huh, sungguh konyu...
items.books.textbook.yvettesdiary.page1=Adakah petualang lain lewat sebelum akhirku? Oh... tidak, siapa tahu apa yang akan mereka lakukan? Mereka mungkin menyelamatkanku, namun kemungkinan besar merampokku demi harta. Eh apa yang kupikirkan... tidak tahu apa yang kutulis sana-sini... Ah, sungguh tak bermakna. Siapa yang akan memperhatikan kertas ini, siapa yang peduli apa yang kutulis, dan siapa yang akan membantu mengirimkannya? Huh mengapa kamu masih percaya ilusi?... Bagaimanapun itu pilihanmu dan tak berguna menyesal sekarang...
items.books.textbook.yvettesdiary.page2=Tapi masih ada sesuatu yang mencurigakan... Aku sudah mencoba kunci ini pada banyak kunci pintu namun belum pernah ada yang cocok satu pun... Aku tidak yakin alasannya, kunci ini mungkin cocok untuk ruang misterius di lantai-lantai yang lebih dalam lagi...

items.books.textbook.wardensmithnotes.bookname=Catatan Warden Smith
items.books.textbook.wardensmithnotes.bookdesc=Tulisan tangan warden tampaknya adalah kata-kata terakhir yang ditinggalkan untuk sahabatnya.
items.books.textbook.wardensmithnotes.pagesize=2
items.books.textbook.wardensmithnotes.page0=Thomas,\n\nKau telah menjadi teman yang hebat, jadi aku akan berkenan membantumu. Saat kau memulai shift malam ini, periksa sel Tengu, lalu keluarlah.\n\nTidak masalah jika para tahanan mencoba melarikan diri, sebentar lagi tidak ada seorang pun yang bisa meninggalkan tempat ini.\n\nOrang aneh itu harus tetap diamankan, jika ia lolos tidak terduga apa yang akan dilakukannya, pastikan saja sel Tengu terkunci, lalu keluarlah.\n\n
items.books.textbook.wardensmithnotes.page1=Jangan repot-repot mencariku setelah ini, seorang kapten harus tenggelam bersama kapalnya.\n\n- Warden Smith

items.books.textbook.headlessknightslengend.bookname=Legenda Ksatria Tak Berkepala
items.books.textbook.headlessknightslengend.bookdesc=Halaman ini mendokumentasikan beberapa pengetahuan tentang ksatria tak berkepala menurut penelitian.
items.books.textbook.headlessknightslengend.pagesize=1
items.books.textbook.headlessknightslengend.page0=legenda ksatria tak berkepala

