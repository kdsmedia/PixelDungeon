items.artifacts.astrolabe$invoker.not_select_target=Target ini tidak valid.
items.artifacts.astrolabe$invoker.foresight=pandangan depan
items.artifacts.astrolabe$invoker.foresight_desc=Kamu telah meramalkan gerakan dan kematian lawanmu. Kamu pasti akan menghindari serangan berikutnya.
items.artifacts.astrolabe$invoker.purgation=pembersihan
items.artifacts.astrolabe$invoker.purgation_desc=Bersihkan semua debuff pada target. Berikan kerusakan murni berdasarkan kesehatan yang hilang dari musuhmu.
items.artifacts.astrolabe$invoker.life_link=ikatan-nyawa
items.artifacts.astrolabe$invoker.life_link_desc=Memanipulasi takdir untuk sementara. Memindahkan semua kerusakan yang diterima kepada musuh.
items.artifacts.astrolabe$invoker.extremely_lucky=keberuntungan
items.artifacts.astrolabe$invoker.extremely_lucky_desc=Takdir yang menentukan. Pulihkan sebagian kesehatan dan kebal terhadap efek negatif astrolabe berikutnya.
items.artifacts.astrolabe$invoker.extremely_lucky_block=Blok Keberuntungan
items.artifacts.astrolabe$invoker.pardon=ampunan
items.artifacts.astrolabe$invoker.pardon_desc=Kejahatan dan hukuman. Pulihkan sebagian kesehatan untuk musuhmu namun memberikan Rentan.
items.artifacts.astrolabe$invoker.faith=iman
items.artifacts.astrolabe$invoker.faith_desc=Imbalan kesetiaan. Kurangi sedikit tekanan dan kurangi penundaan muatan berikutnya.
items.artifacts.astrolabe$invoker.overload=kelebihan beban
items.artifacts.astrolabe$invoker.overload_desc=Kelebihan beban dirimu untuk merapal mantra kuat. Berikan kerusakan sihir yang besar dengan mengorbankan sedikit kesehatan.
items.artifacts.astrolabe$invoker.guide=panduan
items.artifacts.astrolabe$invoker.guide_desc=Salah satu pencapaian grand magus Rubick. Keterampilan ini mengangkat musuh ke udara untuk sebentar kemudian menjatuhkannya ke tanah. Dorong target mundur dan berikan beberapa kerusakan.
items.artifacts.astrolabe$invoker.prophesy=nubuat
items.artifacts.astrolabe$invoker.prophesy_desc=Kamu dapat merasakan aliran energi di sekitar dan menuntunnya untuk berkumpul. Bingungkan musuh di sekitar.
items.artifacts.astrolabe$invoker.sun_strike=tentangan matahari
items.artifacts.astrolabe$invoker.sun_strike_desc=Salah satu pencapaian besar Carl si Invoker. Memanggil panas bencana dari langit untuk memberikan banyak kerusakan pada musuh di area tertentu. _Pemerapalan membutuhkan 3 giliran mantra dan terpicu dengan jeda 2 giliran._

