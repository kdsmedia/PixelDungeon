items.artifacts.urnofshadow.no_soul=Kamu tidak dapat menjangkau jiwa target.
items.artifacts.urnofshadow.boss=Makhluk ini terlalu kuat untuk dikendalikan!
items.artifacts.urnofshadow.sucess_dementage=Kamu telah mengambil kendali atas %s dan kini ia menjadi budakmu.

items.artifacts.urnofshadow.not_yourself=Kamu tidak dapat merapal mantra ini kepada dirimu sendiri!

items.artifacts.astrolabe.name=Astrolabe
items.artifacts.astrolabe.desc=Astrolabe kuno dan misterius ini adalah artifak wajib bagi setiap pengamat bintang, memungkinkannya meramalkan fenomena astronomi tanpa memandang keadaan.\n_Menggunakan astrolabe akan memberikan efek acak padamu. Biasanya efeknya cenderung positif, namun sebaliknya jika astrolabe terkutuk. _
items.artifacts.astrolabe.select_invoker=Pilih satu untuk dirapal
items.artifacts.astrolabe.no_invoker=Aktifkan
items.artifacts.astrolabe.ac_invoke=AKTIFKAN
items.artifacts.astrolabe.cooldown=Kamu perlu menunggu %d giliran untuk mengaktifkan kembali astrolabe.
