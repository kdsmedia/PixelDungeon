items.artifacts.astrolabe$invoker.imprison=kurung

items.artifacts.riemannianmanifoldshield.name=Perisai Manifold Riemann
items.artifacts.riemannianmanifoldshield.desc= Ia terlihat lebih seperti bola menembus daripada perisai. Jadi siapa Riemann itu sebenarnya?\n\nPerisai kuat ini memiliki kemampuan menahan segala kerusakan.
items.artifacts.riemannianmanifoldshield.desc_cursed=Kutukan kuat sering muncul bersama kemampuan kuat, perisai terkutuk ini menghapus semua resistansimu!
items.artifacts.riemannianmanifoldshield.unequipped=Perisaimu tidak lagi mengisi daya.
items.artifacts.riemannianmanifoldshield.levelup=Perisai manifoldmu bertambah kuat!

items.artifacts.goldplatedstatue.name=Patung Berlapis Emas
items.artifacts.goldplatedstatue.desc=Sebuah patung perunggu emas tua, di mana emas yang terkelupas memperlihatkan logam murah yang membusuk di dalamnya. Kamu dapat mencium bau aneh, mungkin yang disebut bau tembaga uang.
items.artifacts.goldplatedstatue.desc_hint=Tampaknya kamu dapat memasukkan koin ke dalamnya melalui celah kecil di bagian atas.
items.artifacts.goldplatedstatue.desc_cursed=_Patung terkutuk sangat serakah sehingga ia mencuri emasmu!_
items.artifacts.goldplatedstatue.ac_invest=INVESTASIKAN
items.artifacts.goldplatedstatue.levelup=Kamu menginvestasikan %d emas. Saat kamu memasukkan emas, kamu samar-samar merasa pada suatu saat patungmu berkilauan dalam kegelapan. Patung berlapis emasmu bertambah kuat!
items.artifacts.goldplatedstatue.no_enough_gold=Hemat napasmu. Emasmu terlalu sedikit. ( diperlukan %d emas )
items.artifacts.goldplatedstatue.cursed=Patung ini terkutuk!

items.artifacts.handleofabyss.name=Gagang Jurang
items.artifacts.handleofabyss.real-name=pedang jurang yang patah
items.artifacts.handleofabyss.desc=Tampaknya ini pedang yang patah, gagangnya mulai membusuk, sementara bilah yang tersisa masih tajam. Jelas mustahil untuk berperan dalam pertarungan.
items.artifacts.handleofabyss.desc-real=Dulunya sebuah pedang panjang bernama "jurang". Tersisa sebagian kehendak seorang pejuang. Tidak jelas apakah itu sang penguasa jurang, atau sekadar kekuatan yang terjebak di dalamnya.\nPatahannya rapi seperti baru. Misterius lawan seperti apa yang dihadapinya pada saat terakhir. Pasti pertempuran yang tercatat dalam sejarah. Mungkin suatu hari kamu akan mengetahui jasanya di masa lalu.
items.artifacts.handleofabyss.desc-tip=_Memanggil pejuang jurang merugikan pikiranmu_.
items.artifacts.handleofabyss.desc-cursed=_Pejuang jurang yang dipanggil oleh gagang terkutuk TIDAK akan menaatimu._
items.artifacts.handleofabyss.ac_summon=PANGGIL
items.artifacts.handleofabyss.now-you-know=Kamu kini sudah mengenal gagang jurang.
items.artifacts.handleofabyss.already-summoned=Pejuang jurang tidak ada di dalam gagang!
items.artifacts.handleofabyss.no-charge=Gagang jurangmu masih mengisi daya.
items.artifacts.handleofabyss.cannot-summon-here=Kamu tidak dapat memanggilnya di sini.
items.artifacts.handleofabyss.levelup=Gagang jurang disempurnakan.
items.artifacts.handleofabyss.charged=Gagang jurangmu telah terisi penuh!

