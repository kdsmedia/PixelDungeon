items.unclassified.stylus.cursed=Sihir stylus tidak akan bekerja pada baju zirah terkutuk.
items.unclassified.stylus.inscribed=Kamu mengukir baju zirahmu dengan stylus
items.unclassified.stylus.desc=Stylus gaib ini terbuat dari batang gelap yang sangat keras. Menggunakannya kamu dapat mengukir glyph ajaib pada baju zirahmu, namun kamu tak punya kuasa untuk memilih glyph apa yang akan keluar, stylus-lah yang akan menentukannya untukmu.

items.unclassified.tomeofmastery.name=Kitab Penguasaan
items.unclassified.tomeofmastery.ac_read=BACA
items.unclassified.tomeofmastery.way=Kamu telah memilih jalan %s!
items.unclassified.tomeofmastery.desc=Buku kulit lusuh ini tidak terlalu tebal, namun kamu merasa entah bagaimana bisa menggali banyak hal darinya. Ingatlah bahwa membaca kitab ini mungkin membutuhkan waktu.

items.unclassified.torch.name=Obor
items.unclassified.torch.ac_light=NYALAKAN
items.unclassified.torch.desc=Obor sangat penting bagi petualanganmu. Obor dapat mengantarmu ke jalan yang benar saat kegelapan menguasai dungeon, namun kamu terekspos kepada musuh karena cahaya.

items.unclassified.unholyblood.name=Darah Tidak Suci
items.unclassified.unholyblood.desc=Darah yang menetes dari dewi cemburu yang terluka tidak suci.\n\nBahan langka yang jahat dan menggoda selalu menjadi yang terbaik untuk persembahan. Darah ini tampaknya memiliki resonansi dengan wadah sihir.
items.unclassified.unholyblood.ac_irrigate=SUNTIK
items.unclassified.unholyblood.irrigate=Saat kamu mendekatkan darah tidak suci ke tutup vial embun, tiba-tiba ia "terhisap" dan beberapa perubahan terjadi.

