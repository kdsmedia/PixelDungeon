###armor curses
items.armor.curses.antientropy.name=%s anti-entropi
items.armor.curses.antientropy.desc=Kutukan anti-entropi bekerja melawan kekuatan alam semesta, menarik energi dari penyerang dan memberikannya ke pemakai. Ini membekukan penyerang sejenak, tetapi membuat pemakai terbakar!

items.armor.curses.corrosion.name=%s korosi
items.armor.curses.corrosion.desc=Baju zirah korosi mampu menyemprotkan cairan korosif, melapisi segala sesuatu di sekitarnya dengan lumpur asam yang lengket.

items.armor.curses.displacement.name=%s perpindahan
items.armor.curses.displacement.desc=Kutukan perpindahan berusaha memindahkan pemakai ke tempat aman saat diserang. Namun ini sedikit terlalu efektif, secara acak menteleportasi pengguna ke berbagai tempat di lantai.

items.armor.curses.metabolism.name=%s metabolisme
items.armor.curses.metabolism.desc=Kutukan metabolisme secara langsung mengubah rasa kenyang menjadi kesehatan saat pemakai terluka, memberi dorongan penyembuhan, tetapi dengan cepat menyebabkan kelaparan.

items.armor.curses.multiplicity.name=%s multiplisitas
items.armor.curses.multiplicity.desc=Baju zirah yang dikutuk multiplisitas mengandung sihir duplikasi berbahaya. Terkadang ia akan menciptakan bayangan cermin dari pemakai, tetapi juga sama mungkinnya untuk menduplikasi penyerang!

items.armor.curses.stench.name=%s bau busuk
items.armor.curses.stench.desc=Baju zirah yang dikutuk bau busuk akan melepaskan awan gas beracun, yang berbahaya bagi segala sesuatu yang terjebak di dalamnya.


###glyphs
items.armor.glyphs.affection.name=%s afeksi
items.armor.glyphs.affection.desc=Glyph kuat ini memanipulasi pikiran penyerang, memikat mereka untuk sementara.

items.armor.glyphs.antimagic.name=%s anti-sihir
items.armor.glyphs.antimagic.desc=Glyph kuat ini memungkinkan baju zirah menerapkan pertahanannya pada sebagian besar serangan sihir maupun fisik.

items.armor.glyphs.brimstone.name=%s batu belerang
items.armor.glyphs.brimstone.desc=Glyph ini melindungi pemakai dan barang-barangnya dari api, dengan peningkatan ia bahkan mengubah panas menjadi kesehatan.

items.armor.glyphs.camouflage.name=%s kamuflase
items.armor.glyphs.camouflage.desc=Glyph ini memungkinkan pemakai berbaur dengan rumput tinggi, memberikan ketidakbekalan sementara.

items.armor.glyphs.entanglement.name=%s belitan
items.armor.glyphs.entanglement.desc=Glyph ini menumbuhkan earthroot di sekitar pemakai untuk menyerap kerusakan, namun mengikat mereka dalam prosesnya.

items.armor.glyphs.flow.name=%s arus
items.armor.glyphs.flow.desc=Glyph ini memanipulasi aliran air di sekitar pemakai, membuat mereka jauh lebih cepat saat bergerak di dalamnya.

items.armor.glyphs.obfuscation.name=%s pengaburan
items.armor.glyphs.obfuscation.desc=Glyph ini membuat pemakai lebih sulit dideteksi, dengan mengorbankan pertahanan.

items.armor.glyphs.potential.name=%s potensial
items.armor.glyphs.potential.rankings_desc=Dibunuh oleh: glyph of potential
items.armor.glyphs.potential.desc=Glyph ini melepaskan energi saat dipukul. Ini merugikan pemakai, tetapi mengisi ulang tongkat sihir.

items.armor.glyphs.repulsion.name=%s tolakan
items.armor.glyphs.repulsion.desc=Glyph ini memantulkan gaya terhadap penyerang, membuat mereka terpental ke belakang.

items.armor.glyphs.stone.name=%s batu
items.armor.glyphs.stone.desc=Glyph ini meningkatkan baik berat maupun kekuatan pertahanan baju zirah yang dilekatinya.

items.armor.glyphs.swiftness.name=%s kecepatan
items.armor.glyphs.swiftness.desc=Glyph ini mengubah sifat baju zirah, mengurangi berat dan meningkatkan penghindaran serta kecepatan, dengan mengorbankan pertahanan.

items.armor.glyphs.thorns.name=%s duri
items.armor.glyphs.thorns.desc=Glyph kuat ini melukai penyerang, menyebabkan mereka berdarah perlahan berdasarkan kerusakan yang mereka berikan.

items.armor.glyphs.viscosity.name=%s viskositas
items.armor.glyphs.viscosity.deferred=ditunda %d
items.armor.glyphs.viscosity$defereddamage.name=Kerusakan ditunda
items.armor.glyphs.viscosity$defereddamage.ondeath=Kerusakan ditunda itu membunuh Anda...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Dibunuh oleh kerusakan ditunda
items.armor.glyphs.viscosity$defereddamage.desc=Meskipun glyph baju zirah Anda telah melindungi Anda dari kerusakan, sepertinya ia perlahan-lahan membalasnya kepada Anda.\n\nKerusakan sedang ditimpakan kepada Anda seiring waktu, bukan sekaligus.\n\nSisa kerusakan ditunda: %d.
items.armor.glyphs.viscosity.desc=Glyph ini mampu menyimpan kerusakan yang ditimpakan pada pemakai, menimpakannya secara perlahan daripada sekaligus.

###armor
items.armor.armor.ac_detach=LEPAS
items.armor.armor.detach_seal=Anda melepas segel dari baju zirah Anda.
items.armor.armor.equip_cursed=Baju zirah itu melilit Anda dengan menyakitkan.
items.armor.armor.identify=Anda kini cukup mengenal baju zirah Anda untuk mengidentifikasinya.
items.armor.armor.incompatible=Interaksi berbagai jenis sihir telah menghapus glyph pada baju zirah ini!
items.armor.armor.curr_absorb=Baju zirah ini menahan _%1$d-%2$d kerusakan_ dan membutuhkan _%3$d kekuatan_ untuk digunakan dengan benar.
items.armor.armor.avg_absorb=Umumnya baju zirah ini menahan _%1$d-%2$d kerusakan_ dan membutuhkan _%3$d kekuatan_ untuk digunakan dengan benar.
items.armor.armor.too_heavy=Karena kekuatan Anda yang tidak memadai, memakai baju zirah ini akan mengurangi kemampuan Anda untuk bergerak, menghindar, dan bertahan.
items.armor.armor.probably_too_heavy=Mungkin baju zirah ini terlalu berat untuk Anda.
items.armor.armor.excess_str=Berkat kekuatan berlebih Anda, Anda _lebih lincah menghindar_ saat memakai baju zirah ini.
items.armor.armor.cursed_worn=Karena baju zirah ini dikutuk, Anda tidak berdaya untuk melepasnya.
items.armor.armor.cursed=Anda bisa merasakan sihir jahat yang bersembunyi di dalam baju zirah ini.
items.armor.armor.seal_attached=Segel rusak milik Warrior terpasang pada baju zirah ini.
items.armor.armor$glyph.glyph=Glyph
items.armor.armor$glyph.killed=%s membunuh Anda...

items.armor.classarmor.low_hp=Kesehatan Anda terlalu rendah!
items.armor.classarmor.not_equipped=Anda harus memakai baju zirah ini untuk menggunakan kekuatan khususnya!

items.armor.clotharmor.name=baju zirah kain
items.armor.clotharmor.desc=Baju zirah ringan ini memberikan perlindungan dasar.

items.armor.huntressarmor.name=jubah huntress
items.armor.huntressarmor.ac_special=BILAH SPEKTRAL
items.armor.huntressarmor.no_enemies=Tidak ada musuh terlihat
items.armor.huntressarmor.desc=Huntress dengan jubah seperti ini dapat menciptakan kipas bilah spektral. Setiap bilah akan menargetkan satu musuh dalam bidang pandang huntress, menimbulkan kerusakan tergantung senjata jarak dekat yang sedang dipakainya.

items.armor.leatherarmor.name=baju zirah kulit
items.armor.leatherarmor.desc=Baju zirah yang dibuat dari kulit monster yang disamak. Tidak selingan baju zirah kain tetapi memberikan perlindungan yang lebih baik.

items.armor.magearmor.name=jubah mage
items.armor.magearmor.ac_special=TANAH BERPANASAN
items.armor.magearmor.ac_fly=melayang
items.armor.magearmor.desc=Dengan memakai jubah megah ini, seorang mage dapat melemparkan mantra tanah berpanasan: semua musuh dalam bidang pandangnya akan terbakar dan tidak bisa bergerak pada saat bersamaan.
items.armor.magearmor.enhanced_desc=Jubah yang diperkuat dapat memberikan ketahanan sihir ekstra dan memungkinkan pemakai melayang di atas tanah untuk waktu singkat.
items.armor.magearmor.prompt=Pilih tujuan Anda
items.armor.magearmor.fly_ready=Melayang kini tersedia!

items.armor.mailarmor.name=baju zirah rantai
items.armor.mailarmor.desc=Tautan logam yang saling mengait membentuk baju zirah yang kuat namun fleksibel.

items.armor.platearmor.name=baju zirah pelat
items.armor.platearmor.desc=Pelat logam raksasa disatukan menjadi satu baju yang memberikan perlindungan tak tertandingi bagi petualang mana pun yang cukup kuat untuk menanggung beratnya yang luar biasa.

items.armor.roguearmor.name=pakaian rogue
items.armor.roguearmor.ac_special=BOM ASAP
items.armor.roguearmor.fov=Anda hanya bisa melompat ke lokasi kosong dalam bidang pandang Anda
items.armor.roguearmor.prompt=Pilih lokasi untuk melompat
items.armor.roguearmor.desc=Dengan memakai pakaian gelap ini, seorang rogue dapat melakukan trik yang disebut "bom asap": ia membutakan musuh yang bisa melihatnya dan melompat ke samping.

items.armor.scalearmor.name=baju zirah sisik
items.armor.scalearmor.desc=Sisik logam yang dijahit pada rompi kulit menciptakan baju zirah yang fleksibel namun pelindung.

items.armor.warriorarmor.name=baju zirah warrior
items.armor.warriorarmor.ac_special=LOMPATAN PAHLAWAN
items.armor.warriorarmor.prompt=Pilih arah lompatan
items.armor.warriorarmor.desc=Meskipun baju zirah ini terlihat berat, ia memungkinkan seorang warrior melakukan lompatan pahlawan menuju lokasi yang ditargetkan, jatuh mengejutkan semua musuh di sekitarnya.

###artifacts
items.artifacts.alchemiststoolkit.name=perkakas alchemist
items.artifacts.alchemiststoolkit.ac_brew=SEDIAKAN
##this one isn't dropped, so for now no i18n

items.artifacts.artifact.cannot_wear_two=Anda tidak bisa memakai dua artifak yang sama.
items.artifacts.artifact.cursed=Artifak itu terikat secara menyakitkan pada Anda.
items.artifacts.artifact.curse_known=Anda bisa merasakan sihir jahat yang bersembunyi di dalam artifak ini.
items.artifacts.artifact.need_to_equip=Anda harus memakai artifak Anda untuk melakukan itu.

items.artifacts.capeofthorns.name=jubah duri
items.artifacts.capeofthorns.desc=Lembaran logam yang runtuh dari DM-300 ini telah menyatu menjadi jubah yang kaku. Ia tampak menyimpan energi yang mendalam, mungkin ia memiliki sebagian kekuatan DM-300?
items.artifacts.capeofthorns.desc_inactive=Jubah itu terasa menenangkan beratnya di bahu Anda, sepertinya ia mendapatkan energi dari kerusakan yang Anda terima.
items.artifacts.capeofthorns.desc_active=Jubah itu tampak melepaskan energi tersimpan, ia memancarkan kekuatan pelindung.
items.artifacts.capeofthorns$thorns.inert=Jubah Anda menjadi inert kembali.
items.artifacts.capeofthorns$thorns.radiating=Jubah Anda mulai memancarkan energi, Anda merasa terlindungi!
items.artifacts.capeofthorns$thorns.levelup=Jubah Anda menjadi lebih kuat!
items.artifacts.capeofthorns$thorns.name=Duri
items.artifacts.capeofthorns$thorns.desc=Jubah Anda memancarkan energi, mengelilingi Anda dalam medan gaya pemantul!\n\nSemua kerusakan yang Anda terima berkurang selama efek duri aktif. Selain itu, jika penyerang berada di sebelah Anda, jumlah yang dikurangi dipantulkan kembali ke penyerang.\n\nSisa giliran duri: %s.

items.artifacts.chaliceofblood.name=piala darah
items.artifacts.chaliceofblood.ac_drink=MINUM
items.artifacts.chaliceofblood.desc=Piala perak berkilau ini dihiasi dengan batu permata tajam di tepinya secara aneh.
items.artifacts.chaliceofblood.desc_hint=Piala ini memiliki kekuatan iblis. Setiap kali Anda membunuh sebuah makhluk, piala ini mencuri sebagian esensi kehidupan korban dan energi yang tersimpan dapat digunakan untuk menyembuhkan pemiliknya.
items.artifacts.chaliceofblood.desc_cursed=_Piala yang dikutuk bisa jauh lebih kuat._
items.artifacts.chaliceofblood.empty=Piala Anda belum memiliki cukup energi.
items.artifacts.chaliceofblood.levelup=Piala darah Anda menjadi lebih kuat!

items.artifacts.cloakofshadows.name=jubah bayangan
items.artifacts.cloakofshadows.ac_stealth=SEMUNYI
items.artifacts.cloakofshadows.cooldown=Jubah Anda butuh %d ronde lagi untuk mengisi ulang energi.
items.artifacts.cloakofshadows.no_charge=Jubah Anda belum terisi cukup untuk bisa digunakan.
items.artifacts.cloakofshadows.desc=Jubah sihir tak ternilai, yang dicuri dari gudang senjata kerajaan bertahun-tahun lalu oleh Rogue. Saat dipakai, ia dapat digunakan untuk menjadi sepenuhnya tak terlihat untuk waktu singkat.\n\nMakin sering jubah digunakan, makin kuat ia menjadi, memungkinkan Rogue menjadi tak terlihat lebih sering dan lebih lama.
items.artifacts.cloakofshadows.enhanced_desc=Jubah yang diperkuat mengaburkan posisi sebenarnya dari pemakai, memungkinkan Anda menghindar lebih sering.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Jubah Anda telah kehabisan energi.
items.artifacts.cloakofshadows$cloakstealth.levelup=Jubah Anda menjadi lebih kuat!
items.artifacts.cloakofshadows$cloakstealth.name=Tersembunyi
items.artifacts.cloakofshadows$cloakstealth.desc=Jubah bayangan Anda memberi Anda ketidakbekalan saat Anda diselimutinya.\n\nSaat Anda tak terlihat, musuh tidak bisa menyerang atau mengikuti Anda. Serangan fisik dan efek sihir (seperti gulungan dan tongkat sihir) akan segera membatalkan ketidakbekalan.\n\nAnda akan tetap tersembunyi sampai dibatalkan atau jubah Anda kehabisan muatan.

items.artifacts.cloakofsheep.name=jubah domba
items.artifacts.cloakofsheep.cursed=Jubah domba Anda dikutuk, baa...
items.artifacts.cloakofsheep.not-ready=Jubah Anda belum siap, baa.
items.artifacts.cloakofsheep.cannot-move=Anda tidak bisa bergerak, baa...
items.artifacts.cloakofsheep.desc=Baa? Baa...
items.artifacts.cloakofsheep.desc_hint=Jubah ini meningkatkan ketangkasan pemakai, memungkinkan Anda menggunakan "_blink_" untuk berpindah seketika dan memanggil seekor domba di lokasi sebelumnya.\nIngatlah bahwa hal ini mungkin membuat marah musuh di sekitar.\n\nJarak maksimal blink: %d.
items.artifacts.cloakofsheep.ac_blink=BLINK
items.artifacts.cloakofsheep.prompt=pilih tujuan blink
items.artifacts.cloakofsheep.out-of-range=Jubah Anda tidak cukup kuat untuk blink sejauh itu.
items.artifacts.cloakofsheep.cannot-go-there=Anda tidak bisa pergi ke sana.
items.artifacts.cloakofsheep.levelup=Jubah domba Anda menjadi lebih kuat!

items.artifacts.driedrose.name=mawar kering
items.artifacts.driedrose.ac_summon=PANGGIL
items.artifacts.driedrose.spawned=Anda sudah memanggil hantu itu.
items.artifacts.driedrose.no_charge=Mawar Anda belum terisi penuh.
items.artifacts.driedrose.cursed=Anda tidak bisa menggunakan mawar yang dikutuk.
items.artifacts.driedrose.no_space=Tidak ada ruang kosong di dekat Anda.
items.artifacts.driedrose.charged=Mawar Anda terisi penuh!
items.artifacts.driedrose.desc=Apakah ini mawar yang disebut hantu itu sebelum menghilang? Ia tampak menyimpan kekuatan spiritual, mungkin dapat digunakan untuk menyalurkan energi prajurit yang hilang itu.
items.artifacts.driedrose.desc_hint=Tampaknya ia kehilangan beberapa mahkota. Mungkin memasangnya kembali akan memperkuat mawar.
items.artifacts.driedrose.desc_cursed=Mawar yang dikutuk terikat di tangan Anda, terasa mengerikan dinginnya.
items.artifacts.driedrose$companion$petal.name=kelopak kering
items.artifacts.driedrose$companion$petal.no_rose=Anda tidak punya mawar untuk menambahkan kelopak ini.
items.artifacts.driedrose$companion$petal.no_room=Tidak ada ruang lagi untuk kelopak ini, jadi Anda membuangnya.
items.artifacts.driedrose$companion$petal.maxlevel=Mawar telah lengkap!
items.artifacts.driedrose$companion$petal.levelup=Anda menambahkan kelopak itu ke mawar.
items.artifacts.driedrose$companion$petal.desc=Kelopak lemah yang telah mengering, yang entah bagaimana bertahan sampai sedalam ini di dungeon.

items.artifacts.etherealchains.name=rantai ethereal
items.artifacts.etherealchains.ac_cast=LEMPAR
items.artifacts.etherealchains.no_charge=Rantai Anda tidak memiliki cukup muatan.
items.artifacts.etherealchains.cursed=Anda tidak bisa menggunakan rantai yang dikutuk.
items.artifacts.etherealchains.does_nothing=Itu tidak akan berbuat apa-apa.
items.artifacts.etherealchains.cant_pull=Rantai Anda tidak bisa menarik target itu.
items.artifacts.etherealchains.nothing_to_grab=Tidak ada yang bisa direbut di sana.
items.artifacts.etherealchains.prompt=Pilih lokasi yang ditargetkan.
items.artifacts.etherealchains.desc=Rantai besar namun ringan ini bersinar dengan energi spiritual. Mereka dapat digunakan untuk menarik Anda ke medan, atau menarik musuh ke arah Anda. Sifat ethereal rantai bahkan memungkinkannya memanjang menembus dinding!
items.artifacts.etherealchains.desc_cursed=Rantai yang dikutuk terkunci di sisi Anda, terus berayun-ayun, berusaha menjatuhkan atau mengikat Anda
items.artifacts.etherealchains.desc_equipped=Rantai terlungga di sisi Anda, perlahan menyedot energi spiritual dari mereka yang Anda kalahkan. Setiap muatan adalah sebuah mata rantai, yang akan memanjang tepat satu petak.
items.artifacts.etherealchains$chainsrecharge.levelup=Rantai Anda menjadi lebih kuat!

items.artifacts.eyeballoftheelder.name=bola mata sang tetua
items.artifacts.eyeballoftheelder.desc=Berbeda dengan bagian lain dari sang nabi yang telah membusuk, bola mata ini masih mempertahankan bentuknya. Anda dapat dengan jelas merasakan kekuatan kutukan yang bersembunyi di dalamnya.
items.artifacts.eyeballoftheelder.desc_pair=Saat digabungkan, bola mata sang tetua dapat meledakkan kekuatan yang sangat kuat yang sama sekali di luar kendali Anda.
items.artifacts.eyeballoftheelder.desc_hint=_Artifak ini lebih kuat saat dikutuk._
items.artifacts.eyeballoftheelder.levelup=Bola mata sang tetua menjadi lebih kuat!
items.artifacts.eyeballoftheelder.cannot_unequip=Anda tidak berdaya untuk melepasnya.
items.artifacts.eyeballoftheelder.instant_kill=%s langsung terbunuh oleh tatapan bola mata tepat di depan Anda!
items.artifacts.eyeballoftheelder.combined=Bola mata sang tetua telah menyatu bersama.

items.artifacts.eyeballoftheelder$left.name=bola mata sang tetua (kiri)
items.artifacts.eyeballoftheelder$left.desc_left=_Ini adalah yang kiri dari dua bola mata dengan kekuatan penghancur._
items.artifacts.eyeballoftheelder$left.on-zap=Mata kiri memaksa Anda menembakkan sinar kematian!

items.artifacts.eyeballoftheelder$right.name=bola mata sang tetua (kanan)
items.artifacts.eyeballoftheelder$right.desc_right=_Ini adalah yang kiri dari dua bola mata dengan kekuatan kekosongan._\nSemua musuh dalam pandangan mata kanan memiliki ketahanan yang lebih rendah terhadap kerusakan sihir. Musuh akan _dilucuti senjata_ untuk sementara waktu jika Anda menerapkan mata kanan. _Mata kanan tidak bisa ditingkatkan saat digunakan_.
items.artifacts.eyeballoftheelder$right.ac_gaze=TATAP
items.artifacts.eyeballoftheelder$right.gaze_prompt=Pilih target
items.artifacts.eyeballoftheelder$right.no_charge=Mata kanan belum terisi penuh.
items.artifacts.eyeballoftheelder$right.on-zap= %s seketika kehilangan kemampuan untuk bertarung di bawah tatapan mata kanan!

items.artifacts.handoftheelder.name=tangan sang tetua
items.artifacts.handoftheelder.desc=Meskipun memiliki sejarah panjang, tangan yang membusuk ini masih mengandung kekuatan sang nabi dan cukup kuat.
items.artifacts.handoftheelder.desc_equipped=_Tidak ada yang bisa lolos begitu ditembak oleh tangan ini. Tangan ini bahkan lebih kuat jika dikutuk._\n\nTangan sang tetua perlahan meregenerasi energi di dalam tas Anda.
items.artifacts.handoftheelder.desc_rings=Cincin yang sudah dipakai:
items.artifacts.handoftheelder.ac_wear=PAKAI
items.artifacts.handoftheelder.ac_point=JARI KEMATIAN
items.artifacts.handoftheelder.cannot_wear=Tangan yang dikutuk terikat erat bersama dan Anda tidak bisa memakaikan cincin padanya.
items.artifacts.handoftheelder.wear_prompt=Pilih cincin untuk dipakai
items.artifacts.handoftheelder.levelup=Anda memakai %s di tangan. Sekejap cincin ini kehilangan kilaunya dan menyatu dengan tangan yang membusuk. Tangan sang tetua menjadi lebih kuat!
items.artifacts.handoftheelder.cursed_levelup=Anda memakai %s di tangan. Sekejap cincin ini kehilangan kilaunya dan menyatu dengan tangan yang membusuk. Kutukan yang bersembunyi di cincin membuat tangan menjadi dikutuk!
items.artifacts.handoftheelder.duplicate_ring=Anda tidak bisa memakai dua cincin jenis yang sama di tangan.
items.artifacts.handoftheelder.unknown_ring=Anda harus mengidentifikasi cincin ini terlebih dahulu.
items.artifacts.handoftheelder.no_charge=Tangan belum memiliki cukup energi sekarang.
items.artifacts.handoftheelder.point_prompt=Pilih target

items.artifacts.heartofsatan.name=jantung Satan
items.artifacts.heartofsatan.ac_prick=KORBAN
items.artifacts.heartofsatan.yes=Ya, saya tahu apa yang saya lakukan
items.artifacts.heartofsatan.no=Tidak, saya berubah pikiran
items.artifacts.heartofsatan.prick_warn=Setiap kali Anda berkorban, jantung akan menyedot lebih banyak energi kehidupan, jika Anda tidak hati-hati hal ini dapat dengan mudah membunuh Anda.\n\nApakah Anda yakin ingin memberinya lebih banyak energi kehidupan?
items.artifacts.heartofsatan.onprick=Anda menusuk diri sendiri, dan esensi kehidupan Anda tersedot ke dalam jantung.
items.artifacts.heartofsatan.ondeath=Jantung Satan mengeringkan esensi kehidupan Anda...
items.artifacts.heartofsatan.desc=Jantung raksasa yang telah dipisahkan dari organisme itu masih sedikit bergetar seolah-olah masih hidup dan hal ini membuat Anda merasa membeku darahnya. Entah bagaimana ia dinamai "Satan", karena pada akhirnya tidak ada yang cenderung percaya bahwa iblis memiliki jantung.
items.artifacts.heartofsatan.desc_cursed=Piala yang dikutuk telah mengikat dirinya pada tangan Anda, dan menghambat kemampuan Anda untuk meregenerasi kesehatan. Ia bahkan perlahan mencuri esensi kehidupan Anda!
items.artifacts.heartofsatan.desc_hint=Jantung tampaknya secara bertahap menjadi lebih bertenaga, Anda dapat samar-samar merasakannya menyalurkan energi kehidupan kepada Anda. Anda masih ingin berkorban untuk jantung, meskipun tahu itu akan menyakiti.

items.artifacts.hornofplenty.name=tanduk kelimpahan
items.artifacts.hornofplenty.ac_eat=MAKAN
items.artifacts.hornofplenty.ac_store=SIMPAN
items.artifacts.hornofplenty.eat=Anda makan dari tanduk.
items.artifacts.hornofplenty.prompt=Pilih sepotong makanan
items.artifacts.hornofplenty.no_food=Tanduk Anda tidak punya makanan untuk dimakan!
items.artifacts.hornofplenty.full=Tanduk Anda penuh dengan makanan!
items.artifacts.hornofplenty.reject=Tanduk Anda menolak blandfruit yang belum dimasak.
items.artifacts.hornofplenty.maxlevel=Tanduk Anda telah mengonsumsi semua makanan yang bisa ia konsumsi!
items.artifacts.hornofplenty.levelup=Tanduk mengonsumsi persembahan makanan Anda dan menjadi lebih kuat!
items.artifacts.hornofplenty.desc=Tanduk ini tidak bisa ditiup, tetapi sepertinya terisi makanan seiring waktu saat dipakai.
items.artifacts.hornofplenty.desc_hint=Mungkin ada cara untuk meningkatkan kekuatan tanduk dengan memberinya energi makanan.
items.artifacts.hornofplenty.desc_cursed=Tanduk yang dikutuk telah mengikat dirinya di sisi Anda, tampaknya ia lebih bersemangat untuk mengambil makanan daripada menghasilkannya.

items.artifacts.lloydsbeacon.name=suar lloyd
items.artifacts.lloydsbeacon.ac_zap=ZAP
items.artifacts.lloydsbeacon.ac_set=ATUR
items.artifacts.lloydsbeacon.ac_return=KEMBALI
items.artifacts.lloydsbeacon.no_charge=Suar Anda tidak memiliki cukup energi sekarang.
items.artifacts.lloydsbeacon.tele_fail=Sihir teleportasi gagal.
items.artifacts.lloydsbeacon.prompt=Pilih lokasi untuk zap.
items.artifacts.lloydsbeacon.levelup=Suar Anda menjadi lebih kuat!
items.artifacts.lloydsbeacon.preventing=Aura sihir yang kuat dari tempat ini menghalangi Anda menggunakan suar lloyd!
items.artifacts.lloydsbeacon.creatures=Aura psikis dari makhluk di sekitar tidak mengizinkan Anda menggunakan suar lloyd saat ini.
items.artifacts.lloydsbeacon.return=Suar lloyd berhasil diatur di lokasi Anda saat ini, kini Anda dapat kembali ke sini kapan saja.
items.artifacts.lloydsbeacon.desc=Suar lloyd adalah perangkat sihir yang rumit yang memberi pengguna kendali atas sihir teleportasi. Suar dapat digunakan untuk kembali ke lokasi yang diatur, tetapi juga dapat melepaskan letupan sihir teleportasi acak setelah terisi dari dipakai. Sihir ini dapat diarahkan ke target atau ke pengguna itu sendiri.
items.artifacts.lloydsbeacon.desc_set=Suar ini diatur di suatu tempat di lantai %d Pixel Dungeon.

items.artifacts.masterthievesarmband.name=gelang master pencuri
items.artifacts.masterthievesarmband.desc=Gelang beludru ungu ini memenuhi tanda seorang master pencuri. Ini bukan milik Anda, tetapi mungkin juga bukan milik orang yang Anda ambil darinya.
items.artifacts.masterthievesarmband.desc_worn=Dengan gelang di pergelangan tangan Anda, setiap keping emas yang Anda temukan membuat Anda lebih menginginkan milik orang lain. Mungkin tidak akan terlalu sulit untuk mencuri dari pixel mart...

items.artifacts.sandalsofnature.name=sandal alam
items.artifacts.sandalsofnature.name_1=sepatu alam
items.artifacts.sandalsofnature.name_2=sepatu bot alam
items.artifacts.sandalsofnature.name_3=greaves alam
items.artifacts.sandalsofnature.ac_feed=BERI MAKAN
items.artifacts.sandalsofnature.ac_root=AKAR
items.artifacts.sandalsofnature.no_charge=Mereka tidak punya energi saat ini.
items.artifacts.sandalsofnature.prompt=Pilih sebuah biji
items.artifacts.sandalsofnature.already_fed=Alas kaki Anda baru saja mendapatkan nutrisi dari biji tersebut.
items.artifacts.sandalsofnature.levelup=Alas kaki Anda membesar dengan cepat!
items.artifacts.sandalsofnature.absorb_seed=Alas kaki menyerap biji tersebut, mereka tampak lebih sehat.
items.artifacts.sandalsofnature.desc_1=Yang awalnya terlihat seperti sandal dari tali ternyata adalah dua tanaman! Mereka terlihat sangat lemah dan pucat, mungkin perlu diberi nutrisi?
items.artifacts.sandalsofnature.desc_2=Alas kaki telah tumbuh dan kini lebih menyerupai dua sepatu jahitan. Beberapa warna telah kembali pada mereka, mungkin mereka masih bisa tumbuh lebih lanjut?
items.artifacts.sandalsofnature.desc_3=Tanaman telah tumbuh lagi dan kini menyerupai sepasang sepatu bot kokoh dari kulit kayu. Tanaman tampak telah mendapatkan kembali kekuatannya, tetapi mungkin mereka masih bisa tumbuh lebih lanjut?
items.artifacts.sandalsofnature.desc_4=Tanaman tampaknya telah mencapai ukuran maksimum, mereka menyerupai sepasang greaves berzirah. Greaves tersebut berwarna coklat tua dan menyerupai pohon yang sangat kokoh.
items.artifacts.sandalsofnature.desc_hint=Anda merasa lebih selaras dengan alam saat memakai artifak ini.
items.artifacts.sandalsofnature.desc_cursed=Sandal terkutuk itu menghalangi hubungan apa pun dengan alam.
items.artifacts.sandalsofnature.desc_ability=Alas kaki telah memperoleh kemampuan untuk membentuk semacam baju zirah alam yang tidak bergerak, tetapi perlu mengisi daya dulu untuk itu.
items.artifacts.sandalsofnature.desc_seeds=Anda telah memberi makan alas kaki dengan %d biji.

items.artifacts.talismanofforesight.name=talisman firasat
items.artifacts.talismanofforesight.ac_scry=TELUSURI
items.artifacts.talismanofforesight.no_charge=Talisman Anda belum terisi penuh.
items.artifacts.talismanofforesight.scry=Talisman membanjiri pikiran Anda dengan pengetahuan tentang lantai saat ini.
items.artifacts.talismanofforesight.desc=Batu halus dengan ukiran aneh di atasnya. Anda merasa seolah ia mengawasi segala sesuatu di sekitar Anda, waspada terhadap hal-hal yang tidak biasa.
items.artifacts.talismanofforesight.desc_worn=Saat Anda memegang talisman, Anda merasa indra Anda menjadi lebih tajam.
items.artifacts.talismanofforesight.desc_cursed=Talisman terkutuk itu menatap Anda dengan tekun, membuat Anda tidak bisa berkonsentrasi.
items.artifacts.talismanofforesight$foresight.name=Firasat
items.artifacts.talismanofforesight$foresight.levelup=Talisman Anda menjadi lebih kuat!
items.artifacts.talismanofforesight$foresight.full_charge=Talisman Anda telah terisi penuh!
items.artifacts.talismanofforesight$foresight.uneasy=Anda merasa tidak tenang.
items.artifacts.talismanofforesight$foresight.desc=Anda merasa sangat gugup, seolah ada bahaya tak terlihat di dekat Anda.

items.artifacts.timekeepershourglass.name=jam pasir penjaga waktu
items.artifacts.timekeepershourglass.ac_activate=AKTIFKAN
items.artifacts.timekeepershourglass.deactivate=Anda menonaktifkan pembekuan waktu.
items.artifacts.timekeepershourglass.no_charge=Jam pasir Anda belum terisi cukup untuk dapat digunakan.
items.artifacts.timekeepershourglass.cursed=Anda tidak dapat menggunakan jam pasir yang terkutuk.
items.artifacts.timekeepershourglass.onfreeze=Segala sesuatu di sekitar Anda tiba-tiba membeku.
items.artifacts.timekeepershourglass.desc=Jam pasir besar yang berhias ini terlihat cukup biasa, tetapi Anda merasakan kekuatan besar di kerangkanya yang dipahat dengan halus. Saat Anda memutar jam pasir dan melihat pasir mengalir, Anda bisa merasakan sihirnya menarik Anda, mantera "THE WORLD" muncul di benak Anda. Pastinya menggunakan sihir ini akan memberi Anda kendali atas waktu.\n\n"Sayang, kau bahkan tidak menyadari fakta kematianmu."
items.artifacts.timekeepershourglass.desc_hint=Pembekuan waktu memungkinkan Anda menyerang musuh yang tidak curiga secara efektif. Jam pasir tampaknya telah kehilangan sebagian pasir, seandainya saja Anda bisa menemukan beberapa...
items.artifacts.timekeepershourglass.desc_cursed=Jam pasir terkutuk itu terkunci di sisi Anda, Anda bisa merasakannya berusaha memanipulasi aliran waktu Anda.
items.artifacts.timekeepershourglass.not-ready=Jam pasir Anda belum siap.
items.artifacts.timekeepershourglass$companion$sandbag.name=kantung pasir sihir
items.artifacts.timekeepershourglass$companion$sandbag.levelup=Anda menambahkan pasir ke jam pasir Anda.
items.artifacts.timekeepershourglass$companion$sandbag.maxlevel=Jam pasir Anda telah penuh dengan pasir sihir!
items.artifacts.timekeepershourglass$companion$sandbag.no_hourglass=Anda tidak punya jam pasir untuk dimasuki pasir ini.
items.artifacts.timekeepershourglass$companion$sandbag.desc=Kantung kecil berisi pasir halus ini seharusnya bekerja sempurna dengan jam pasir Anda.\n\nTampak aneh bahwa penjaga toko memiliki barang khusus ini tepat saat Anda membutuhkannya...

items.artifacts.unstablespellbook.name=buku mantra tak stabil
items.artifacts.unstablespellbook.ac_read=BACA
items.artifacts.unstablespellbook.ac_add=TAMBAH
items.artifacts.unstablespellbook.blinded=Anda tidak dapat membaca buku saat sedang buta.
items.artifacts.unstablespellbook.no_charge=Buku mantra Anda kehabisan energi untuk saat ini.
items.artifacts.unstablespellbook.cursed=Anda tidak dapat membaca dari buku mantra yang terkutuk.
items.artifacts.unstablespellbook.prompt=Pilih sebuah gulungan
items.artifacts.unstablespellbook.infuse_scroll=Anda menyalurkan energi gulungan ke dalam buku.
items.artifacts.unstablespellbook.unable_scroll=Anda tidak dapat menambahkan gulungan ini ke buku.
items.artifacts.unstablespellbook.unknown_scroll=Anda belum yakin jenis gulungan apa ini.
items.artifacts.unstablespellbook.desc=Tome ini dalam kondisi yang mengejutkan baik mengingat usianya. Buku berdesir dan berderak saat Anda membuka halamannya, dipenuhi energi tak stabil. Jika Anda membaca dari buku ini, tidak ada yang tahu mantra apa yang akan Anda lontarkan.
items.artifacts.unstablespellbook.desc_cursed=Buku terkutuk itu telah mengikat dirinya pada Anda, menghambat kemampuan Anda untuk menggunakan sebagian besar gulungan.
items.artifacts.unstablespellbook.desc_index=Indeks buku tidak lengkap, dan saat ini menunjuk ke halaman-halaman kosong berikut:



###bags
items.bags.bag.name=tas ransel

items.bags.potionbandolier.name=bandolier ramuan
items.bags.potionbandolier.desc=Bandolier tebal ini dipasang di dada Anda seperti selempang, memiliki banyak tali berisolasi untuk menahan botol ramuan.\n\nSaat berada di dalam bandolier, ramuan Anda seharusnya terlindungi dari dingin.

items.bags.scrollholder.name=tempat gulungan
items.bags.scrollholder.desc=Wadah berbentuk tabung ini terlihat seperti dapat menampung peta astronom, tetapi gulungan Anda akan muat sama baiknya.\n\nTempatnya tidak terlihat sangat mudah terbakar, jadi gulungan Anda seharusnya aman dari api di dalamnya.

items.bags.seedpouch.name=kantong biji
items.bags.seedpouch.desc=Kantong beludru kecil ini memungkinkan Anda menyimpan biji dalam jumlah berapa pun di dalamnya. Sangat praktis.

items.bags.wandholster.name=holster tongkat sihir
items.bags.wandholster.desc=Holster ramping ini terbuat dari kulit hewan eksotis, dan dirancang untuk menampung banyak tongkat sihir secara ringkas.\n\nHolster memancarkan medan sihir di sekitarnya, menyebabkan semua tongkat sihir di dalamnya terisi daya sedikit lebih cepat.



###food
items.food.blandfruit.name=buah tawar
items.food.blandfruit.sunfruit=buah matahari
items.food.blandfruit.rotfruit=buah busuk
items.food.blandfruit.earthfruit=buah bumi
items.food.blandfruit.blindfruit=buah buta
items.food.blandfruit.firefruit=buah api
items.food.blandfruit.icefruit=buah es
items.food.blandfruit.fadefruit=buah pudar
items.food.blandfruit.sorrowfruit=buah duka
items.food.blandfruit.stormfruit=buah badai
items.food.blandfruit.dreamfruit=buah mimpi
items.food.blandfruit.starfruit=buah bintang
items.food.blandfruit.mightfruit=buah kekuatan
items.food.blandfruit.raw=Anda tidak tahan memakannya mentah.
items.food.blandfruit.ice_msg=Buah es terasa agak seperti Frozen Carpaccio.
items.food.blandfruit.fire_msg=Anda merasakan api besar membakar dari dalam diri Anda!
items.food.blandfruit.toxic_msg=Anda diberkahi kekuatan racun jahat!
items.food.blandfruit.para_msg=Anda merasakan kekuatan bumi mengalir melalui diri Anda!
items.food.blandfruit.desc= begitu kering dan tidak bernyawa, mungkin merebusnya dengan bahan lain akan memperbaikinya.
items.food.blandfruit.desc_cooked=Buah telah mengembang dari waktu perendaman dalam panci dan bahkan menyerap sifat-sifat biji yang dimasak bersamanya.\n\nTampaknya siap untuk dimakan!

items.food.brownale.name=Bir Coklat
items.food.brownale.desc=Tak diragukan lagi bir ini dicampur dengan air dari kehalusannya, yang sudah diketahui baik oleh penjualnya. Meskipun bir ini tidak manis seperti yang asli maupun sangat kuat, setidaknya dapat membantu meredakan nyeri dan tekanan sampai batas tertentu.
items.food.brownale.hard_to_drink=Apa-apaan ini? Nyaris tidak bisa diminum!

items.food.chargrilledmeat.name=daging panggang
items.food.chargrilledmeat.desc=Terlihat seperti steak yang layak.

items.food.food.name=jatah makanan
items.food.food.ac_eat=MAKAN
items.food.food.eat_msg=Makanan itu terasa lezat!
items.food.food.desc=Tidak ada yang mewah di sini: daging kering, beberapa biskuit - hal-hal seperti itu.

items.food.frozencarpaccio.name=frozen carpaccio
items.food.frozencarpaccio.invis=Anda melihat tangan Anda berubah menjadi tak terlihat!
items.food.frozencarpaccio.hard=Anda merasakan kulit Anda mengeras!
items.food.frozencarpaccio.refresh=Menyegarkan!
items.food.frozencarpaccio.better=Anda merasa lebih baik!
items.food.frozencarpaccio.desc=Ini potongan daging mentah beku. Satu-satunya cara memakannya adalah dengan memotong irisan tipis-tipis. Dan dengan cara ini rasanya mengejutkan enak.

items.food.humanity.name=kemanusiaan
items.food.humanity.desc=Kebenaran, kemanusiaan, cahaya.\n\nAnda dapat memulihkan kesehatan dan mengurangi tekanan dengan mengonsumsinya.
items.food.humanity.ac_consume=KONSUMSI
items.food.humanity.used=Dalam sekejap, pikiran Anda mengembara melalui cerita dan masa lalu dalam kemanusiaan ini, dan Anda kembali penuh percaya diri.

items.food.mysterymeat.name=daging misteri
items.food.mysterymeat.eat_msg=Makanan itu terasa... aneh.
items.food.mysterymeat.hot=Wah, panas!
items.food.mysterymeat.legs=Anda tidak bisa merasakan kaki Anda!
items.food.mysterymeat.not_well=Anda tidak merasa sehat.
items.food.mysterymeat.stuffed=Anda kenyang.
items.food.mysterymeat.desc=Makan dengan risiko sendiri!

items.food.overpricedration.name=jatah makanan mahal
items.food.overpricedration.eat_msg=Makanan itu terasa lumayan.
items.food.overpricedration.desc=Terlihat persis seperti jatah makanan standar tetapi lebih kecil.

items.food.pasty.pasty=pasty
items.food.pasty.cane=permen tongkat
items.food.food.pasty_desc=Ini adalah pasty Cornish asli dengan isian tradisional daging sapi dan kentang.
items.food.food.cane_desc=Permen tongkat manis berukuran besar! Cukup besar untuk mengenyangkan Anda, dan gulanya mungkin memberi sedikit muatan ekstra pada tongkat sihir Anda juga.\n\nSelamat berlibur!

items.food.stewedmeat.name=daging rebus
items.food.stewedmeat.desc=Daging yang direbus dalam air mendidih. Seharusnya aman untuk dimakan.

items.food.wine.name=grog
items.food.wine.desc=Sejenis minuman keras biasa. Kelumpuhan mental akibat mabuk tidak selalu menjadi yang terburuk, setidaknya di dungeon yang suram ini.\n\nMinum dapat mengurangi sebagian tekanan, tetapi kebanyakan orang kehilangan arah saat mabuk.
items.food.wine.ac_drink=MINUM
items.food.wine.drunk=Habiskan! Meskipun Anda tahu itu merugikan kesehatan Anda, bagaimanapun Anda dapat memaksa diri untuk menenangkan pikiran.

### helmets
items.helmets.helmet.cannot-wear-two=Anda tidak dapat memakai beberapa helm sekaligus!
items.helmets.helmet.equip_cursed=Helm ini mengikat dirinya pada kepala Anda.
items.helmets.helmet.cursed=Helm itu mengikat dirinya pada Anda dengan menyakitkan.
items.helmets.helmet.cursed_desc=Anda merasa tidak enak dengan helm yang terkutuk.
items.helmets.helmet.inscribed=Permukaannya diukir dengan _%s_.
items.helmets.helmet.identify=Anda kini sudah mengenal helm Anda.

items.helmets.circletemerald.name=lingkaran zamrud
items.helmets.circletemerald.desc=Kita tidak tahu sudah berapa lama ia ada, tetapi setelah debunya dibersihkan, ia memperoleh tampilan yang sepenuhnya baru dan tetap menjadi ornamen kepala yang halus.
items.helmets.circletemerald.effect-desc=Tampaknya Anda merasa tenang saat memakai lingkaran zamrud, memperlambat kecepatan akumulasi tekanan.
items.helmets.circletemerald.cursed-desc=Lingkaran zamrud yang terkutuk akan memberikan efek sebaliknya.

items.helmets.crownofdwarf.name=mahkota dwarf
items.helmets.crownofdwarf.desc=Ini artifak langka setelah Raja Dwarf tewas. Mahkota emas yang halus itu bertatahkan permata. Setiap orang yang menghadapi mahakarya ini akan merasa waspada, karena mahkota itu telah menjadi simbol kekuasaan tertinggi, dan saksi dari masa kejayaan kerajaan dwarf masa lalu.\n\nKemewahan yang mencolok selalu menjadi incaran para pebisnis.

items.helmets.helmetbarbarian.name=helm barbarian
items.helmets.helmetbarbarian.desc=Ini helm barbarian, jika dua tanduknya belum cukup menjelaskan.
items.helmets.helmetbarbarian.effect-desc=Saat Anda terluka parah, pukulan Anda akan jauh lebih kuat.

items.helmets.helmetcrusader.name=helm crusader
items.helmets.helmetcrusader.desc=Helm biasa yang terlihat sedikit usang tetapi masih cukup bisa dipakai.
items.helmets.helmetcrusader.effect_desc=Helm crusader memungkinkan Anda punya peluang untuk memblokir serangan jarak jauh dengan biaya mengurangi 1 jarak pandang.

items.helmets.headdressregeneration.name=penutup kepala regenerasi
items.helmets.headdressregeneration.desc=Penutup kepala ini memiliki bentuk yang aneh, menyerupai hijab.
items.helmets.headdressregeneration.effect-desc=Penutup kepala regenerasi meningkatkan regenerasi nyawa Anda.
items.helmets.headdressregeneration.cursed-desc=Penutup kepala yang terkutuk justru akan memperlambat regenerasi Anda.

items.helmets.hoodapprentice.name=tudung murid
items.helmets.hoodapprentice.desc=Perlengkapan dasar para murid yang diterima di akademi penyihir, ringan dan ketat, sesuai dengan gaya para orang gila ini.
items.helmets.hoodapprentice.effect-desc=Anda merasa lebih seperti penyihir profesional dan tongkat sihir Anda lebih nyaman dengan tudung ini. Juga tongkat sihir Anda dapat memberikan kerusakan lebih besar.

items.helmets.maskofclown.name=topeng badut
items.helmets.maskofclown.desc=Topeng badut, ekspresi lucu yang berlebihan ini terlihat sangat aneh memang.
items.helmets.maskofclown.effect-desc=Saat memakai topeng ini, ada peluang untuk mengubah kerusakan yang Anda berikan menjadi kerusakan _MURNI_.

items.helmets.maskofhorror.name=topeng horor
items.helmets.maskofhorror.desc=Topeng horor, semangat dalam peperangan, simbol keberanian dan ketakutan, terutama bagi beberapa suku barbarian.
items.helmets.maskofhorror.effect-desc=Topeng ini memiliki peluang untuk menjamin serangan tepat tanpa memandang kondisi apa pun.
items.helmets.maskofhorror.cursed-desc=Topeng yang terkutuk justru akan membuat serangan Anda tidak akurat.

items.helmets.maskofmadness.name=topeng kegilaan
items.helmets.maskofmadness.desc="Sekali Anda memakai topeng ini, Anda akan menjadi pejuang yang tak terkendali," sebuah peringatan dari katak beku.\n\nPerlengkapan yang kuat namun berisiko. Pemakai dapat menikmati peningkatan kekuatan besar, tetapi dengan biaya menjadi rentan secara fisik maupun mental. _Efek ini meningkat seiring level topeng. Anda TIDAK dapat membatalkannya setelah memakainya!_
items.helmets.maskofmadness.cannot_unequip=Topeng ini telah menyatu dengan Anda dan Anda tidak berdaya untuk melepaskannya!
items.helmets.maskofmadness.levelup=Membunuh membuat topeng kegilaan Anda semakin kuat!

items.helmets.rangerhat.name=ikat kepala Ranger
items.helmets.rangerhat.desc=Ikat kepala ini tampak tidak berguna pada pandangan pertama, tetapi sebenarnya dapat mencegah keringat mengganggu pemakai tanpa menghalangi pandangan dan sangat cocok bagi yang lincah.
items.helmets.rangerhat.effect-desc=Ikat kepala ini dapat meningkatkan kerusakan serangan jarak jauh Anda.
items.helmets.rangerhat.cursed-desc=Ikat kepala yang terkutuk akan memberikan efek sebaliknya.

items.helmets.turtlescarf.name=Surat Kura-kura
items.helmets.turtlescarf.desc=Konon ada empat warna penutup kepala ini, tetapi siapa tahu apa hubungannya dengan kura-kura?
items.helmets.turtlescarf.effect-desc=Penutup kepala ini dapat memberi Anda ketahanan terhadap kerusakan sihir.
items.helmets.turtlescarf.cursed-desc=Yang terkutuk akan memberikan efek sebaliknya.

items.helmets.wizardhat.name=topi penyihir
items.helmets.wizardhat.desc=Topi penyihir terpisah yang jarang terlihat - para penyihir selalu lebih suka jubah.
items.helmets.wizardhat.effect-desc=Topeng ini tampaknya mengandung semacam sihir yang perlahan meningkatkan pengisian daya tongkat sihir Anda.
items.helmets.wizardhat.cursed-desc=Topi penyihir yang terkutuk memberikan efek sebaliknya.

###inscription
items.inscriptions.inscription.inscription=inskripsi

items.inscriptions.good.antimagic.name=anti-sihir %s
items.inscriptions.good.antimagic.desc=Inskripsi kuat ini memungkinkan baju zirah menerapkan pertahanannya pada sebagian besar serangan sihir maupun fisik.

items.inscriptions.good.healthy.name=nyawa %s
items.inscriptions.good.healthy.desc=Inskripsi ini meningkatkan kesehatan maksimum Anda.

###keys
items.keys.goldenkey.name=kunci emas
items.keys.goldenkey.desc=Takik pada kunci emas ini kecil dan rumit. Mungkin dapat membuka kunci peti?

items.keys.ironkey.name=kunci besi
items.keys.ironkey.desc=Takik pada kunci besi kuno ini sudah usang; tali kulitnya lapuk oleh usia. Pintu apa yang mungkin dibukanya?

items.keys.skeletonkey.name=kunci kerangka
items.keys.skeletonkey.desc=Kunci ini terlihat serius: kepalanya berbentuk tengkorak. Mungkin dapat membuka pintu yang serius.

###potions
items.potions.potion.ac_drink=MINUM
items.potions.potion.turquoise=ramuan turquoise
items.potions.potion.crimson=ramuan merah tua
items.potions.potion.azure=ramuan biru langit
items.potions.potion.jade=ramuan jade
items.potions.potion.golden=ramuan emas
items.potions.potion.magenta=ramuan magenta
items.potions.potion.charcoal=ramuan arang
items.potions.potion.ivory=ramuan gading
items.potions.potion.amber=ramuan amber
items.potions.potion.bistre=ramuan bistre
items.potions.potion.indigo=ramuan indigo
items.potions.potion.silver=ramuan perak
items.potions.potion.darkgreen=ramuan hijau gelap
items.potions.potion.unknown_desc=Botol ini berisi cairan berwarna yang berputar. Siapa tahu apa yang akan terjadi jika diminum atau dilemparkan?
items.potions.potion.harmful=Ramuan berbahaya!
items.potions.potion.beneficial=Ramuan bermanfaat
items.potions.potion.yes=Ya, saya tahu apa yang saya lakukan
items.potions.potion.no=Tidak, saya berubah pikiran
items.potions.potion.sure_drink=Anda yakin ingin meminumnya? Pada umumnya Anda sebaiknya melemparkan ramuan seperti itu ke musuh Anda.
items.potions.potion.sure_throw=Anda yakin ingin melemparkannya? Pada umumnya masuk akal untuk meminumnya.
items.potions.potion.shatter=Botol itu pecah dan cairannya terpercik tanpa efek.
items.potions.potion.nervous=Anda tidak dapat menenangkan pikiran, apalagi menjelajahinya lagi.

items.potions.potionofexperience.name=ramuan pengalaman
items.potions.potionofexperience.desc=Pengalaman dari banyak pertempuran yang dirangkum menjadi bentuk cairan, ramuan ini akan langsung meningkatkan level pengalaman Anda.
items.potions.potionofexperience.reinforced_desc=Ramuan pengalaman yang diperkuat lebih pekat dan memberikan lebih banyak pengalaman!

items.potions.potionoffrost.name=ramuan embun beku
items.potions.potionoffrost.desc=Saat terkena udara terbuka, bahan kimia ini akan menguap menjadi awan pembeku, menyebabkan makhluk apa pun yang bersentuhan dengannya membeku di tempat, tidak dapat bertindak dan bergerak. Efek pembekuan jauh lebih kuat jika lingkungan lembap.
items.potions.potionoffrost.reinforced_desc=Ramuan embun beku yang diperkuat jauh lebih dingin dan akan langsung _membekukan_ target dan ubin di sekitarnya!

items.potions.potionofhealing.name=ramuan penyembuhan
items.potions.potionofhealing.heal=Luka Anda sembuh sepenuhnya.
items.potions.potionofhealing.desc=Eliksir yang akan langsung memulihkan kesehatan Anda penuh dan menyembuhkan racun.
items.potions.potionofhealing.reinforced_desc=Ramuan penyembuhan yang diperkuat dapat langsung memulihkan seluruh kesehatan dan menghapus sebagian besar debuff.

items.potions.potionofinvisibility.name=ramuan tembus pandang
items.potions.potionofinvisibility.invisible=Anda melihat tangan Anda berubah menjadi tak terlihat!
items.potions.potionofinvisibility.desc=Meminum ramuan ini akan membuat Anda tak terlihat sementara. Saat tak terlihat, musuh tidak akan dapat melihat Anda. Menyerang musuh, serta menggunakan tongkat sihir atau gulungan di depan mata musuh, akan menghilangkan efeknya.

items.potions.potionoflevitation.name=ramuan levitasi
items.potions.potionoflevitation.float=Anda melayang ke udara!
items.potions.potionoflevitation.desc=Meminum cairan aneh ini akan membuat Anda melayang di udara, dapat mengapung dengan mudah di atas jebakan dan jurang. Melemparkan ramuan ini akan menciptakan awan gas kasar, membuat bingung apa pun yang terjebak di dalamnya.

items.potions.potionofliquidflame.name=ramuan api cair
items.potions.potionofliquidflame.desc=Botol ini berisi senyawa tak stabil yang akan meledak hebat menjadi api saat terkena udara terbuka.
items.potions.potionofliquidflame.reinforced_desc=Ramuan api cair yang diperkuat sangat tidak stabil dan tampak akan meledak kapan saja!

items.potions.potionofmight.name=ramuan kekuatan
items.potions.potionofmight.msg_1=+1 kekuatan, +6 HP
items.potions.potionofmight.msg_2=Kekuatan baru mengalir melalui tubuh Anda.
items.potions.potionofmight.desc=Cairan kuat ini akan mengalir melalui otot Anda, secara permanen menambah kekuatan Anda sebesar 1 poin dan kesehatan sebesar 6 poin.

items.potions.potionofmindvision.name=ramuan penglihatan mental
items.potions.potionofmindvision.see_mobs=Entah bagaimana Anda dapat merasakan kehadiran pikiran makhluk lain!
items.potions.potionofmindvision.see_none=Entah bagaimana Anda tahu bahwa Anda sendirian di lantai ini saat ini.
items.potions.potionofmindvision.desc=Setelah meminumnya, pikiran Anda akan selaras dengan jejak psikis makhluk jauh, memungkinkan Anda merasakan kehadiran biologis menembus dinding. Ramuan ini juga memungkinkan Anda menembus dinding dan pintu di sekitar.
items.potions.potionofmindvision.reinforced_desc=Ramuan penglihatan mental yang diperkuat memberi Anda _penglihatan tajam_ juga.

items.potions.potionofparalyticgas.name=ramuan gas melumpuhkan
items.potions.potionofparalyticgas.desc=Saat terkena udara terbuka, cairan dalam botol ini akan menguap menjadi kabut kuning yang kebas. Siapa pun yang menghirup awan itu akan langsung lumpuh, tidak dapat bergerak selama beberapa saat setelah awan menghilang. Barang ini dapat dilemparkan ke musuh jauh untuk menangkap mereka dalam efek gas.

items.potions.potionofphysique.name=Ramuan fisik
items.potions.potionofphysique.desc=Eliksir kuat yang dapat meningkatkan fisik secara instan.
items.potions.potionofphysique.real-desc=Ini adalah mahakarya alkemis Albert, tetapi sayangnya ia membawa kemalangan dan menjadi penyesalan terbesar dalam hidupnya.
items.potions.potionofphysique.reinforced_desc=Ramuan fisik yang diperkuat bahkan lebih manjur.
items.potions.potionofphysique.msg=+%d HP maks
items.potions.potionofphysique.stronger=Dengan lonjakan kekuatan dari dalam, Anda merasa menjadi lebih kuat.
items.potions.potionofphysique.amazed="Apa... apakah ini...!"

items.potions.potionofpurity.name=ramuan pemurnian
items.potions.potionofpurity.freshness=Anda merasakan kesegaran tak biasa di udara.
items.potions.potionofpurity.no_smell=Anda berhenti mencium bau apa pun!
items.potions.potionofpurity.desc=Reagen ini akan dengan cepat menetralisir semua gas berbahaya di area efeknya. Meminumnya akan memberi Anda kekebalan sementara terhadap gas-gas tersebut.
items.potions.potionofpurity.reinforced_desc=Ramuan kemurnian yang diperkuat menawarkan durasi kekebalan terhadap gumpalan gas yang berlipat ganda.

items.potions.potionofstrength.name=ramuan kekuatan
items.potions.potionofstrength.msg_1=+1 str
items.potions.potionofstrength.msg_2=Kekuatan baru mengalir melalui tubuh Anda.
items.potions.potionofstrength.desc=Cairan ampuh ini akan mengalir melalui otot-otot Anda, secara permanen menambah kekuatan Anda sebanyak satu poin.

items.potions.potionoftoxicgas.name=ramuan gas beracun
items.potions.potionoftoxicgas.desc=Membuka atau memecahkan kaca bertekanan ini akan membuat isinya meledak menjadi awan mematikan gas beracun berwarna hijau. Anda mungkin memilih untuk melemparkan ramuan ini ke musuh yang jauh daripada membukanya dengan tangan.
items.potions.potionoftoxicgas.reinforced_desc=Ramuan gas beracun yang diperkuat memiliki konsentrasi yang lebih tinggi. Ini membuatnya mencair dan hanya memengaruhi makhluk di sekitarnya. Lebih aman digunakan, efeknya lebih mematikan.


###quest items
items.quest.ceremonialcandle.name=lilin upacara
items.quest.ceremonialcandle.desc=Satu set lilin, yang meleleh dan menyatu akibat pemakaian.\n\nSendirian mereka tidak bernilai apa-apa, tetapi jika digunakan bersama lilin-lilin lain dalam suatu pola, mereka dapat memfokuskan energi untuk ritual pemanggilan.

items.quest.corpsedust.name=debu mayat
items.quest.corpsedust.desc=Gumpalan debu mayat ini tidak berbeda secara lahiriah dari gumpalan debu biasa. Namun Anda dapat merasakan energi jahat yang bersembunyi di dalamnya.\n\nMembuangnya secepat mungkin akan menjadi ide yang baik.
items.quest.corpsedust.picked=Merasa dingin merambat di tulang belakang Anda saat Anda mengambil debu mayat.

items.quest.darkgold.name=bijih emas gelap
items.quest.darkgold.desc=Logam ini disebut gelap bukan karena warnanya (tidak berbeda dari emas biasa), melainkan karena ia meleleh di bawah sinar matahari, sehingga menjadikannya tidak berguna di permukaan.

items.quest.dwarftoken.name=token dwarf
items.quest.dwarftoken.desc=Banyak dwarf dan beberapa ciptaan mereka yang lebih besar membawa potongan-potongan kecil logam ini dengan tujuan yang tidak diketahui. Mungkin itu perhiasan atau mungkin semacam kartu identitas. Dwarf adalah kaum yang aneh.

items.quest.embers.name=bara elemental
items.quest.embers.desc=Bara khusus yang hanya dapat dipanen dari fire elemental muda. Mereka memancarkan energi panas.

items.quest.pickaxe.name=pickaxe
items.quest.pickaxe.ac_mine=TAMBANG
items.quest.pickaxe.no_vein=Tidak ada urat emas gelap di dekat Anda untuk ditambang.
items.quest.pickaxe.desc=Ini adalah alat yang besar dan kokoh untuk memecah batu. Mungkin dapat digunakan sebagai senjata.

items.quest.ratskull.name=tengkorak tikus raksasa
items.quest.ratskull.desc=Tengkorak tikus yang mengejutkan besar. Ini akan menjadi trofi berburu yang hebat, jika Anda punya dinding untuk memasangnya.



###rings
items.rings.ring.diamond=cincin berlian
items.rings.ring.opal=cincin opal
items.rings.ring.garnet=cincin garnet
items.rings.ring.ruby=cincin ruby
items.rings.ring.amethyst=cincin amethyst
items.rings.ring.topaz=cincin topaz
items.rings.ring.onyx=cincin onyx
items.rings.ring.tourmaline=cincin tourmaline
items.rings.ring.emerald=cincin emerald
items.rings.ring.sapphire=cincin sapphire
items.rings.ring.quartz=cincin kuarsa
items.rings.ring.agate=cincin agate
items.rings.ring.cursed=Cincin itu mengejang di jari Anda dengan menyakitkan!
items.rings.ring.unknown_desc=Gelang logam ini dihiasi dengan permata besar yang berkilau dalam gelap. Siapa tahu efek apa yang dimilikinya saat dipakai?
items.rings.ring.known=Ini adalah %s
items.rings.ring.identify=Anda kini cukup mengenal cincin Anda untuk mengidentifikasinya. Ini adalah %s.
items.rings.ring.cursed_worn=Karena cincin ini terkutuk, Anda tidak berdaya untuk melepasnya.
items.rings.ring.curse_known=Anda dapat merasakan sihir jahat yang bersembunyi di dalam cincin ini.

items.rings.ringofaccuracy.name=cincin akurasi
items.rings.ringofaccuracy.desc=Cincin ini meningkatkan fokus Anda, mengurangi kemampuan musuh untuk menghindari serangan Anda. Cincin yang terdegradasi justru akan memudahkan musuh untuk menghindari serangan Anda.

items.rings.ringofelements.name=cincin elemen
items.rings.ringofelements.desc=Cincin ini memberikan resistensi terhadap elemen, mengurangi dampak kerusakan elemental, serta mengurangi durasi efek negatif.

items.rings.ringofevasion.name=cincin penghindaran
items.rings.ringofevasion.desc=Cincin ini mengaburkan posisi sebenarnya dari pemakainya, membuat mereka lebih sulit dideteksi dan diserang. Cincin yang terdegradasi justru akan membuat pemakai lebih mudah dideteksi dan dipukul.

items.rings.ringofforce.name=cincin kekuatan
items.rings.ringofforce.avg_dmg=Saat tanpa senjata, dengan kekuatan Anda saat ini, cincin ini akan memberikan _%1$d-%2$d kerusakan._
items.rings.ringofforce.typical_avg_dmg=Saat tanpa senjata, dengan kekuatan Anda saat ini, biasanya cincin ini akan memberikan _%1$d-%2$d kerusakan._
items.rings.ringofforce.desc=Cincin ini meningkatkan kekuatan pukulan pemakainya. Kekuatan tambahan ini cukup lemah saat memegang senjata, tetapi serangan tanpa senjata akan jauh lebih kuat. Cincin yang terdegradasi justru akan melemahkan pukulan pemakainya.

items.rings.ringoffuror.name=cincin amarah
items.rings.ringoffuror.desc=Cincin ini memberikan pemakainya amarah batin, memungkinkan mereka menyerang lebih cepat. Amarah ini bekerja paling baik dalam ledakan besar, sehingga senjata lambat jauh lebih diuntungkan daripada senjata cepat. Cincin yang terdegradasi justru akan memperlambat kecepatan serangan pemakainya.

items.rings.ringofhaste.name=cincin kecepatan
items.rings.ringofhaste.desc=Cincin ini mengurangi tekanan pergerakan pada pemakainya, memungkinkan mereka berlari dengan kecepatan supermanusia. Cincin yang terdegradasi justru akan membebani pemakainya.

# items.rings.ringofmagic.name=巫术之戒
# items.rings.ringofmagic.desc=你的法杖在这枚戒指散布的奥术力场中会变得更加强大。负等级的戒指则会削弱法杖效果。
items.rings.ringofcritical.name=cincin kritis
items.rings.ringofcritical.desc=Cincin ini meningkatkan ketangkasan pemakainya, memudahkan untuk mengenai titik lemah fatal lawan. Cincin yang terdegradasi pada gilirannya akan menurunkan kemungkinan serangan kritis.

items.rings.ringofmight.name=cincin keperkasaan
items.rings.ringofmight.desc=Cincin ini meningkatkan sifat fisik pemakainya, memberi mereka kekuatan fisik dan konstitusi yang lebih besar. Cincin yang terdegradasi akan melemahkan pemakainya.

items.rings.ringofsharpshooting.name=cincin tembak tepat
items.rings.ringofsharpshooting.desc=Cincin ini meningkatkan presisi dan bidikan pemakainya, yang akan membuat semua senjata proyektil lebih akurat dan tahan lama. Cincin yang terdegradasi akan memiliki efek sebaliknya.

items.rings.ringoftenacity.name=cincin ketabahan
items.rings.ringoftenacity.desc=Saat dipakai, cincin ini akan memungkinkan pemakainya menahan serangan yang biasanya mematikan. Semakin terluka pemakainya, semakin tinggi resistensi mereka terhadap kerusakan. Cincin yang terdegradasi justru akan memudahkan musuh untuk mengeksekusi pemakainya.

items.rings.ringofwealth.name=cincin kekayaan
items.rings.ringofwealth.desc=Tidak jelas apa sebenarnya yang dilakukan cincin ini, keberuntungan mungkin memengaruhi kehidupan seorang petualang dalam banyak cara halus. Secara alami cincin yang terdegradasi akan memberikan kemalangan.



###scrolls
items.scrolls.scroll.ac_read=BACA
items.scrolls.scroll.kaunan=gulungan KAUNAN
items.scrolls.scroll.sowilo=gulungan SOWILO
items.scrolls.scroll.laguz=gulungan LAGUZ
items.scrolls.scroll.yngvi=gulungan YNGVI
items.scrolls.scroll.gyfu=gulungan GYFU
items.scrolls.scroll.raido=gulungan RAIDO
items.scrolls.scroll.isaz=gulungan ISAZ
items.scrolls.scroll.mannaz=gulungan MANNAZ
items.scrolls.scroll.naudiz=gulungan NAUDIZ
items.scrolls.scroll.berkanan=gulungan BERKANAN
items.scrolls.scroll.odal=gulungan ODAL
items.scrolls.scroll.tiwaz=gulungan TIWAZ
items.scrolls.scroll.qi=gulungan QI
items.scrolls.scroll.lingel=gulungan LINGEL

items.scrolls.scroll.unknown_desc=Sebuah rune sihir yang tidak terbaca tertulis di atas perkamen ini. Siapa tahu apa yang akan terjadi jika dibacakan dengan keras?
items.scrolls.scroll.blinded=Anda tidak dapat membaca gulungan saat buta.
items.scrolls.scroll.cursed=Buku mantra terkutuk Anda mencegah Anda memanggil sihir gulungan ini! Namun sebuah gulungan penghilang kutukan mungkin cukup kuat untuk tetap bekerja...

items.scrolls.inventoryscroll.warning=Apakah Anda benar-benar ingin membatalkan penggunaan gulungan ini? Gulungan ini akan tetap terpakai.
items.scrolls.inventoryscroll.yes=Ya, saya yakin
items.scrolls.inventoryscroll.no=Tidak, saya berubah pikiran

items.scrolls.scrollofidentify.name=gulungan identifikasi
items.scrolls.scrollofidentify.inv_title=Pilih sebuah item untuk diidentifikasi
items.scrolls.scrollofidentify.it_is=Gulungan Anda mengidentifikasi %s.
items.scrolls.scrollofidentify.desc=Gulungan ini secara permanen mengungkap semua rahasia dari satu item.

items.scrolls.scrolloflullaby.name=gulungan lagu pengantar
items.scrolls.scrolloflullaby.sooth=Gulungan itu mengucapkan melodi yang menenangkan. Anda merasa sangat mengantuk.
items.scrolls.scrolloflullaby.desc=Membaca gulungan ini memancarkan melodi menenangkan yang akan menidurkan semua yang mendengarnya ke dalam tidur sihir yang nyenyak.

items.scrolls.scrollofenchanting.name=gulungan enchant
items.scrolls.scrollofenchanting.inv_title=Pilih sebuah item untuk di-enchant
items.scrolls.scrollofenchanting.enchant=%s Anda diberkati dengan energi arcane!
items.scrolls.scrollofenchanting.desc=Gulungan ini dapat memberikan sihir yang ampuh pada senjata dan baju zirah Anda.\n\nSenjata akan di-enchant, baju zirah akan diukir dengan glyph.\n\nJika sudah ada enchant atau glyph, gulungan akan menimpanya.

items.scrolls.scrollofmagicmapping.name=gulungan pemetaan sihir
items.scrolls.scrollofmagicmapping.layout=Anda kini menyadari tata letak lantai.
items.scrolls.scrollofmagicmapping.desc=Saat gulungan ini dibaca, gambar dengan kejernihan kristal akan terukir dalam ingatan Anda, memberi tahu Anda tata letak lantai yang tepat dan mengungkap semua rahasia tersembunyi. Lokasi item dan makhluk akan tetap tidak diketahui.

items.scrolls.scrollofmirrorimage.name=gulungan bayangan cermin
items.scrolls.scrollofmirrorimage.desc=Mantra pada gulungan ini akan menciptakan kembar ilusi dari pembacanya, yang akan mengejar musuh-musuh mereka.

items.scrolls.scrollofpsionicblast.name=gulungan ledakan psionik
items.scrolls.scrollofpsionicblast.ondeath=Ledakan Psionik merobek pikiran Anda...
items.scrolls.scrollofpsionicblast.desc=Gulungan ini mengandung energi destruktif yang dapat disalurkan untuk merobek pikiran semua makhluk yang terlihat. Kekuatan yang dilepaskan oleh gulungan juga akan membuat pembacanya buta, terkejut, dan terluka parah untuk sementara waktu.

items.scrolls.scrollofrage.name=gulungan amarah
items.scrolls.scrollofrage.roar=Gulungan memancarkan raungan penuh amarah yang bergema ke seluruh dungeon!
items.scrolls.scrollofrage.desc=Saat dibacakan, gulungan ini akan melepaskan raungan besar yang menarik semua musuh ke pembacanya, dan membuat yang berada di dekatnya menjadi murka.

items.scrolls.scrollofrecharging.name=gulungan pengisian daya
items.scrolls.scrollofrecharging.surge=Arus energi mengalir melalui tubuh Anda, menghidupkan kembali tongkat sihir Anda!
items.scrolls.scrollofrecharging.desc=Kekuatan sihir mentah yang terikat dalam perkamen ini, saat dilepaskan, akan mengisi daya semua tongkat sihir pengguna seiring waktu.

items.scrolls.scrollofremovecurse.name=gulungan penghilang kutukan
items.scrolls.scrollofremovecurse.inv_title=Pilih sebuah item untuk dibersihkan
items.scrolls.scrollofremovecurse.cleansed=Item Anda bersinar dengan cahaya pembersih, dan energi jahat tersebar!
items.scrolls.scrollofremovecurse.not_cleansed=Item Anda bersinar dengan cahaya pembersih, tetapi tidak terjadi apa-apa.
items.scrolls.scrollofremovecurse.desc=Mantra pada gulungan ini akan seketika menghapus segala kutukan dari satu senjata, cincin, tongkat sihir, baju zirah, atau artifak.

items.scrolls.scrollofteleportation.name=gulungan teleportasi
items.scrolls.scrollofteleportation.tele=Dalam sekejap mata Anda diteleportasi ke lokasi lain di lantai ini.
items.scrolls.scrollofteleportation.no_tele=Aura sihir yang kuat di tempat ini menghalangi Anda untuk teleportasi!
items.scrolls.scrollofteleportation.desc=Mantra di perkamen ini seketika memindahkan pembacanya ke lokasi acak di lantai dungeon. Ini dapat digunakan untuk melarikan diri dari situasi berbahaya, tetapi pembaca yang kurang beruntung mungkin menemukan diri mereka berada di tempat yang lebih berbahaya.
items.scrolls.scrollofteleportation.select-destination=Pilih tujuan Anda (batalkan untuk teleportasi ke titik acak)

items.scrolls.scrollofterror.name=gulungan teror
items.scrolls.scrollofterror.none=Gulungan memancarkan kilatan cahaya merah yang cemerlang.
items.scrolls.scrollofterror.one=Gulungan memancarkan kilatan cahaya merah yang cemerlang dan %s melarikan diri!
items.scrolls.scrollofterror.many=Gulungan memancarkan kilatan cahaya merah yang cemerlang dan monster-monster melarikan diri!
items.scrolls.scrollofterror.desc=Kilatan cahaya merah akan membuat semua makhluk dalam bidang pandangan Anda diliputi teror, dan mereka akan berbalik dan melarikan diri. Menyerang musuh yang melarikan diri akan menghilangkan efeknya.

items.scrolls.scrollofupgrade.name=gulungan peningkatan
items.scrolls.scrollofupgrade.inv_title=Pilih sebuah item untuk ditingkatkan
items.scrolls.scrollofupgrade.weaken_curse=Gulungan peningkatan melemahkan kutukan pada item Anda.
items.scrolls.scrollofupgrade.remove_curse=Gulungan peningkatan membersihkan kutukan pada item Anda!
items.scrolls.scrollofupgrade.desc=Gulungan ini akan meningkatkan satu item, memperbaiki kualitasnya. Tongkat sihir akan meningkat dalam kekuatan dan jumlah muatan, senjata dan baju zirah akan memberikan dan menahan lebih banyak kerusakan, dan efek cincin akan menguat. Gulungan ini bahkan kadang mampu menghilangkan efek kutukan, meskipun tidak seampuh gulungan penghilang kutukan.

items.scrolls.scrollofcurse.name=gulungan kutukan
items.scrolls.scrollofcurse.desc=Gulungan ini mengutuk sebuah item tanpa memengaruhi faktor lainnya.\n\nGulungan ini tampak tidak berguna pada pandangan pertama, tetapi Anda dapat memaksimalkan nilainya dengan memilih peralatan yang tepat.
items.scrolls.scrollofcurse.inv_title=Pilih sebuah item untuk dikutuk
items.scrolls.scrollofcurse.cursed=Anda menanamkan kutukan %s dengan gulungan kutukan.

items.scrolls.scrolloflight.name=gulungan cahaya
items.scrolls.scrolloflight.desc=Kebenaran, kemanusiaan, cahaya.\n\nKilau cahaya yang menyilaukan menerangi seluruh ruangan dan _mengejutkan_ semua musuh yang ingin mendekat.
items.scrolls.scrolloflight.cast=Gulungan memancarkan kilatan cahaya putih yang cemerlang.

###wands
items.wands.cursedwand.ondeath=Anda terbunuh oleh %s milik Anda sendiri.
items.wands.cursedwand.nothing=Tidak terjadi apa-apa.
items.wands.cursedwand.grass=Rumput bermunculan di sekitar Anda!
items.wands.cursedwand.fire=Anda mencium bau terbakar...
items.wands.cursedwand.transmogrify=Tongkat sihir Anda berubah menjadi item yang berbeda!

items.wands.wand.ac_zap=ZAP
items.wands.wand.fizzles=Tongkat sihir Anda mendesis; sepertinya tidak memiliki muatan yang cukup.
items.wands.wand.self_target=Anda tidak dapat menargetkan diri sendiri!
items.wands.wand.identify=Anda kini cukup mengenal %s Anda.
items.wands.wand.cursed=Tongkat sihir ini terkutuk, membuat sihirnya kacau dan acak.
items.wands.wand.curse_discover=%s ini terkutuk!
items.wands.wand.prompt=Pilih lokasi untuk di-zap

items.wands.wandofblastwave.name=tongkat sihir gelombang ledakan
items.wands.wandofblastwave.staff_name=tongkat staf gelombang ledakan
items.wands.wandofblastwave.ondeath=Anda terbunuh oleh Tongkat sihir Gelombang Ledakan milik Anda sendiri...
items.wands.wandofblastwave.desc=Tongkat sihir ini terbuat dari semacam batu berlapis marmer, dengan hiasan emas dan permata hitam bulat di ujungnya. Terasa sangat berat di tangan Anda.
items.wands.wandofblastwave.stats_desc=Tongkat sihir ini menembakkan bolt yang meledak secara hebat di lokasi target. Kekuatan ledakan ini memberikan _%1$d-%2$d kerusakan_ dan cukup kuat untuk melepaskan sebagian besar musuh terbang.

items.wands.wandofcorruption.name=tongkat sihir korupsi
items.wands.wandofcorruption.staff_name=tongkat staf korupsi
items.wands.wandofcorruption.already_corrupted=Karakter tersebut sudah dikorupsi.
items.wands.wandofcorruption.boss=Boss kebal terhadap korupsi.
items.wands.wandofcorruption.fail=Kekuatan korupsi tidak cukup kuat, tidak terjadi apa-apa.
items.wands.wandofcorruption.desc=Tongkat sihir ini memancarkan energi gelap, jika belum terlihat jelas dari tengkorak hiasan kecil berbentuk di ujungnya.
items.wands.wandofcorruption.stats_desc=Tongkat sihir ini akan melepaskan ledakan energi korupsi, berusaha menundukkan musuh sesuai kehendak Anda. Musuh dengan kesehatan penuh jauh lebih sulit dikorupsi daripada yang sudah melemah. Tongkat sihir ini menggunakan setidaknya satu muatan per cast, tetapi sering menggunakan lebih banyak dalam upaya mengalahkan musuh yang lebih sehat.

items.wands.wandofdisintegration.name=tongkat sihir disintegrasi
items.wands.wandofdisintegration.staff_name=tongkat staf disintegrasi
items.wands.wandofdisintegration.desc=Tongkat sihir ini terbuat dari bongkahan obsidian yang halus dan padat, dengan cahaya ungu tua yang merambung ke sisi-sisinya, berakhir di ujungnya. Ia bersinar dengan energi destruktif, menunggu untuk ditembakkan ke depan.
items.wands.wandofdisintegration.stats_desc=Tongkat sihir ini menembakkan sinar yang menembus rintangan apa pun, dan akan menempuh jarak lebih jauh semakin tinggi peningkatannya. Sinar ini memberikan _%1$d-%2$d kerusakan MURNI,_ dan juga memberikan kerusakan bonus untuk setiap musuh dan dinding yang ditembusnya.

items.wands.wandoffireblast.name=tongkat sihir ledakan api
items.wands.wandoffireblast.staff_name=tongkat staf ledakan api
items.wands.wandoffireblast.desc=Tongkat sihir ini terbuat dari kayu berlapis merah dengan daun emas yang dipakai dengan bebas agar terlihat cukup megah. Ia berderak dan mendesis di ujungnya, bersemangat untuk melepaskan sihirnya yang ampuh.
items.wands.wandoffireblast.stats_desc=Tongkat sihir ini menghasilkan ledakan api saat digunakan, membentang ke bentuk kerucut. Saat tongkat sihir ini ditingkatkan ia akan mengonsumsi lebih banyak muatan, efeknya menjadi jauh lebih kuat seiring bertambahnya muatan yang dikonsumsi. Serangan berikutnya akan mengonsumsi _%1$d muatan_ dan memberikan _%2$d-%3$d kerusakan._

items.wands.wandoffrost.name=tongkat sihir embun beku
items.wands.wandoffrost.staff_name=tongkat staf embun beku
items.wands.wandoffrost.desc=Tongkat sihir ini tampaknya terbuat dari semacam es sihir. Ia bersinar lebih terang menuju ujungnya yang membulat. Terasa sangat dingin saat dipegang, tetapi entah bagaimana tangan Anda tetap hangat.
items.wands.wandoffrost.stats_desc=Tongkat sihir ini menembakkan ledakan energi beku ke arah lawan Anda, memberikan _%1$d-%2$d kerusakan_ dan mendinginkan, yang mengurangi kecepatan. Efeknya tampak lebih kuat di air. Musuh yang didinginkan dan dibekukan menerima lebih sedikit kerusakan dari tongkat sihir ini, karena mereka sudah dingin.

items.wands.wandoflightning.name=tongkat sihir petir
items.wands.wandoflightning.staff_name=tongkat staf petir
items.wands.wandoflightning.ondeath=Anda terbunuh oleh Tongkat sihir Petir milik Anda sendiri...
items.wands.wandoflightning.desc=Tongkat sihir ini terbuat dari logam padat, membuatnya mengejutkan berat. Dua cabang melengkung bersama di ujungnya, dan listrik meloncat di antara keduanya.
items.wands.wandoflightning.stats_desc=Tongkat sihir ini mengirimkan petir ampuh yang meloncat melalui apa pun yang ditembakinya, memberikan _%1$d-%2$d kerusakan._ Listrik ini dapat memantul antara banyak musuh di sekitarnya, menyebarkan kerusakan di antara mereka. Petir dan kerusakan menyebar jauh lebih efektif di air. Jika Anda terlalu dekat, Anda mungkin juga terkena setrum!

items.wands.wandofmagicmissile.name=tongkat sihir misil sihir
items.wands.wandofmagicmissile.staff_name=tongkat staf misil sihir
items.wands.wandofmagicmissile.desc=Tongkat sihir yang cukup polos ini meluncurkan misil energi sihir murni. Meskipun tidak sekuat tongkat sihir lain, ia sedikit menggantinya dengan muatan yang lebih banyak tersedia.
items.wands.wandofmagicmissile.stats_desc=Setiap bolt dari tongkat sihir ini memberikan _%1$d-%2$d kerusakan,_ dan tidak memiliki efek tambahan.

items.wands.wandofprismaticlight.name=tongkat sihir cahaya prisma
items.wands.wandofprismaticlight.staff_name=tongkat staf cahaya prisma
items.wands.wandofprismaticlight.desc=Tongkat sihir ini terbuat dari bongkahan kristal tembus cahaya yang padat, seperti potongan panjang kaca halus. Bit-bit kecil cahaya berwarna-warni menari di sekitar ujung tongkat sihir, bersemangat untuk meledak keluar.
items.wands.wandofprismaticlight.stats_desc=Tongkat sihir ini menembakkan sinar cahaya yang menembus kegelapan dungeon, mengungkap area tersembunyi dan jebakan. Sinar ini dapat membutakan musuh, dan memberikan _%1$d-%2$d kerusakan cahaya._ Musuh iblis dan undead akan terbakar dalam cahaya terang tongkat sihir, menerima kerusakan bonus.

items.wands.wandofregrowth.name=tongkat sihir pertumbuhan kembali
items.wands.wandofregrowth.staff_name=tongkat staf pertumbuhan kembali
items.wands.wandofregrowth.desc=Tongkat sihir ini terbuat dari batang tipis kayu yang diukir dengan ahli. Entah bagaimana ia masih hidup dan segar, berwarna hijau cerah seperti inti pohon muda.
items.wands.wandofregrowth.stats_desc=Saat digunakan, tongkat sihir ini akan mengonsumsi semua muatannya untuk meledakkan energi pertumbuhan kembali sihir ke luar dalam bentuk kerucut. Sihir ini akan membuat rumput, akar, dan tanaman langka muncul hidup. "Saat kehidupan berakhir, kehidupan baru selalu mulai tumbuh... Siklus abad itu selalu tetap!"
items.wands.wandofregrowth$dewcatcher.name=Penangkap Embun
items.wands.wandofregrowth$dewcatcher.desc=Penangkap embun menyamarkan diri sebagai rumput untuk menghindari perhatian, tetapi benjolan embun yang dikumpulkannya membongkar penyamaran mereka.
items.wands.wandofregrowth$seedpod.name=Bulb Biji
items.wands.wandofregrowth$seedpod.desc=Bulb biji terlihat cantik, tetapi biji yang mereka bawa sebenarnya dicuri dari tanaman lain yang mereka bunuh dengan akarnya.

items.wands.wandoftransfusion.name=tongkat sihir transfusi
items.wands.wandoftransfusion.staff_name=tongkat staf transfusi
items.wands.wandoftransfusion.ondeath=Anda terbunuh oleh Tongkat sihir Transfusi milik Anda sendiri...
items.wands.wandoftransfusion.charged=Tongkat staf Anda terisi dengan energi kehidupan musuh Anda!
items.wands.wandoftransfusion.desc=Tongkat sihir berbentuk cukup polos, menonjol karena warnanya magenta dan permata hitam pekat di ujungnya.
items.wands.wandoftransfusion.stats_desc=Tongkat sihir ini akan mengambil sebagian energi kehidupan Anda dan menembakkannya ke target. Efek ini sangat serbaguna: sekutu akan disembuhkan, musuh akan terpesona untuk sementara, dan undead yang bermusuhan akan menerima kerusakan besar. Namun pengurasan kehidupan cukup berarti, menggunakan tongkat sihir ini akan memberi Anda kerusakan selain mengonsumsi muatan.

items.wands.wandofvenom.name=tongkat sihir racun
items.wands.wandofvenom.staff_name=tongkat staf racun
items.wands.wandofvenom.desc=Tongkat sihir ini memiliki badan ungu yang terbuka ke permata hijau cemerlang.
items.wands.wandofvenom.stats_desc=Tongkat sihir ini menembakkan bolt yang meledak menjadi awan gas berbisa menjijikkan di lokasi yang ditargetkan. Apa pun yang terjebak di dalam awan ini akan menerima kerusakan terus-menerus, yang meningkat seiring waktu.

###weapon curses
items.weapon.curses.annoying.name=%s yang menjengkelkan
items.weapon.curses.annoying.msg_1=OOH, APA KITA SEDANG BERTEMAN SESUATU!?
items.weapon.curses.annoying.msg_2=YA, KEJAR MEREKA!
items.weapon.curses.annoying.msg_3=HEI, DENGARKAN!
items.weapon.curses.annoying.msg_4=APA KITA SUDAH DI BOSS!?
items.weapon.curses.annoying.msg_5=ADUH, JANGAN AYUNKAN AKU SEKUAT ITU!
items.weapon.curses.annoying.desc=Senjata yang menjengkelkan mampu berbicara, tetapi mereka sedikit terlalu energik. Mereka sering menarik perhatian ke Anda tanpa bermaksud demikian.

items.weapon.curses.displacing.name=%s yang memindahkan
items.weapon.curses.displacing.desc=Senjata yang memindahkan diberi sihir teleportasi kacau, memiliki kemampuan untuk memindahkan musuh secara acak ke sekitar lantai.

items.weapon.curses.exhausting.name=%s yang melelahkan
items.weapon.curses.exhausting.desc=Senjata yang melelahkan membutuhkan usaha besar untuk digunakan, dan secara berkala akan melemahkan pemakainya sebagai akibatnya.

items.weapon.curses.fragile.name=%s yang rapuh
items.weapon.curses.fragile.desc=Senjata yang rapuh pada awalnya sama kuatnya dengan lawan normalnya, tetapi dengan cepat menurun efektivitasnya saat digunakan.

items.weapon.curses.sacrificial.name=%s yang pengorbanan
items.weapon.curses.sacrificial.desc=Senjata pengorbanan akan menuntut darah dari pemakainya sebagai ganti untuk menyerang musuh. Semakin sehat pemakainya, semakin banyak darah yang akan diambil kutukan.

items.weapon.curses.wayward.name=%s yang bandel
items.weapon.curses.wayward.desc=Senjata yang bandel sangat kesulitan menemukan sasarannya, membuatnya sangat tidak akurat kecuali serangan dijamin berhasil.

items.weapon.curses.arrogant.name=arrogant %s
items.weapon.curses.arrogant.desc=Senjata arrogant mengolok-olok serangan dari penggunanya, membuat penggunanya merasa tidak nyaman jika gagal melakukan serangan sempurna.

###enchantments
items.weapon.enchantments.blazing.name=blazing %s
items.weapon.enchantments.blazing.desc=Enchant ini menyebabkan lidah api memuntah dari senjata, membakar musuh dan medan tempa. Menambahkan FIRE ke kerusakan senjata.

items.weapon.enchantments.chilling.name=chilling %s
items.weapon.enchantments.chilling.desc=Musuh yang terkena enchant ini akan dingin, memperlambat gerakan dan serangan mereka. Menambahkan _ICE_ ke kerusakan senjata.

items.weapon.enchantments.dazzling.name=dazzling %s
items.weapon.enchantments.dazzling.desc=Enchant ini membuat musuh pusing saat terkena pukulan, membuat mereka buta untuk sementara waktu.

items.weapon.enchantments.eldritch.name=eldritch %s
items.weapon.enchantments.eldritch.desc=Senjata eldritch menanam ketakutan ke dalam musuh, menyebabkan mereka melarikan diri dari penyerang. Menambahkan _SHADOW_ ke kerusakan senjata.

items.weapon.enchantments.grim.name=grim %s
items.weapon.enchantments.grim.desc=Enchant kuat ini memiliki kekuatan untuk seketika mengeksekusi musuh. Efek ini lebih mungkin terjadi semakin lemah musuh tersebut.

items.weapon.enchantments.lucky.name=lucky %s
items.weapon.enchantments.lucky.desc=Dengan enchant ini senjata akan memberikan kerusakan maksimum atau minimum, tidak pernah di antaranya.

items.weapon.enchantments.projecting.name=projecting %s
items.weapon.enchantments.projecting.desc=Dengan enchant ini senjata jarak dekat akan mendapat jangkauan ekstra. Senjata jarak jauh akan mampu menembus dinding terdekat.

items.weapon.enchantments.shocking.name=shocking %s
items.weapon.enchantments.shocking.desc=Listrik memercik dari senjata shocking, memberikan kerusakan ekstra ke semua musuh terdekat. Menambahkan _LIGHTNING_ ke kerusakan senjata.

items.weapon.enchantments.stunning.name=stunning %s
items.weapon.enchantments.stunning.desc=Enchant kuat ini melumpuhkan musuh saat terkena pukulan, membuat mereka tidak berdaya terhadap serangan berikutnya.

items.weapon.enchantments.unstable.name=unstable %s
items.weapon.enchantments.unstable.desc=Enchant ini memancarkan energi kacau, bertindak sebagai enchant yang berbeda pada setiap pukulan.

items.weapon.enchantments.vampiric.name=vampiric %s
items.weapon.enchantments.vampiric.desc=Enchant kuat ini mengisap kekuatan hidup dari musuh pada setiap pukulan, menyalurkannya kembali ke penggunanya. Menambahkan _SHADOW_ ke kerusakan senjata.

items.weapon.enchantments.venomous.name=venomous %s
items.weapon.enchantments.venomous.desc=Senjata venomous menginfeksi musuh dengan racun mematikan, yang menjadi lebih parah pada setiap pukulan. Menambahkan _POISON_ ke kerusakan senjata.

items.weapon.enchantments.vorpal.name=vorpal %s
items.weapon.enchantments.vorpal.desc=Senjata vorpal sangat mematikan, menyebabkan musuh berdarah saat terkena pukulan.

items.weapon.enchantments.holy.name=holy %s
items.weapon.enchantments.holy.desc=Dikatakan bahwa enchant kuat ini berasal dari hadiah dewi. Hanya yang taat yang berkesempatan memperoleh kehormatan ini. Senjata holy dapat lebih efektif melawan mayat hidup dan iblis, dan pada saat yang sama memiliki peluang tertentu untuk memberikan pukulan kritis. Menambahkan _LIGHT_ ke kerusakan senjata.

items.weapon.enchantments.suppress.name=suppress %s
items.weapon.enchantments.suppress.desc=Senjata suppress dapat memberikan kerusakan ekstra berdasarkan kesehatan musuh yang hilang.

###melee weapons
items.weapon.melee.assassinsblade.name=assassin's blade
items.weapon.melee.assassinsblade.stats_desc=Senjata ini lebih kuat melawan musuh yang tidak sadar.
items.weapon.melee.assassinsblade.desc=Sebilah pisau kecil berlekuk yang terbuat dari obsidian, sulit digunakan meskipun ringan, tetapi mematikan jika menemukan sasaran yang tepat.

items.weapon.melee.battleaxe.name=battle axe
items.weapon.melee.battleaxe.stats_desc=Ini adalah senjata yang cukup akurat.
items.weapon.melee.battleaxe.desc=Kepala baja raksasa dari battle axe ini memberikan bobot yang cukup besar di balik setiap ayunan lebar.

items.weapon.melee.battlegloves.name=battle gloves
items.weapon.melee.battlegloves.stats_desc=Battle gloves dapat lebih cepat seiring naiknya level dan dapat memanfaatkan _ring of force_. Namun tidak dapat diperkuat dengan batu asah.
items.weapon.melee.battlegloves.desc=Sarung tangan kulit yang kokoh sangat ringan dan memberi Anda rasa aman.

items.weapon.melee.dagger.name=dagger
items.weapon.melee.dagger.stats_desc=Senjata ini lebih kuat melawan musuh yang tidak sadar.
items.weapon.melee.dagger.desc=Sebilah belati besi sederhana dengan gagang kayu yang usang.

items.weapon.melee.daggeraxe.name=dagger-axe
items.weapon.melee.daggeraxe.stats_desc=Ini adalah senjata yang cukup lambat.\nSenjata ini memiliki jangkauan ekstra dan peluang tertentu untuk mendorong musuh menjauh. Jauh lebih tidak akurat pada jarak dekat.
items.weapon.melee.daggeraxe.desc="Kekuatan militer hanya digunakan untuk menjaga perdamaian dan ketertiban". Senjata oriental kuno, desainnya mungkin sedikit usang.

items.weapon.melee.dirk.name=dirk
items.weapon.melee.dirk.stats_desc=Senjata ini lebih kuat melawan musuh yang tidak sadar.
items.weapon.melee.dirk.desc=Sebilah belati tusuk yang lebih panjang, memberikan lebih banyak baja untuk menikam musuh.

items.weapon.melee.flail.name=flail
items.weapon.melee.flail.stats_desc=Ini adalah senjata yang agak lambat.\nSenjata ini tidak dapat melakukan serangan kejutan.
items.weapon.melee.flail.desc=Bola berduri yang dilekatkan pada gagang dengan sepotong rantai. Sangat sulit digunakan, tetapi mematikan jika mendaratkan pukulan yang kokoh.

items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=Ini adalah senjata yang cukup lambat.\nSenjata ini memiliki jangkauan ekstra.
items.weapon.melee.glaive.desc=Sebuah senjata tiang besar yang terdiri dari bilah pedang pada ujung sebuah tongkat.

items.weapon.melee.greataxe.name=greataxe
items.weapon.melee.greataxe.stats_desc=Senjata ini sangat berat.
items.weapon.melee.greataxe.desc=Dibawa di atas bahu, kapak raksasa ini sekuat bobotnya.

items.weapon.melee.greatshield.name=greatshield
items.weapon.melee.greatshield.stats_desc=Senjata ini memblokir kerusakan dalam jumlah sangat besar, yang meningkat seiring peningkatan.
items.weapon.melee.greatshield.desc=Lebih seperti dinding bergerak daripada perisai, massa logam raksasa ini membantu pertahanan, tetapi tidak menyisakan banyak ruang untuk menyerang.

items.weapon.melee.claymore.name=claymore
items.weapon.melee.claymore.desc="Mukjizat diciptakan, bukan diminta."\n\nBilah menjulang ini memberikan kerusakan berat dengan memanfaatkan bobotnya pada setiap ayunan.

items.weapon.melee.handaxe.name=hand axe
items.weapon.melee.handaxe.stats_desc=Ini adalah senjata yang cukup akurat.
items.weapon.melee.handaxe.desc=Kapak ringan, paling sering digunakan untuk menebang pohon. Bilah yang lebar juga bekerja dengan baik melawan musuh.

items.weapon.melee.knuckles.name=knuckleduster
items.weapon.melee.knuckles.stats_desc=Ini adalah senjata yang sangat cepat.
items.weapon.melee.knuckles.desc=Sepotong besi yang dibentuk untuk meliliti ruas jari. Menjaga tangan tetap bebas, tetapi memungkinkan serangan yang lebih baik daripada tinji kosong.

items.weapon.melee.longsword.name=longsword
items.weapon.melee.longsword.desc=Bilah baja panjang yang sangat tajam dari pedang ini berkilau menenangkan, meskipun ukurannya membuatnya cukup berat.

items.weapon.melee.mace.name=mace
items.weapon.melee.mace.stats_desc=Ini adalah senjata yang cukup akurat.
items.weapon.melee.mace.desc=Kepala besi besar dari senjata ini memberikan kerusakan yang substansial.

items.weapon.melee.magesstaff.name=mage's staff
items.weapon.melee.magesstaff.ac_imbue=IMBUE
items.weapon.melee.magesstaff.ac_zap=ZAP
items.weapon.melee.magesstaff.prompt=Pilih tongkat sihir untuk dikonsumsi
items.weapon.melee.magesstaff.imbue=Anda menanamkan tongkat sihir Anda ke dalam %s.
items.weapon.melee.magesstaff.conflict=Magik yang bertentangan menghapus enchant pada tongkat sihir Anda.
items.weapon.melee.magesstaff.id_first=Anda perlu mengidentifikasi tongkat sihir ini terlebih dahulu.
items.weapon.melee.magesstaff.cursed=Anda tidak dapat menggunakan tongkat sihir yang dikutuk.
items.weapon.melee.magesstaff.warning=Apakah Anda yakin ingin menanamkan tongkat sihir Anda dengan tongkat sihir ini? Penanaman sebelumnya akan hilang.\n\nJika tongkat sihir yang ditanamkan tingkatnya sama atau lebih tinggi dari staf, staf akan mewarisi tingkat tongkat sihir tersebut ditambah satu peningkatan dari staf itu sendiri.\n\nPenanaman ini akan menghasilkan staf tingkat %d.
items.weapon.melee.magesstaff.yes=Ya, saya yakin.
items.weapon.melee.magesstaff.no=Tidak, saya berubah pikiran
items.weapon.melee.magesstaff.desc=Dibuat oleh mage sendiri, staf ini adalah senjata magis yang unik. Alih-alih memiliki kekuatan magis bawaan, staf ini ditanamkan dengan energi magis dari tongkat sihir.
items.weapon.melee.magesstaff.no_wand=Staf saat ini tidak memiliki magik di dalamnya, staf harus _ditanamkan dengan kekuatan tongkat sihir_ sebelum dapat digunakan untuk merapal mantra.
items.weapon.melee.magesstaff.has_wand=Staf saat ini ditanamkan dengan _%s._

items.weapon.melee.meleeweapon.stats_known=Senjata jarak dekat _tingkat-%1$d_ ini memberikan _kerusakan %2$d-%3$d_ dan membutuhkan _kekuatan %4$d_ untuk digunakan dengan benar.
items.weapon.melee.meleeweapon.stats_unknown=Senjata jarak dekat _tingkat-%1$d_ ini biasanya memberikan _kerusakan %2$d-%3$d_ dan membutuhkan _kekuatan %4$d_ untuk digunakan dengan benar.
items.weapon.melee.meleeweapon.probably_too_heavy=Mungkin senjata ini terlalu berat untuk Anda.
items.weapon.melee.meleeweapon.stats_desc=

items.weapon.melee.shortsword.name=shortsword
items.weapon.melee.shortsword.desc=Sebilah pedang yang cukup pendek, hanya beberapa inci lebih panjang dari belati.

items.weapon.melee.quarterstaff.name=quarterstaff
items.weapon.melee.quarterstaff.stats_desc=Senjata ini memblokir sebagian kerusakan.
items.weapon.melee.quarterstaff.desc=Sebuah tongkat kayu keras, ujungnya dilapisi besi.

items.weapon.melee.roundshield.name=round shield
items.weapon.melee.roundshield.stats_desc=Senjata ini memblokir sejumlah besar kerusakan, yang meningkat seiring peningkatan.
items.weapon.melee.roundshield.desc=Perisai besar ini secara efektif memblokir serangan dan menjadi senjata yang layak saat terdesak.

items.weapon.melee.runicblade.name=runic blade
items.weapon.melee.runicblade.stats_desc=Senjata ini lebih diuntungkan dari peningkatan.
items.weapon.melee.runicblade.desc=Sebuah senjata misterius dari negeri jauh, dengan bilah biru cerah.

items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Ini adalah senjata yang sangat cepat.\nSenjata ini memblokir sebagian kerusakan.
items.weapon.melee.sai.desc=Dua bilah tipis yang dimaksudkan untuk digenggam masing-masing di satu tangan. Sangat baik untuk menangkis dan potongan cepat.

items.weapon.melee.scimitar.name=scimitar
items.weapon.melee.scimitar.stats_desc=Ini adalah senjata yang cukup cepat.
items.weapon.melee.scimitar.desc=Sebilah bilah melengkung yang tebal. Bentuknya memungkinkan serangan yang lebih cepat, namun kurang kuat.

items.weapon.melee.shield.block=Dengan menggunakan perisai ini pertahanan dasar Anda meningkat sebesar _%d_ dan setiap blok sempurna dapat mengurangi _%d_ kerusakan.

items.weapon.melee.spear.name=spear
items.weapon.melee.spear.stats_desc=Ini adalah senjata yang cukup lambat.\nSenjata ini memiliki jangkauan ekstra.
items.weapon.melee.spear.desc=Sebuah batang kayu ramping yang berujung besi yang runcing.

items.weapon.melee.spikeshield.name=Spikeshield
items.weapon.melee.spikeshield.desc=Perisai raksasa ini dapat memblokir kerusakan dalam jumlah yang cukup besar. Lebih bersifat menyerang tetapi canggung digunakan karena duri di permukaannya.
items.weapon.melee.spikeshield.stats_desc=Senjata ini memblokir sejumlah besar kerusakan, yang meningkat seiring peningkatan. Setiap blok sempurna dapat _memantulkan_ kerusakan sebesar jumlah blok ke penyerang.\nIni adalah senjata yang cukup lambat.

items.weapon.melee.sword.name=sword
items.weapon.melee.sword.desc=Sebilah pedang yang seimbang dengan baik. Tidak terlalu besar, tetapi masih terasa lebih panjang dari shortsword. _Dua pedang dapat dipasangkan dan kemudian dipakai sekaligus._
items.weapon.melee.sword.ac_dual=DUAL
items.weapon.melee.sword.select_other=Pilih sebuah pedang
items.weapon.melee.sword.not_familiar=Anda hanya dapat memasangkannya dengan pedang lain yang telah diidentifikasi!
items.weapon.melee.sword.paired=Anda memasangkan dua pedang, sekarang Anda dapat memakainya secara bersamaan!

items.weapon.melee.warhammer.name=war hammer
items.weapon.melee.warhammer.stats_desc=Ini adalah senjata yang cukup akurat.
items.weapon.melee.warhammer.desc=Sedikit makhluk yang dapat menahan pukulan menghancurkan dari massa timah dan baja yang menjulang ini, tetapi dibutuhkan kekuatan besar untuk menggunakannya secara efektif.

items.weapon.melee.whip.name=whip
items.weapon.melee.whip.stats_desc=Senjata ini memiliki jangkauan yang sangat luas.
items.weapon.melee.whip.desc=Meskipun panjang tali berduri di ujung senjata ini memberikan kerusakan yang buruk, jangkauannya tidak tertandingi.

items.weapon.melee.crystalsswords.name=crystal sword
items.weapon.melee.crystalsswords.stats_desc=Senjata ini memiliki peluang untuk memberikan pukulan kritis saat menyerang.
items.weapon.melee.crystalsswords.desc=Pedang ini ditempa dengan kristal langka, memungkinkan Anda lebih mudah menemukan kelemahan fatal musuh.

items.weapon.melee.wornshortsword.name=worn shortsword
items.weapon.melee.wornshortsword.desc=Sebilah pedang yang cukup pendek, usang karena penggunaan berat. Lebih lemah dan sedikit lebih ringan daripada shortsword dalam kondisi yang lebih baik.

items.weapon.melee.pairswords.name=pair swords
items.weapon.melee.pairswords.desc=Kombinasi dua pedang jauh lebih kuat.\n\n_Pair swords dapat menyimpan enchant ganda. Dua pedang yang seimbang dapat mengerahkan kekuatannya secara maksimal._
items.weapon.melee.pairswords.ac_split=SPLIT
items.weapon.melee.pairswords.splited=Anda memisahkan pair swords.

###missile weapons
items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.boomerang.desc=Dilempar ke musuh, peluru kayu melengkung datar ini akan kembali ke tangan pelemparnya.
items.weapon.missiles.boomerang.enhanced_desc=Boomerang yang ditingkatkan memiliki kemampuan untuk _dilemparkan sekali lagi_.

items.weapon.missiles.curaredart.name=curare dart
items.weapon.missiles.curaredart.desc=Anak panah jahat kecil ini tidak banyak memberikan kerusakan tetapi dapat melumpuhkan target sehingga tidak berdaya dan tidak bergerak untuk beberapa waktu.

items.weapon.missiles.dart.name=dart
items.weapon.missiles.dart.desc=Paku logam sederhana ini diberi pemberat agar terbang lurus dan menyengat mangsanya dengan sekali pergelangan tangan.

items.weapon.missiles.flycutter.name=flycutter
items.weapon.missiles.flycutter.desc=Pisau ringan ini bahkan menghilangkan gagangnya, menyeimbangkan bobot agar dapat menembus sasaran secara akurat.

items.weapon.missiles.incendiarydart.name=incendiary dart
items.weapon.missiles.incendiarydart.desc=Paku pada setiap anak panah ini dirancang untuk menyematkannya ke target sementara senyawa tidak stabil yang diikat di sepanjangnya meledak menjadi lidah api yang menyilaukan.

items.weapon.missiles.javelin.name=javelin
items.weapon.missiles.javelin.desc=Sepotong logam ini diberi pemberat agar pakunya tetap di ujung terdepan saat melayang di udara.

items.weapon.missiles.missileweapon.stats=Senjata peluru _tingkat-%d_ ini memberikan _kerusakan %d- %d_ dan memiliki _peluang %s%%_ untuk rusak pada setiap penggunaan.
items.weapon.missiles.missileweapon.excess_str=Karena kekuatan berlebih Anda, Anda akan memberikan paling banyak _kerusakan bonus %d_.
items.weapon.missiles.missileweapon.distance=Senjata ini dirancang untuk digunakan dari jarak jauh, jauh lebih tidak akurat pada jarak dekat.\nKarena perbedaan antara serangan jarak jauh dan jarak dekat, menembak pada jarak dekat akan membuat Anda _tidak seimbang_ sebentar.

items.weapon.missiles.seventhdart.name=Darts No. 7
items.weapon.missiles.seventhdart.desc=Juga dikenal sebagai "head axe", bilah yang tajam dan berat dapat secara efektif melukai musuh.

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.desc=Potongan logam berbentuk bintang dengan bilah yang sangat tajam memberikan kerusakan signifikan saat mengenai sasaran. Dapat dilempar dengan kecepatan sangat tinggi.

items.weapon.missiles.smokesparks.name=smokesparks
items.weapon.missiles.smokesparks.desc=Ledakan yang disebabkan oleh debu penyebab iritasi dengan sejumlah kecil kristal magis dapat membutakan lawan Anda untuk sementara waktu alih-alih memberikan kerusakan. Meskipun trik hina ini biasanya dipandang rendah, trik ini selalu efektif dalam pertempuran jarak jauh.

items.weapon.missiles.swallowdart.name=swallow-tailed darts
items.weapon.missiles.swallowdart.desc=Tidak pernah meleset pada burung atau binatang apa pun dalam jarak seratus langkah.\n\nSenjata ini memiliki ketepatan ekstra.

items.weapon.missiles.tamahawk.name=tomahawk
items.weapon.missiles.tamahawk.desc=Kapak lempar ini tidak terlalu berat, tetapi masih membutuhkan kekuatan signifikan untuk digunakan secara efektif.

items.weapon.weapon.identify=Anda sekarang cukup familiar dengan senjata Anda untuk mengidentifikasinya.
items.weapon.weapon.too_heavy=Karena kekuatan Anda yang tidak memadai, senjata ini akan menghambat kecepatan serangan, akurasi, dan kemampuan serangan kejutan Anda.
items.weapon.weapon.excess_str=Karena kekuatan berlebih Anda, Anda akan memberikan paling banyak _kerusakan bonus %d_ dengan senjata ini.
items.weapon.weapon.incompatible=Interaksi berbagai jenis magik telah menetralkan enchant pada senjata ini!
items.weapon.weapon.cursed_worn=Karena senjata ini dikutuk, Anda tidak berdaya untuk melepasnya.
items.weapon.weapon.cursed=Anda dapat merasakan magik jahat yang bersembunyi di dalam senjata ini.
items.weapon.weapon.lighter=Senjata ini diseimbangkan menjadi _lebih ringan._
items.weapon.weapon.heavier=Senjata ini diseimbangkan menjadi _lebih berat._
items.weapon.weapon.enchanted=Senjata ini memiliki _%s._
items.weapon.weapon$enchantment.enchant=enchant

## unclassified
items.unclassified.amulet.name=amulet of yendor
items.unclassified.amulet.ac_end=END THE GAME
items.unclassified.amulet.rankings_desc=Memperoleh Amulet of Yendor
items.unclassified.amulet.desc=Amulet of Yendor adalah artifak paling kuat yang diketahui dengan asal-usul yang tidak diketahui. Dikatakan bahwa amulet ini dapat memenuhi keinginan apa pun jika kemauan pemiliknya cukup kuat untuk "meyakinkannya" melakukannya.

items.unclassified.ankh.name=ankh
items.unclassified.ankh.ac_bless=BLESS
items.unclassified.ankh.bless=Anda memberkati ankh dengan air bersih.
items.unclassified.ankh.desc=Simbol kuno keabadian ini memberikan kemampuan untuk kembali hidup setelah mati. Saat kebangkitan, semua barang yang tidak dipakai akan hilang. Menggunakan vial embun penuh, ankh dapat diberkati dengan kekuatan ekstra.
items.unclassified.ankh.desc_blessed=Simbol kuno keabadian ini memberikan kemampuan untuk kembali hidup setelah mati. Ankh telah diberkati dan sekarang jauh lebih kuat. Ankh akan mengorbankan dirinya untuk menyelamatkan Anda saat berada dalam bahaya mematikan.

items.unclassified.armorkit.name=armor kit
items.unclassified.armorkit.ac_apply=APPLY
items.unclassified.armorkit.prompt=Pilih sebuah baju zirah
items.unclassified.armorkit.upgraded=Anda menerapkan armor kit untuk meningkatkan %s Anda
items.unclassified.armorkit.desc=Dengan kit alat dan bahan kecil ini siapa pun dapat mengubah baju zirah apa pun menjadi "epic armor", yang akan mempertahankan semua properti baju zirah asli, tetapi juga akan memberikan penggunanya kemampuan khusus tergantung pada kelasnya. Tidak diperlukan keterampilan dalam menjahit, menyamak kulit, atau menempa besi.

items.unclassified.bomb.name=bomb
items.unclassified.bomb.ac_lightthrow=LIGHT & THROW
items.unclassified.bomb.snuff_fuse=Anda dengan cepat memadamkan sumbu bom.
items.unclassified.bomb.ondeath=Dibunuh oleh ledakan
items.unclassified.bomb.rankings_desc=Dibunuh oleh ledakan
items.unclassified.bomb.desc=Sebuah bom bubuk hitam yang cukup besar. Ledakan dari bom ini pasti akan merusak apa pun di sekitarnya.\n\nSepertinya sumbunya akan membutuhkan beberapa ronde untuk terbakar habis setelah dinyalakan.
items.unclassified.bomb.desc_burning=Sebuah bom bubuk hitam yang cukup besar. Ledakan dari bom ini pasti akan merusak apa pun di sekitarnya.\n\nSumbu bom sedang terbakar, jauhi atau padamkan!
items.unclassified.bomb$doublebomb.name=two bombs
items.unclassified.bomb$doublebomb.desc=Tumpukan dua bom bubuk hitam yang besar, sepertinya Anda mendapat satu gratis!

items.unclassified.brokenseal.name=broken seal
items.unclassified.brokenseal.ac_affix=AFFIX
items.unclassified.brokenseal.prompt=Pilih sebuah baju zirah
items.unclassified.brokenseal.unknown_armor=Anda harus mengidentifikasi baju zirah itu terlebih dahulu.
items.unclassified.brokenseal.degraded_armor=Kondisi baju zirah ini terlalu buruk.
items.unclassified.brokenseal.affix=Anda menempelkan segel ke baju zirah Anda!
items.unclassified.brokenseal.desc=Segel lilin, ditempelkan pada baju zirah sebagai simbol keberanian. Semua tanda pada segel telah pudar karena usia dan segelnya patah dua di tengah.\n\nSebuah kenang-kenangan dari rumahnya, segel ini membantu warrior bertahan. Saat memakai segel, warrior akan secara perlahan menghasilkan pelindung di atas kesehatannya berdasarkan kualitas baju zirahnya.\n\nSegel dapat _ditempelkan ke baju zirah,_ dan dipindahkan antar baju zirah. Segel ini dapat membawa satu peningkatan bersamanya.
items.unclassified.brokenseal.enchant_desc=Segel yang ditingkatkan telah diperbarui dan melindungi Anda lebih efektif.

items.unclassified.demonicskull.name=Demonic Skull
items.unclassified.demonicskull.desc=Sebuah tengkorak berbentuk domba yang aneh dengan kejahatan yang tak tertahankan keluar darinya.\n\nAnda samar-samar dapat merasakan haus darahnya seolah-olah ia hidup. Jika Anda bisa menemukan beberapa...
items.unclassified.demonicskull.ac_smear=SMEAR

items.unclassified.dewdrop.name=Dew
items.unclassified.dewdrop.value=%+dHP
items.unclassified.dewdrop.already_full=Kesehatan Anda penuh.
items.unclassified.dewdrop.desc=Setetes embun yang jernih bagai kristal.\n\nBerkat magik tempat ini, air murni memiliki sifat pemulihan kecil.

items.unclassified.dewvial.name=Dew Vial
items.unclassified.dewvial.ac_consume=APPLY RUNES
items.unclassified.dewvial.ac_drink=DRINK
items.unclassified.dewvial.ac_sip=SIP
items.unclassified.dewvial.ac_wash=WASH
items.unclassified.dewvial.value=%+dHP
items.unclassified.dewvial.collected=Anda mengumpulkan _%d_ tetes embun ke dalam vial embun Anda.
items.unclassified.dewvial.collect-rune=Anda mengumpulkan _%s_ ke dalam vial embun Anda.
items.unclassified.dewvial.full=Vial embun Anda penuh!
items.unclassified.dewvial.empty=Vial embun Anda kosong!
items.unclassified.dewvial.desc=Anda dapat menyimpan embun berlebih di dalam wadah kecil ini dan meminumnya nanti. Semakin penuh vialnya, semakin banyak Anda akan langsung disembuhkan saat meminumnya. Anda hanya akan meminum sebanyak yang Anda butuhkan.\n\nVial seperti ini dulunya ditanamkan dengan magik kebangkitan, tetapi kekuatan itu telah pudar. Tampaknya masih ada sedikit kekuatan tersisa, mungkin vial penuh dapat memberkati item kebangkitan lain.
items.unclassified.dewvial.desc-rune=_Ada %s di dalam vial embun Anda_.
items.unclassified.dewvial.has-rune=Anda perlu mengonsumsi rune di dalam vial sebelum minum.
items.unclassified.dewvial.use-rune=Anda mengonsumsi _%s_.

items.unclassified.extractionflask.name=Extraction Flask
items.unclassified.extractionflask.ac_refine=REFINE
items.unclassified.extractionflask.ac_strengthen=STRENGTHEN
items.unclassified.extractionflask.ac_purify=PURIFY
items.unclassified.extractionflask.ac_take_water=ambil air
items.unclassified.extractionflask.desc=Labu ekstraksi ini telah lama digunakan dalam penelitian racun. Labu ini sederhana dan portabel, tampaknya komponen utamanya hanyalah corong pemisah. Anda telah memurnikan _%d_ kali.
items.unclassified.extractionflask.desc_hint=_Labu ekstraksi ini cenderung menghasilkan racun dan dapat memengaruhi alat campuran pengguna. Bagaimanapun, pemurnian membutuhkan kelembapan_.
items.unclassified.extractionflask.desc_cursed=Labu ekstraksi yang dikutuk melengkungkan dirinya erat ke tas Anda.
items.unclassified.extractionflask.enhanced_desc=Tak diragukan lagi labu ekstraksi yang ditingkatkan tidak lagi terlihat seperti labu. Anda bahkan dapat menggunakan limbah dari dungeon!
items.unclassified.extractionflask.purify_desc=_Botol ekstraksi terisi penuh dengan air dan kamu tidak dapat menggunakan fungsi lain selama waktu itu_.
items.unclassified.extractionflask$companion$wndcraft.prompt=Pilih bahanmu
items.unclassified.extractionflask$companion$wndcraft.done=SENYAWAKAN
items.unclassified.extractionflask$companion$wndcraft.select_seed=Pilih sebuah biji
items.unclassified.extractionflask$companion$wndcraft.select_potion=Pilih ramuan yang ingin kamu perkuat
items.unclassified.extractionflask.refine_failed=Pemurnian gagal dan semua bahannya terbuang.
items.unclassified.extractionflask.refine=Kamu memurnikan _%s_.
items.unclassified.extractionflask.no_water=Kamu tidak punya cukup embun! (setidaknya diperlukan %d embun)
items.unclassified.extractionflask.inscribed=Senjatamu telah mengalami beberapa perubahan dalam proses pemurnian.
items.unclassified.extractionflask.cannot_inscribe=Kamu memerlukan kekuatan yang cukup agar pemurnian ini memengaruhi senjata.
items.unclassified.extractionflask.strengthen=Kamu mengonsumsi _%s_ dan memperkuat _%s_.
items.unclassified.extractionflask.not_identified=Aku harus tahu dengan apa aku bekerja!
items.unclassified.extractionflask.cannot_reinforce=Ramuan ini? Mengapa kamu memilih untuk memperkuat ramuan ini?
items.unclassified.extractionflask.reinforced=Ramuan ini telah diperkuat.
items.unclassified.extractionflask.upgrade=Pengetahuanmu tentang botol ekstraksi memungkinkanmu mengeksplorasi kinerjanya lebih jauh.
items.unclassified.extractionflask.no_water_here=Tidak ada air di sekitar sini!
items.unclassified.extractionflask.start_purify=Kamu mengumpulkan air kotor ke dalam botol ekstraksi.
items.unclassified.extractionflask.water_purified=Air di dalam botol ekstraksi telah dimurnikan!
items.unclassified.extractionflask.no-vial=Kamu memerlukan vial embun untuk menampung air.

items.unclassified.gold.name=Emas
items.unclassified.gold.desc=Tumpukan koin emas. Kumpulkan koin emas untuk dibelanjakan nanti di toko.

items.unclassified.greatblueprint.name=blueprint agung
items.unclassified.greatblueprint.desc=Sebuah blueprint yang sangat langka, yang oleh para dwarf disebut ciptaan agung yang memadukan sains dan sihir, juga dikabarkan diperdagangkan dengan kekuatan yang tak diketahui.\n\nBlueprint agung dapat digunakan untuk memperkuat barang tertentu, namun ada juga harganya.
items.unclassified.greatblueprint.ac_use=gunakan
items.unclassified.greatblueprint.enhanced=Kamu menyempurnakan %s dengan blueprint agung.
items.unclassified.greatblueprint.prompt=Pilih barang untuk disempurnakan

items.unclassified.honeypot.name=Pot Madu
items.unclassified.honeypot.ac_shatter=PECAHKAN
items.unclassified.honeypot.desc=Pot madu besar ini sebenarnya hanya dilapisi madu, sebaliknya ia menampung seekor lebah raksasa! Lebih-lebih semacam ini biasanya tinggal di sarangnya, mungkin pot ini semacam sangkar penjebak khusus? Lebah itu tampak cukup puas di dalam pot dengan madunya, dan mendengung waspada kepadamu saat kamu melihatnya.
items.unclassified.honeypot$shatteredpot.name=Pot Madu Pecah
items.unclassified.honeypot$shatteredpot.desc=Pot telah pecah, hanya madu lengket yang melapisi dindingnya yang menahannya bersama, dan perlahan-lahan terpisah.\n\nMeskipun dalam keadaan rusak, lebah itu tampaknya masih ingin melindungi pot tersebut.

items.unclassified.moonstone.name=Batu Bulan
items.unclassified.moonstone.desc=Sebuah safir bening berbentuk sabit berkilauan dalam kegelapan.\n\n_Batu Bulan memiliki sihir untuk mengatur latar belakang menjadi malam selama suatu periode waktu._
items.unclassified.moonstone.ac_use=GUNAKAN
items.unclassified.moonstone.used=Cahaya meredup dalam sekejap mata.

items.unclassified.potiontestpaper.name=Kertas Uji Ramuan
items.unclassified.potiontestpaper.desc=Kertas uji ramuan yang sangat umum digunakan, meskipun mustahil membedakan semua ramuan melalui reaksi kertas uji, ini adalah bahan yang diperlukan bagi peneliti farmasi untuk mendeteksi apakah obat beracun atau tidak.
items.unclassified.potiontestpaper.ac_test=UJI
items.unclassified.potiontestpaper.prompt=Pilih satu ramuan untuk diuji
items.unclassified.potiontestpaper.tip=Tidak perlu menguji ramuan yang sudah teridentifikasi.
items.unclassified.potiontestpaper.test_succeed=Kamu membasahi kertas uji dan langsung berubah merah, menandakan %s berbahaya.
