windows.wndstory.sewers=Dungeon berada tepat di bawah Kota, lantai atasnya sebenarnya merupakan sistem saluran pembuangan Kota.\n\nSaat energi gelap merembes dari bawah, makhluk pembuangan yang biasanya tidak berbahaya menjadi semakin berbahaya. Kota mengirim patroli penjaga ke sini untuk menjaga keamanan, tapi mereka perlahan kewalahan.\n\nTempat ini berbahaya, tapi setidaknya sihir jahat di sini lemah.
windows.wndstory.prison=Bertahun-tahun lalu sebuah penjara dibangun di sini untuk menampung penjahat berbahaya. Diatur ketat dan aman, narapidana dari seluruh penjuru dibawa ke sini untuk menjalani hukuman.\n\nTapi segera kabut gelap mulai merembes dari bawah, memelintir pikiran penjaga dan tahanan.\n\nSebagai tanggapan atas kekacauan yang meningkat, kota menutup seluruh penjara. Tidak ada yang tahu nasib mereka yang ditinggalkan mati di balik tembok ini...
windows.wndstory.caves=Gua-gua, yang membentang di bawah penjara terbengkalai, berpenduduk jarang. Terlalu dalam untuk dieksploitasi Kota dan terlalu miskin mineral untuk menarik para kurcaci. Dulu ada pos perdagangan di rute antara dua negara, tapi telah musnah sejak kemunduran Metropolis Kurcaci. Hanya gnoll yang ada di mana-mana dan hewan bawah tanah yang tinggal di sini sekarang.
windows.wndstory.city=Metropolis Kurcaci pernah menjadi negara-kota kurcaci terbesar. Pada masa kejayaannya, pasukan mekanis kurcaci telah berhasil menangkal invasi dewa tua dan pasukan iblisnya. Tapi dikatakan, para prajurit yang kembali membawa benih korupsi, dan kemenangan itu adalah awal dari akhir kerajaan bawah tanah.
windows.wndstory.halls=Dulu lantai ini merupakan pinggiran Metropolis. Setelah kemenangan yang mahal dalam perang melawan dewa tua, kurcaci terlalu lemah untuk membersihkannya dari iblis tersisa. Secara bertahap iblis memperkuat cengkeraman dan kini disebut Aula Iblis.\n\nSangat sedikit petualang yang pernah turun sejauh ini...

