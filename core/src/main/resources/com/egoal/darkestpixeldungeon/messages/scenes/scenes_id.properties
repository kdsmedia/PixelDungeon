### dpd
scenes.guidescene.title=Panduan
scenes.guidescene.select_prompt=pilih untuk menampilkan
scenes.guidescene.pages=12
scenes.guidescene.title_0=Pengantar
scenes.guidescene.body_0=Salam Petualang!\n\nKau sedang membaca Panduan Petualang Dungeon yang luar biasa! Buku panduan ini penuh dengan tips dan trik untuk membantu petualang pemula bertahan dan berkembang!\n\nMeskipun kau dapat membaca panduan ini sekaligus, sebaiknya gunakan sebagai referensi. Pastikan untuk mengeceknya saat kau kesulitan.\n\nTetap waspada, dan ingat:\nJANGAN PANIK!
scenes.guidescene.title_1=Mengidentifikasi Item
scenes.guidescene.body_1=Mengidentifikasi item bisa sama pentingnya dengan menemukannya!\n\nWarna ramuan dan glyph gulungan berbeda di setiap dungeon, jadi kau tidak akan tahu efeknya jika belum teridentifikasi.\n\nPerlengkapan yang belum teridentifikasi mungkin telah ditingkatkan jika kau beruntung, atau mungkin dikutuk! Memakai item terkutuh secara tidak sengaja itu buruk, tapi biasanya bukan akhir instan.\n\nGulungan identifikasi, peningkatan, atau penghilang kutukan sangat berguna untuk mengurangi risiko item yang belum teridentifikasi.\n\n(Kau dapat menemukan daftar semua item yang telah teridentifikasi di tab item pada jurnalmu)
scenes.guidescene.title_2=Memeriksa dan Mencari
scenes.guidescene.body_2=Terjun maju tanpa berpikir adalah cara bagus untuk terbunuh.\n\nSelalu ada waktu untuk melambat dan memeriksa sekitarmu, yang dapat membantumu menemukan cara terbaik menghadapi situasi. Menyerbu musuh hampir tidak pernah menjadi cara terbaik menghadapi mereka.\n\nDungeon penuh dengan lorong rahasia dan jebakan yang tak terlihat pada pandangan pertama. Ada baiknya mau mencari area secara menyeluruh jika kau menduga ada sesuatu yang tersembunyi.\n\n(Tombol kaca pembesar digunakan untuk memeriksa dan mencari. Ketuk sekali lalu ketuk sesuatu untuk diperiksa, ketuk dua kali untuk mencari area di sekitarmu)
scenes.guidescene.title_3=Kekuatan dan Peningkatan
scenes.guidescene.body_3=Tidak ada waktu untuk berlatih dengan senjata dan baju zirah yang kau temukan di dungeon, jadi kau butuh kekuatan fisik untuk menggunakannya secara efektif.\n\nRamuan Kekuatan langsung meningkatkan kekuatan fisikmu dan merupakan cara paling efektif untuk memenuhi syarat perlengkapan tier lebih tinggi.\n\nGulungan Peningkatan terutama untuk membuat perlengkapan lebih kuat, tapi juga mengurangi beban. Namun setiap peningkatan akan kurang efektif dalam mengurangi beban dibanding sebelumnya.\n\nPenting untuk menuju item tier lebih tinggi yang lebih berat, tapi jangan abaikan perlengkapan yang bisa langsung kau pakai.
scenes.guidescene.title_4=Mengatasi Kelaparan
scenes.guidescene.body_4=Cara paling dasar untuk bertahan hidup di dungeon adalah makan dengan wajar.\n\nKelaparan pada akhirnya memengaruhi kesehatanmu: biasanya kesehatan pulih perlahan, sementara kesehatan akan menyusut saat kau kelaparan. Meskipun kehilangan kesehatan karena kelaparan itu buruk, petualanganmu tidak akan berakhir selama kau masih hidup.\n\nDi DPD, saat kau mulai kehilangan kesehatan karena kelaparan, juga dapat menimbulkan kerusakan pada mental karakter. Oleh karena itu, kau harus menguasai cara menyeimbangkan kelaparan, kesehatan dan tekanan. Misalnya, saat kau punya lebih banyak cara untuk mengurangi tekanan dan memulihkan kesehatan, menahan kelaparan sementara juga merupakan pilihan bagus.\n\nMengetahui cara mengalokasikan sumber daya sesuai keadaan adalah keterampilan penting untuk bertahan.
scenes.guidescene.title_5=Mendapatkan Pengalaman
scenes.guidescene.body_5=Saat kau mengalahkan musuh, level pengalamanmu akan meningkat. Pengalamanmu menentukan seberapa akurat seranganmu, seberapa mudah kau menghindar, dan berapa kesehatan yang kau miliki.\n\nLevel pengalamanmu membuat perbedaan besar dalam pertempuran. Sebaiknya punya setidaknya satu level untuk setiap lantai dungeon.\n\nMungkin tergoda untuk terburu-buru melewati dungeon, menghindari eksplorasi dan pertempuran, tapi begitu kau akan kehilangan pasokan dan pengalaman.\n\n(Kau dapat melihat informasi tentang pahlawanmu, termasuk exp, di panel status bagian atas antarmuka permainan. Ketuk potret pahlawanmu untuk info lebih lanjut)
scenes.guidescene.title_6=Serangan Kejutan
scenes.guidescene.body_6=Salah satu cara terbaik untuk unggul dalam pertempuran adalah dengan serangan kejutan.\n\nSerangan kejutan terjadi saat kau menyerang musuh saat berada di luar pandangan mereka, atau tepat saat kau muncul. Bahkan musuh paling lincah pun tidak bisa menghindari serangan kejutan!\n\nSalah satu bagian lingkungan yang paling umum digunakan untuk mengejutkan musuh adalah pintu. Musuh akan rentan terhadap serangan kejutan tepat saat mereka melewati pintu tertutup.\n\n(Saat kau berhasil melakukan serangan kejutan, tanda seru kuning akan sebentar muncul di atas musuh yang baru kau pukul)
scenes.guidescene.title_7=Menghadapi Kekalahan
scenes.guidescene.body_7=Jika situasi terlihat buruk, tidak ada salahnya melarikan diri. Melarikan diri ke bagian dungeon lain dapat memberi waktu untuk pulih sebelum mencoba lagi.\n\nSayangnya, menjelajah dungeon adalah profesi yang sangat berbahaya dan sebagian besar petualang pada akhirnya akan menemui ajalnya. Meskipun keberuntungan pasti berperan, petualang terbaik adalah mereka yang menggunakan setiap trik kecil untuk meningkatkan peluang.\n\n(Jangan patah semangat jika kau sering mati. Kau tidak boleh berharap terlalu jauh dalam beberapa percobaan pertama, permainan ini sulit! Fokuslah belajar permainan dan terus berkembang, jangan fokus menang langsung.)
scenes.guidescene.title_8=Penjarahan Efektif
scenes.guidescene.body_8=Kamar tertentu sering berisi loot lebih baik daripada yang lain. Beberapa kamar ini berada di balik pintu terkunci, atau berisi rintangan yang harus dilewati.\n\nSaat rintangan seperti ini menghalangi kemajuanmu, cari solusi di dekatnya. Baik kunci atau sesuatu yang lebih licik, biasanya ada alat yang bisa kau gunakan di lantai yang sama.\n\nRamuan kekuatan dan gulungan peningkatan adalah ukuran yang sangat baik seberapa baik kau menjelajah dan menjarah. Kau dapat menemukan 3 gulungan peningkatan dan 2 ramuan kekuatan per wilayah dungeon.\n\n(Kau dapat melihat daftar landmark penting dan kunci yang belum dipakai di tab catatan pada jendela jurnal.)
scenes.guidescene.title_9=Mengelola tekanan
scenes.guidescene.body_9=Ekspedisi akan memengaruhi psikologimu, dan stres akan perlahan menumpuk dalam petualangan.\n\nDibandingkan kelaparan, stres memiliki pengaruh yang lebih sering pada petualanganmu. Jangan khawatir, efek ini tidak selalu negatif.\n\nPsikologimu akan memengaruhi perilakumu. Sebaliknya, perilakumu juga akan memengaruhi psikologimu. Serangan presisi, kemenangan sulit, dll. akan membuatmu lebih percaya diri dan meredakan stres. Hal seperti diserang secara kejutan akan berdampak sebaliknya.\n\nStres yang terakumulasi perlahan pada akhirnya akan memengaruhi kesehatanmu. Perhatikan bahwa tidak seperti kelaparan, kehilangan kesehatan akan meningkat dengan cepat. Begitu kau mulai kehilangan kesehatan karena stres berlebih, pastikan segera mencari cara untuk menghilangkannya.
scenes.guidescene.title_10=Manfaatkan cahaya sebaik-baiknya
scenes.guidescene.body_10=Tak diragukan lagi dungeon itu gelap, musuh yang mengintai dalam gelap mematikan, dan yang lebih buruk kadang pandanganmu lebih terbatas.\n\nUntungnya, selain sedikit sumber cahaya di dungeon, kau selalu dapat menemukan obor di dungeon. Menguasai cara mendistribusikan sumber daya vital ini adalah strategi kemenangan dalam menjelajah dungeon.\n\nPerhatikan bahwa semakin dalam kau pergi, kuota obor akan secara bertahap BERKURANG.
scenes.guidescene.title_11=Memahami kerusakan
scenes.guidescene.body_11=Ketahanan dan penyelesaian kerusakan di DPD sedikit berbeda. Mengetahui beberapa mekanisme akan sangat menguntungkan petualanganmu.\n\nKerusakan dibagi menjadi tiga jenis: normal, magis, dan mental. Serangan normal adalah jenis serangan paling umum; serangan magis dapat menembus pertahanan secara langsung dan sangat sulit dihindari; serangan mental juga mengabaikan pertahanan dan biasanya meningkatkan tekananmu;\n\nBeberapa kerusakan memiliki elemen: api, racun, es, petir, bayangan, dan cahaya. Bagi petualang, enchantment senjata adalah cara paling umum memberikan kerusakan elemen. Makhluk berbeda memiliki resistensi elemen berbeda. Perhatikan bahwa resistensi elemen dan resistensi magis diselesaikan secara terpisah.\n\nAkhirnya, kerusakan dapat dikaitkan dengan: presisi, kritis, dll.\n\n(Mekanisme tempur: penentuan hindar -> pertahanan zirah -> koreksi penyerang -> koreksi pembela -> penyelesaian resistensi -> penentuan jenis -> penyelesaian akhir.)

