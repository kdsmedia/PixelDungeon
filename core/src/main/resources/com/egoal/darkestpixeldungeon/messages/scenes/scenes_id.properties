scenes.welcomescene.welcome_msg=Darkest Pixel Dungeon adalah RPG roguelike, dengan musuh, lantai, item, dan jebakan yang dibuat acak!\n\nSetiap permainan adalah pengalaman menantang baru, tapi berhati-hatilah, kematian bersifat permanen!\n\nSelamat menjelajah dungeon!
scenes.welcomescene.update_intro=Darkest Pixel Dungeon telah diperbarui!

scenes.welcomescene.suggest_msg=Sangat disarankan untuk membaca daftar pembaruan

scenes.welcomescene.what_msg=Tampaknya simpananmu saat ini berasal dari versi Darkest Pixel Dungeon yang lebih baru!\n\nHati-hati! Simpananmu mungkin berisi hal-hal yang tidak ada di versi ini, hal ini dapat menyebabkan error yang sangat aneh.
scenes.welcomescene.lang_warning_title=Terjemahan Belum Lengkap
scenes.welcomescene.lang_warning_msg=Beberapa konten baru dari pembaruan ini belum diterjemahkan.\n\nBeberapa frasa mungkin masih dalam bahasa Inggris.\n\nTim penerjemah sedang berusaha menyelesaikannya dan terjemahan lengkap akan segera hadir.\n\nTerima kasih atas kesabarannya.
