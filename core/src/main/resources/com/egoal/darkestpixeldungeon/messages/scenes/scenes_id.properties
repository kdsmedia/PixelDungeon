scenes.introscene.text=Banyak pahlawan telah menjelajah dungeon sebelummu dari kota di atas. Beberapa kembali dengan harta dan artefak magis, sebagian besar tidak pernah terdengar lagi.\n\nNamun tidak ada yang sampai ke dasar dan mengambil Jimat Yendor, yang dikatakan dijaga oleh kejahatan kuno di kedalaman. Bahkan kini energi gelap memancar dari bawah, merembes naik ke kota.\n\nKau merasa siap untuk tantangan ini. Yang paling penting, kau merasa keberuntungan menyertaimu. Saatnya memulai petualanganmu sendiri!

