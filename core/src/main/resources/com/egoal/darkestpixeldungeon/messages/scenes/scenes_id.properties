scenes.changesscene.info0.3.1=[190405]更多的房间类型；大量新的物品与平衡性改动；\n\n【更新】：\n-新增法杖房，献祭房与全新物品神符；\n-头饰数量增加到8种；\n-增加剑柄等4种新的遗物；均为常规掉落，圣杯重做，并被心脏替换；\n-地牢时钟；现在视野由时钟状态直接影响；\n【调整】：\n-现在血量回复速度为实时结算且具有成长性，初始为0.1；女猎的夜视PERK仅在夜间生效；女巫重新持有萃取瓶；\n-无味果食量削弱，对应强化药剂；适当克扣了生存资源；\n-治疗之泉灌水会给予神符，不洁之血现在可以灌瓶；索敌对对剑同样有效；\n-幽灵重做，魔典现在总是具有3个目录，时光沙漏重做；\n-改进地形生成算法，固定了洞穴层地形；\n-AI改进，怪物生成等其他平衡；\n【其他】：\n-贴图改动，添加人物头像；\n-交互改进，修正一些问题；其他；
scenes.changesscene.info0.3.1a=[190408]修复与微调；\n\n【修复】：\n-修正了DM300有时候生成不正常和卡关的问题；\n-对旧的通关存档进行了放弃；\n修正了一个产生重复遗物的问题；\n\n【其他】：\n-对部分挑战项目进行了兼容（暂未兼容的挑战以灰色显示）\n-传送敌人将打断其对你的追捕行为；\n-贴图更新；
scenes.changesscene.info0.3.2=[190701]独立头饰槽，远程武器大修，新任务:\n\n【更新】：\n-独立的头饰槽位；新的两种头饰和武器戈；\n-远程武器现在不再需要力量需求，伤害受当前力量加成，新的三种投掷武器；\n-完善的光照，现在具有独立的光照图，意味着你的火把同样为敌人提供照亮；\n-新任务被困的冒险者加入到地牢事件，相关的新物品角色等；\n【调整】：\n-不同英雄具有不尽相同的状态成长，狙击手从远程武器中获得更多加成而不再具有标记被动，\n-针对压力的平衡，提高了暴击回压几率，击杀回压几率受当前状态修正；\n-盾系武器具有力量修正，对远程伤害的格挡更为有效；\n-疯狂面具现在是头饰而非遗物；十字军头盔格挡几率提高；翡翠头环现在降低增压速度；\n-时光沙漏、回复药剂、星盘等物品改动；\n【其他】：\n-横屏现在可用；完整了英文支持（感谢翻译大佬们）；快捷栏最大数目提高到8；\n-地图生成算法改进；为女巫添加了解锁条件；\n-诸多bug与纰漏修复；
scenes.changesscene.info0.3.2a=[190727]修复与调整；\n\n【修复】\n-修正了boss层的错误传送；\n-修正了治愈神符无效的问题；\n-修正了幽灵的装备等级；\n-其他问题；\n【其他】\n-新的敌人萤光虫加入到地牢；\n-炼药现在受种子类型影响，盾系武器格挡值提高，现在有一次攻防判定，失败则仅提供基础格挡；\n-部分生成单位击杀时不可回压，天狗幻象具有低闪避，弩炮，骷髅骑士，蝙蝠，拳套等调整；\n
scenes.changesscene.info0.4.0=[191005]全新特质系统，新的敌人与物品，伤害计算与平衡性改动；\n\n【更新】：\n-全新特质系统：重做了特质结构，新增超过30种特质，从2级开始英雄每4级将获得新的能力，作为代价，每章节升级卷轴数量下调到2；\n-新的敌人灰烬头骨加入到地牢；\n-古老者之眼，尖刺大盾等加入到地牢；\n【调整】：\n-魔法伤害现在穿透护甲格挡，英雄具有初始魔抗，酸元素从游戏中移除，魔法抗性现在与元素抗性独立结算；\n-众多怪物的数值调整，现在怪物移动时不会随手关门；\n-特质：露水瓶更多回复，现在由女巫持有，而非女猎手；\n-影之灵龛，蓄血圣杯等物品加强，拳套升级时获得攻速加成，不再受磨刀石作用，短剑等武器力量需求降低1点；\n【其他】：\n-为盾系武器添加了完整的描述；\n-英雄选择界面改动以准备排列更多英雄；

scenes.welcomescene.update_msg=-SISTEM PERK!\n-Musuh dan item baru;\n-Penyesuaian kerusakan dan keseimbangan;
