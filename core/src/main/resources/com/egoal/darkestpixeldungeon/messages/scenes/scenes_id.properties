# changelist
scenes.changesscene.title=Perubahan Terbaru
scenes.changesscene.warning=_Maaf, perubahan terbaru hanya tersedia dalam bahasa Tionghoa.\nMasukan dan saran dapat dikirim ke altomediaindonesia@gmail.com_

scenes.changesscene.info0.1.0=[180419]总体而言降低了难度：\n\n-降低了陷阱出现的几率；\n-扩大了背包的容量，并且现在拥有三个饰品位；\n-添加了一个简陋的村庄层，而不是直接出现在地牢的第一层；\n-露水优先收集到露水瓶中，且回复量与最大生命值相关（女猎手获得加成）；\n-新的职业女巫已添加，未完成；\n-降低了单位视野，且受到新加入的场景光源影响，相应地，火把的掉率提升。照明将成为重要的冒险资源；\n-增强了食物对饥饿的补充；\n-添加了新物品药剂试纸；
scenes.changesscene.info0.1.1=[180426]女巫基本完成，光照改动：\n\n-初始血量由20提升到22，平衡了血量成长，现在血量随等级呈非线性提升，前期提升较快，在25级时与原来相同；\n-确定了女巫特质，围绕女巫添加了一些新物品，女巫现在可以正常使用了，留下一个专精职业未完成。\n-火把掉率大降，且随着地牢的深入，掉率将会更低。火把价格降低且商店必定出售火把；\n-提高了火把视野，但降低了火把持续时间，现在火把在快熄灭时提供更短的视野；\n-削弱了棱光法杖的光照效果；\n-村庄层的所有奖励下调（现在村庄层过于轻松，之后会回来的:)），且现在npc不可破坏；\n-贴图更新，场景效果微调；\n-修复了成吨的bug，留下了一些已知的和未知的bug；
scenes.changesscene.info0.1.2=[180506]职业改动，村庄层游戏性增强，贴图更新：\n\n-法师专精术士重做：术士使用灵魂技能进行战斗，现在术士的能力要阴暗得多；\n-女巫特质与专属物品改动：女巫闪避更低，初始力量提升为10，萃取瓶调整，绯红女王削弱；\n-重做了村庄层的地形生成，且启用了地形装饰；更多的村民（任务未完成）；\n-露水瓶改动：由于容量的扩充，重生十字的祝福需求改为15，现在露水瓶可以小口使用了，现在露水瓶拥有清洗功能，移除火焰和淤泥；\n-试纸变更：现在试纸检测有害性而非鉴定对应的药剂；\n-修正了场景光源的摆放，且初期光源更充足；\n-添加了测试中的新属性——压力（当前游戏无效）；\n-贴图更新和替换，其他改动；\n-部分bug修复；
scenes.changesscene.info0.1.3=[180517]更丰富的村庄，平衡性调整，新敌人：\n\n【更新】：\n-新村民灰心哥已添加，村庄层杰西卡的任务现在已经完善；\n-新的敌人骷髅骑士已经添加到监狱层；\n-必要的新物品；新物品类型——书本；\n【主要调整】：\n-现在完美通关（获取胜利肖像图）判定为从村庄层离开；\n稍微强化了英雄体质；现在大部分地牢生物拥有视野优势；\n-影之灵龛：现在施法需要消耗时间，亡灵单位死亡不再触发吸纳，添加了技能说明，修正了摄魂术判定；\n-女猎手：新的特质——视界和视野均提升1点，狙击手专注的目标将被观察；\n-棱光法杖：修正了光照提供的bug，现在被棱光法杖击中的单位将被观察；\n-干枯玫瑰：现在幽灵可以带下楼；\n剧毒药剂：现在为液态；\n【其他】：\n-少量贴图替换，文本补全；\n-修复新职业带来的成就解锁问题，修复一些bug；

scenes.changesscene.info0.2.0=[180605]战斗伤害重做，全新压力机制，新的房间类型：\n\n【更新】：\n- 伤害处理、抗性机制重做：现在伤害区分类型，可以附带元素和属性，详见指南；\n- 压力系统上线：新属性压力现在已经生效，与血量、护甲和饥饿共同成为重要的基本属性；\n- 新的房间神像房，新的物品；\n【主要调整】：\n- 战士新特质，饮酒获得更多回复，且不会醉酒；\n- 女巫基本特质完成，轻微修改了萃取瓶附魔几率，现在也具有初始远程武器了；\n- 远程武器享受力量加成，女猎手获得额外加成；\n- 现在影之灵龛可以通过特殊方式升级；\n- 蓄血圣杯更名为血精之盅，血祭伤害下调，从常规掉落中移除；\n- 背包再次扩容；\n- 伤害重做带来的众多数值改动；\n【其他】：\n- perk机制改动；\n- 主界面更改，教程系路标移除；\n- 修复与代码重构；
scenes.changesscene.info0.2.1=[180803]职业改动，房间完善，界面调整；\n\n【更新】：\n-女巫专精占星师现在可以正常使用了，相关新物品与新buff；\n-现在暴击率作为基础属性会随着等级地提升而提高；新物品暴击戒指；\n-新的神像加入到神像房，添加了相关新物品，亵渎拥有了正确的事件；神像类型概率调整，现在倾向于出现多种神像；\n-新的道具附魔台加入到炼金房；\n-工具栏调整，现在最大允许6个快捷栏；\n【主要调整】：\n-女巫：萃取瓶消耗的露水下调，现在附魔几率随使用次数提升；压力免疫几率下调；现在魔女可以强化众多药剂；\n-法师：影之灵龛现在是神器，需要装备才可使用；盗贼：初始时拥有额外的暴击率；\n-露水产生几率提高，回复量下调；\n-自然压力下调，平衡击杀、升级等回复；\n-催眠卷轴现在具有配额，睡眠不再因为血量满而打断，时间下调；\n-未强化的生命药水仅能移除流血debuff；\n【其他】：\n-部分怪物调整与伤害类型修正；\n-修正地牢指南，露水品消耗量的计算等；
scenes.changesscene.info0.2.1a=[180809]小版本主要提供紧急bug修正；\n\n【重要修正】：\n修正了一个元素抗性结算的bug——这导致附魔武器的攻击有时候无效；\n修正了雕像作为静态NPC对buff不免疫的bug；\n\n【其他】：\n-亵渎恶魔雕像会保留至多100金币；\n-星盘改为充能制，操作时间下调为0.5回合，这使得占星师能在一次战斗中多次使用星盘；禁锢由残废改为缠绕；\n-暴击戒指轻微加强；\n-战士：下调压力抗性。专精狂战士现在不会因为血量过低受到伤害而产生额外压力；\n-常规房间门被隐藏的概率下调，特殊房间不变；
scenes.changesscene.info0.2.2=[180902]全新商店系统；新怪物、武器；环境调整与众多修复；\n\n【更新】：\n-重做了商店系统，现在商人拥有不同类别且不仅存在于固定的楼层；神偷袖章暂时移除；\n-新的1阶武器战斗拳套、新的3阶武器水晶剑，调整了不同阶数武器的生成几率；\n-新的敌人疯子已经加入到地牢；\n【调整】：\n-现在英雄在地牢探索时并不会顺手除草，常规楼层的视野提高一点（视界不变）；\n-重做了魔神雕像；\n-轻微提高了物品的掉率，修改了装备的掉落分布，获得其他一阶武器成为可能；\n-削弱了额外力量带来的额外伤害；\n-骷髅骑士属性调整，且现在掉落酒水而非人性，在地牢的更深处出现；\n-众多敌人的抗性调整与一些伤害结算的改动；\n【其他】：\n-修复了附魔台对纹章的处理错误；\n-修正了女猎手的视野长度特质；\n-修正了灵魂标记对血量回复的计算错误，这导致每次以最大生命值进行回复；\n-修复了buff免疫判定失败的bug；\n-其他修复；\n\n【_祝老姐生日快乐，虽然你并不会看到:D_】
scenes.changesscene.info0.2.2a=[180909]修复与少量更新；\n\n【修复】：\n-修正了女巫通关肖像缺失的问题；\n-修正了魔神雕像无限触发与错误掉落的问题；\n-修正了影之灵龛的等级加成错误，修正了其导致的闪退问题，并补全了施法动画；\n\n【其他】：\n-新的神器黎曼的流形护盾加入到地牢；\n-踩踏已经被检测到的陷阱不再增加压力；\n-削弱了守望者特质与迷彩刻印的加成，但它们现在对已经采集过的高草同样有效；\n-上调了生命的回复速度，轻微降低了生命药水的掉落，现在未强化的生命药水并不会瞬间回复全部血量；\n-恶魔层不会出现商人，疯狂面具轻微加强；\n-稍微扩大了地图；\n-部分敌人的抗性调整，工具条调整，少量英文翻译与贴图更新；
scenes.changesscene.info0.2.2b=[180915]临时修复；\n\n【修复】：\n-修复了地图扩大带来的各种bug；\n-修正了遗骨掉落的bug；\n-修正了下水道有时候只有两张升级卷轴的问题；\n-修正了红树根的错误售价；\n-修正了弹道动画有时候会卡住的问题；\n-诅咒的号角不再充能；\n-修复、补全一些细节；\n\n【其他】：\n-护盾的一般判定由抗性结算提前到守方修正，不再抵抗精神伤害；\n-低等级黎曼的流形护盾冷却时间延长，满级与原来相同；\n-普通商人不再出售神器；\n-元素直接现在能格挡一些附加元素的伤害；\n-无论敌我，偷袭统一附加精准属性；\n-武器格挡现在与伤害类型相关：非盾类武器现在不可格挡魔法伤害，降低了盾类武器对魔法伤害的抵挡（约20%）；\n-一些抗性调整，主要是提高了非亡灵、非恶魔单位对光属性的抗性；\n\n【_最近bug频出，实在是抱歉打扰到了很多人，甚至让我一度想拉个内测群……不过还是算了。（回归潜水）_】
scenes.changesscene.info0.2.3=[180925]boss大修；平衡性调整；\n\n【更新】：\n-boss大修：\n--Goo：法球改为易伤，淤泥为被动触发；\n--Tengu：加入PhantomStrike技能，重做；\n--DM300：攻击有几率造成击退；\n--King：地图重做，战斗强化；\n--Yog：Yog存活期间将给予英雄ViewMark，且与拳头共享视野；\n-新的遗物镀金铜像加入到地牢；\n【调整】：\n-击杀经验区之外怪物不可回复压力；初始红树根作为perk由战士独有；\n-武僧：不再是亡灵单位，高位攻击视为暴击；疯子：嚎叫具有精准；\n-疯狂面具：升级时不再给予精神伤害，精神伤害的加成系数上调；腐化法杖：现在与spd相似（参考0.6.5c）；灵能震爆：现在对boss单位只造成20%最大生命伤害（魔法）；\n【其他】：\n-地图尺寸控制；\n-artifact统一翻译为遗物；暴击音效与文本修改等；\n-众多修复；\n\n【_记住，通常更新列表中只包含更重要的改动，更多细节见工程目录README.md（地址见“关于”）_】

