scenes.changesscene.info0.2.4b=[181111]修复与平衡；\n\n【修复】：\n-现在具有存档备份机制，仅在生成楼层时进行备份，长按读取按钮可以手动回档；\n-真的修正了Tengu层的问题；\n-骷髅骑士麻痹时反击等异常的怪物表现；\n-现在骨手穿戴负等级戒指仍能升级，buff改为延长而非附加，移除麻痹的可能；\n\n【其他】：\n-星盘机制改动，现在拥有两个槽位，祈唤的正面技能会被缓存，重新变为cd制；\n-现在骷髅死亡的爆炸伤害接受格挡；\n-降低了铁匠和小恶魔的任务需求；\n-灵视药剂强化后给予SharpVision而非延长灵视时间；火把持续时间提高到250回合；古老者之手掉率下调；\n-现在种子包为开局持有；黑暗环境怪物的额外刷新速度下调；\n-玫瑰幽灵改为召唤时间而不是自然损血，汉化了玫瑰幽灵的所有话语，并补齐了其说话的全部触发（才发现原来幽妹这么多话，没看过的快去用用:D）；
