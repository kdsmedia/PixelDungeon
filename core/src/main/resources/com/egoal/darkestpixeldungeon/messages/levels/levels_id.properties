###traps
levels.traps.alarmtrap.name=Jebakan alarm
levels.traps.alarmtrap.alarm=Jebakan memancarkan suara menusuk yang bergema di seluruh dungeon!
levels.traps.alarmtrap.desc=Jebakan ini tampaknya terhubung ke mekanisme alarm keras. Memicunya kemungkinan akan membangunkan semuanya di lantai ini

levels.traps.blazingtrap.name=Jebakan menyala
levels.traps.blazingtrap.desc=Menginjak jebakan ini akan menyalakan campuran kimia kuat, membakar area luas.

levels.traps.chillingtrap.name=Jebakan pembeku
levels.traps.chillingtrap.ondeath=Kau menyerah pada jebakan pembeku...
levels.traps.chillingtrap.desc=Saat diaktifkan, bahan kimia di jebakan ini akan memicu pembekuan instan di lokasinya.

levels.traps.confusiontrap.name=Jebakan gas kebingungan
levels.traps.confusiontrap.desc=Memicu jebakan ini akan melepaskan awan gas kebingungan di area sekitarnya.

levels.traps.cursingtrap.name=Jebakan pengutukan
levels.traps.cursingtrap.curse=Perlengkapan yang kau pakai menjadi terkutuk!
levels.traps.cursingtrap.desc=Jebakan ini berisi sihir jahat yang sama dengan item terkutuk. Memicunya akan mengutuk beberapa item di area sekitarnya.

levels.traps.disarmingtrap.name=Jebakan pelucutan
levels.traps.disarmingtrap.disarm=Senjatamu diteleportasi pergi!
levels.traps.disarmingtrap.desc=Jebakan ini berisi sihir teleportasi spesifik, yang akan memindahkan senjata korbannya ke lokasi lain.

levels.traps.disintegrationtrap.name=Jebakan disintegrasi
levels.traps.disintegrationtrap.one=Jebakan menghancurkan %s-mu!
levels.traps.disintegrationtrap.some=Jebakan menghancurkan sebagian %s-mu!
levels.traps.disintegrationtrap.ondeath=Kau dibunuh oleh jebakan disintegrasi...
levels.traps.disintegrationtrap.desc=Saat dipicu, jebakan ini akan menembak target dengan sinar disintegrasi, memberikan kerusakan signifikan dan menghancurkan item.

levels.traps.distortiontrap.name=Jebakan distorsi
levels.traps.distortiontrap.desc=Dibuat dari sihir anjang asal tidak diketahui, jebakan ini akan menggeser dan mengubah dunia di sekitarmu.

levels.traps.explosivetrap.name=Jebakan peledak
levels.traps.explosivetrap.desc=Jebakan ini berisi beberapa bubuk peledak dan mekanisme pemicu. Mengaktifkannya akan menyebabkan ledakan di area sekitarnya.

levels.traps.firetrap.name=Jebakan api
levels.traps.firetrap.desc=Menginjak jebakan ini akan menyalakan campuran kimia, membakar area sekitarnya.

levels.traps.flashingtrap.name=Jebakan kilatan
levels.traps.flashingtrap.desc=Saat diaktifkan, jebakan ini akan menyalakan bubuk kilatan kuat yang tersimpan di dalamnya, sementara membutakan dan melumpuhkan korbannya.

levels.traps.flocktrap.name=Jebakan kawanan
levels.traps.flocktrap.desc=Mungkin lelucon dari mage amatir, memicu jebakan ini akan menciptakan kawanan domba magis.

levels.traps.frosttrap.name=Jebakan embun beku
levels.traps.frosttrap.ondeath=Kau menyerah pada jebakan pembeku...
levels.traps.frosttrap.desc=Saat diaktifkan, bahan kimia di jebakan ini akan memicu pembekuan kuat di lokasinya.

levels.traps.grimtrap.name=Jebakan grim
levels.traps.grimtrap.ondeath=Kau dibunuh oleh ledakan jebakan grim...
levels.traps.grimtrap.desc=Sihir destruktif yang sangat kuat tersimpan di jebakan ini, cukup untuk membunuh instan semua kecuali pahlawan tersehat. Memicunya akan mengirim ledakan sihir mematikan jarak jauh ke karakter terdekat.

levels.traps.grippingtrap.name=Jebakan cengkeram
levels.traps.grippingtrap.desc=Memicu jebakan ini akan mengirim cakar berduri sepanjang tanah, merusak kaki korban dan mengakarnya di tempat.

levels.traps.guardiantrap.name=Jebakan penjaga
levels.traps.guardiantrap.alarm=Jebakan memancarkan suara menusuk yang bergema di seluruh dungeon!
levels.traps.guardiantrap.desc=Jebakan ini terhubung ke mekanisme sihir aneh, yang akan memanggil penjaga dan membangunkan semua musuh di lantai ini.
levels.traps.guardiantrap$guardian.name=penjaga yang dipanggil
levels.traps.guardiantrap$guardian.desc=Penampakan biru ini tampaknya gema yang dipanggil dari salah satu penjaga batu dungeon.\n\nMeskipun patung itu hampir tidak berwujud, _%s,_ yang dipegangnya, terlihat nyata.

levels.traps.lightningtrap.name=Jebakan petir
levels.traps.lightningtrap.ondeath=Kau dibunuh oleh pelepasan jebakan petir...
levels.traps.lightningtrap.desc=Mekanisme dengan sejumlah besar energi tersimpan di dalamnya. Memicu jebakan akan melepaskan energi itu ke apa pun yang mengaktifkannya.

levels.traps.oozetrap.name=Jebakan lumpur
levels.traps.oozetrap.desc=Jebakan ini akan memercikkan lumpur kaustik saat diaktifkan, yang akan membakar sampai dicuci bersih.

levels.traps.paralytictrap.name=Jebakan gas pelumpuh
levels.traps.paralytictrap.desc=Memicu jebakan ini akan melepaskan awan gas pelumpuh di area sekitarnya.

levels.traps.pitfalltrap.name=Jebakan jurang
levels.traps.pitfalltrap.desc=Plat tekanan ini berada di atas lantai yang cukup lemah, dan kemungkinan akan runtuh menjadi lubang jika ditekan.

levels.traps.poisontrap.name=Jebakan racun
levels.traps.poisontrap.desc=Peniup panah kecil pasti tersembunyi di dekat sini, mengaktifkan jebakan ini akan membuatnya menembakkan panah beracun ke arahmu.

levels.traps.rockfalltrap.name=Jebakan longsor batu
levels.traps.rockfalltrap.ondeath=Kau tertimpa oleh jebakan longsor batu...
levels.traps.rockfalltrap.desc=Jebakan ini terhubung ke serangkaian batu longgar di atas, memicunya akan membuat mereka berjatuhan.
levels.traps.rockfalltrap.roar=Suara batu yang jatuh membangunkan musuh di dekatnya.

levels.traps.speartrap.name=Jebakan tombak
levels.traps.speartrap.ondeath=Kau ditusuk oleh jebakan tombak...
levels.traps.speartrap.desc=Jebakan tombak klasik, primitif tapi efektif. Karena sifatnya yang sederhana, jebakan ini dapat aktif berkali-kali tanpa rusak.

levels.traps.summoningtrap.name=Jebakan pemanggilan
levels.traps.summoningtrap.desc=Memicu jebakan ini akan memanggil sejumlah monster dari area ini ke lokasi ini.

levels.traps.teleportationtrap.name=Jebakan teleportasi
levels.traps.teleportationtrap.desc=Apa pun yang memicu jebakan ini akan dipindahkan ke lokasi lain di lantai ini.

levels.traps.toxictrap.name=Jebakan gas beracun
levels.traps.toxictrap.desc=Memicu jebakan ini akan melepaskan awan gas beracun di area sekitarnya.

levels.traps.trap.rankings_desc=Dibunuh oleh: %s

levels.traps.venomtrap.name=Jebakan gas racun
levels.traps.venomtrap.desc=Memicu jebakan ini akan melepaskan awan gas racun mematikan di area sekitarnya.

levels.traps.warpingtrap.name=Jebakan pelengketan
levels.traps.warpingtrap.desc=Apa pun yang memicu jebakan ini akan dipindahkan ke lokasi lain di dungeon.

levels.traps.weakeningtrap.name=Jebakan pelemahan
levels.traps.weakeningtrap.desc=Sihir gelap di jebakan ini menyedot energi dari apa pun yang bersentuhan dengannya.

levels.traps.worntrap.name=Jebakan aus
levels.traps.worntrap.nothing=Tidak terjadi apa-apa...
levels.traps.worntrap.desc=Karena usia dan mungkin kualitas kerja yang buruk, tampaknya jebakan ini telah aus sehingga tidak akan melakukan apa pun saat dipicu.



