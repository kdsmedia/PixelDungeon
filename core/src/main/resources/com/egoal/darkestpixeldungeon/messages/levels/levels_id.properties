levels.level.inactive_trap_desc=Jebakan telah dipicu sebelumnya dan tidak berbahaya lagi.
levels.level.statue_desc=Seseorang ingin menghias tempat ini, tapi gagal, jelas.
levels.level.alchemy_desc=Jatuhkan beberapa biji di sini untuk membuat ramuan.
levels.level.empty_well_desc=Sumur telah kering.
levels.level.lighton_desc=Cahaya langka di dungeon gelap.
levels.level.lightoff_desc=Tampaknya tidak berguna.
levels.level.enchanting_station_desc=Meja dengan energi arkana yang memungkinkanmu memindahkan enchantment dari satu perlengkapan ke lainnya.
levels.level.default_desc=Tidak ada yang menarik di sini.

levels.prisonlevel.water_name=Air dingin gelap.
levels.prisonlevel.empty_deco_desc=Ada noda darah lama di lantai.
levels.prisonlevel.bookshelf_desc=Ini mungkin sisa perpustakaan penjara. Mungkin terbakar?
levels.prisonlevel.exit_desc=Keluar.
levels.prisonlevel.locked_exit_desc=Pegangan besi tebal menghalangi jalan ke depan.

levels.sewerlevel.water_name=Air keruh
levels.sewerlevel.empty_deco_desc=Lumut kuning lembap menutupi lantai.
levels.sewerlevel.bookshelf_desc=Rak buku dipenuhi buku murah tak berguna. Mungkin terbakar?

levels.villagelevel.water_name=Air
levels.villagelevel.water_desc=Air jernih dan transparan mengalir di sini. Kau bisa masuk saat terbakar.
levels.villagelevel.statue_name=R.I.P
levels.villagelevel.statue_desc=Makam ini tampaknya telah dibangun beberapa tahun. Aku tidak tahu siapa yang membangunnya, dan aku tidak bisa melihat untuk siapa ia dibangun.
