levels.features.chasm.chasm=Jurang
levels.features.chasm.yes=Ya, aku tahu apa yang kulakukan
levels.features.chasm.no=Tidak, aku berubah pikiran
levels.features.chasm.jump=Apakah kau benar-benar ingin melompat ke jurang? Jatuh sejauh itu akan menyakitkan.
levels.features.chasm.ondeath=Kau jatuh hingga tewas...
levels.features.chasm.rankings_desc=Meninggal karena Benturan

levels.features.sign.dead_end=Apa yang kau lakukan di sini?!
levels.features.sign.tip_0=Kota Pixel menyambut petualang dari segala latar belakang!
levels.features.sign.tip_1=Hampir semua perlengkapan memiliki syarat kekuatan. Jangan terlalu memaksakan diri, memakai perlengkapan yang tak sanggup kau gunakan memiliki penalti besar!\n\nMenaikkan kekuatan bukan satu-satunya cara untuk memakai perlengkapan lebih baik, kau juga bisa menurunkan syarat kekuatan perlengkapan dengan Gulungan Peningkatan.\n\n\nItem yang ditemukan di dungeon sering belum teridentifikasi. Beberapa item memiliki efek tidak diketahui, yang lain mungkin ditingkatkan, atau diturunkan dan dikutuk! Item yang belum teridentifikasi tidak terduga, jadi berhati-hatilah!
levels.features.sign.tip_2=Terjun maju tanpa berpikir adalah cara bagus untuk terbunuh.\n\nMemperlambat sedikit untuk memeriksa musuh dan menggunakan lingkungan serta item demi keuntunganmu bisa membuat perbedaan besar.\n\nKau bisa ketuk dua kali atau tahan tombol periksa untuk mencari rahasia. Dungeon penuh jebakan dan lorong tersembunyi, buka matamu!
levels.features.sign.tip_3=Naik level itu penting!\n\nMemiliki level sekitar sama dengan lantai tempatmu berada adalah ide bagus. Kelaparan mungkin membuatmu terus bergerak mencari makanan, tapi jangan takut melambat sedikit dan berlatih.\n\n\nKelaparan dan kesehatan keduanya sumber daya, dan menggunakannya dengan baik bisa berarti membiarkan dirimu kelaparan untuk menghemat makanan, jika kau punya kesehatan cadangan.
levels.features.sign.tip_4=Rogue bukan satu-satunya karakter yang diuntungkan dengan menyelinap. Kau bisa mundur ke sisi lain pintu untuk menyergap lawan yang mengejar dengan pukulan pasti!\n\nSerangan apa pun pada lawan yang tidak sadar dijamin menemukan sasaran.
levels.features.sign.tip_5=Catatan untuk semua kru pemeliharaan & pembersihan saluran pembuangan: MUNDUR SEKARANG. Semacam monster lumpur telah bersarang di sini dan beberapa kru hilang saat mencoba mengatasinya.\n\nPersetujuan telah diberikan untuk menutup saluran bawah, area ini telah dikutuk, PERGI SEKARANG.
levels.features.sign.tip_6=Pixel-Mart - semua yang kau butuhkan untuk petualangan sukses!
levels.features.sign.tip_7=Identifikasi ramuan dan gulunganmu secepat mungkin. Jangan menundanya sampai saat kau benar-benar membutuhkannya.
levels.features.sign.tip_8=Lapar tidak menyakitkan, tapi kelaparan menyakitkan.
levels.features.sign.tip_9=Beberapa musuh sangat kuat dari jauh. Lari langsung ke mereka sering kurang efektif daripada bersembunyi dan membiarkan mereka mendekat.
levels.features.sign.tip_10=Thomas,\n\nKau telah menjadi teman yang baik, jadi aku akan menolongmu. Saat kau mulai shift malam ini, periksa sel Tengu, lalu pergi.\n\nTidak masalah jika tahanan mencoba melarikan diri, segera tidak ada yang bisa meninggalkan tempat ini.\n\nTapi monster itu harus tetap diamankan, jika dia lolos tidak ada yang tahu apa yang akan dia lakukan, pastikan sel Tengu terkunci, lalu pergi.\n\nJangan repot-repot mencariku setelah ini, seorang kapten harus tenggelam bersama kapalnya.\n- Warden Smith
levels.features.sign.tip_11=Pixel-Mart. Belanjakan uang. Hidup lebih lama.
levels.features.sign.tip_12=Saat kau diserang beberapa monster sekaligus, coba mundur ke belakang pintu.
levels.features.sign.tip_13=Jika kau terbakar, kau tidak bisa memadamkan api di air saat melayang.
levels.features.sign.tip_14=Tidak ada gunanya memiliki lebih dari satu Ankh belum diberkati sekaligus, karena kau akan kehilangan mereka saat dihidupkan kembali.
levels.features.sign.tip_15=BAHAYA! Mesin berat dapat menyebabkan cedera, kehilangan anggota tubuh atau kematian!
levels.features.sign.tip_16=Pixel-Mart. Kehidupan yang lebih aman di dungeon.
levels.features.sign.tip_17=Saat kau meningkatkan senjata yang terenchant, ada peluang menghancurkan enchantment tersebut.
levels.features.sign.tip_18=Di Sumur Transmutasi kau bisa mendapatkan item yang tidak bisa didapatkan dengan cara lain.
levels.features.sign.tip_19=Satu-satunya cara untuk menchant senjata adalah dengan meningkatkannya menggunakan Gulungan Infusi Magis.
levels.features.sign.tip_20=Senjata dilarang di hadapan Yang Mulia!
levels.features.sign.tip_21=Pixel-Mart. Harga khusus untuk pemburu iblis!
levels.features.sign.burn=Saat kau mencoba membaca tanda itu terbakar dalam api kehijauan.



