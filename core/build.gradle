apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing config: reads credentials from gradle.properties or env,
// falls back to the project-local keystore when not provided.
def keystoreFile = rootProject.file("pixeldungeon.jks")
def keystorePassword = project.hasProperty("PIXEL_KEYSTORE_PASS") ? project.PIXEL_KEYSTORE_PASS : "Kdsmedia@123"
def keyAliasName = project.hasProperty("PIXEL_KEY_ALIAS") ? project.PIXEL_KEY_ALIAS : "pixeldungeon"
def keyPasswordVal = project.hasProperty("PIXEL_KEY_PASS") ? project.PIXEL_KEY_PASS : "Kdsmedia@123"

android {
    namespace "com.egoal.darkestpixeldungeon"
    compileSdk 35

    defaultConfig {
        applicationId "com.altomedia.pixeldungeon"
        minSdk 21
        targetSdk 35
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword keystorePassword
            keyAlias keyAliasName
            keyPassword keyPasswordVal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            // R8/ProGuard and resource shrinking are disabled because this
            // legacy (2016-era) codebase relies on reflection and on class
            // FQNs at runtime (e.g. Messages.get uses Class.getName() to look
            // up localized strings, and Bundle resolves classes by name).
            // The previous keep rules only covered com.shatteredpixel.**,
            // which does not match this app's com.egoal.darkestpixeldungeon
            // package, so obfuscation broke runtime class-name lookups and
            // shrinkResources stripped dynamically-referenced resources,
            // causing an immediate crash on launch on all devices.
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation project(':SPD-classes')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
repositories {
    mavenCentral()
}
