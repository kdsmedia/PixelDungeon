apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace "com.watabou"
    compileSdk 37

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Optional NDK build; precompiled .so libs are provided in jniLibs.
    // The ndkDirectory access is deferred so the task doesn't fail when
    // the NDK is absent (the build then just uses the shipped .so files).
    tasks.register("ndkBuild", Exec) {
        description "builds JNI libs from source. Requires the Android NDK; optional."
        workingDir = "./src/main"
        def ndkDir = android.ndkDirectory
        if (System.properties["os.name"].toLowerCase().contains("windows")) {
            commandLine "cmd", "/c", "$ndkDir${File.separator}ndk-build " +
                    "NDK_APPLICATION_MK=./jniSources/Application.mk " +
                    "NDK_LIBS_OUT=./jniLibs"
        } else {
            commandLine "$ndkDir${File.separator}ndk-build " +
                    "NDK_APPLICATION_MK=./jniSources/Application.mk " +
                    "NDK_LIBS_OUT=./jniLibs"
        }
    }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
repositories {
    mavenCentral()
}